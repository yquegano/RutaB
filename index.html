blemente la fuerza de frenado. Esta tecnología funciona sólo con el motor en marcha. Por eso hay que tener cuidado al ser remolcado o si el motor se detiene en una bajada. 2. El freno de estacionamiento , también conocido como freno de mano o freno de emergencia, es un sistema independiente del freno principal de un vehículo. Su función es inmovilizar el vehículo cuando está estacionado para evitar que se desplace accidentalmente, especialmente en pendientes. El freno de mano generalmente se acciona mediante una palanca ubicada entre los asientos delanteros o mediante un pedal en algunos vehículos. En coches más modernos, puede ser un botón electrónico. Este freno suele actuar directamente sobre las ruedas traseras, bloqueándolas para impedir el movimiento. Es importante saber que a temperaturas bajo cero es conveniente hacer pruebas de frenado a baja velocidad. Si circulas por una calle inundada, o si has lavado el vehículo recientemente debes eliminar, también frenando, la eventual humedad en los tambores, especialmente si el vehículo ha estado estacionado. Además, debes saber que existen 2 tipos de frenos, los convencionales y los frenos antibloqueo o ABS . Estos funcionan de forma distinta por lo que es de suma importancia saber qué tipo de frenos tiene el vehículo en el que te desplazas. Testigo pastillas de freno desgastadas Testigo freno de mano Testigo error en sistema de frenos ABS", "17": "Ante una situación de emergencia, donde es necesario detener el vehículo lo más rápido posible, se debe considerar que uno de los mayores riesgos ante una frenada brusca es que las ruedas del vehículo se bloqueen y se deslicen sobre el pavimento. Cuando esto ocurre la distancia de frenado aumentará notablemente. Además, en estas condiciones es imposible controlar la dirección del vehículo, por lo que hay una gran probabilidad de que no se pueda evitar el obstáculo. El ABS (sistema de frenado antibloqueo) detecta el instante en que las ruedas se bloquean y reduce ligeramente la presión sobre los frenos, mientras se mantiene presionado a fondo el pedal de freno. Permite que las ruedas sigan girando y que la persona conductora mantenga el control sobre la dirección del vehículo. Si el ABS llegase a fallar, los frenos seguirán funcionando. El nivel del líquido de frenos periódicamente, según las indicaciones del fabricante. Este no se consume, por lo tanto, si disminuye es porque hay algún defecto mecánico. Además, si el nivel es bajo puede causar un siniestro. Que la carrera del pedal de freno no sea demasiado larga. Lo aceptable es que usted pueda presionar el pedal hasta más arriba de la mitad de su distancia al piso. Que los frenos actúen en forma pareja sobre las cuatro ruedas. Si están mal ajustados, en una frenada brusca, el efecto irregular puede hacer que el vehículo se desvíe hacia un costado. Que la posición del pedal no descienda cuando lo tienes fuertemente presionado. Si ello sucede, puede haber fugas. Que el pedal se sienta rígido y no elástico. Si el pedal cede en su punto de presión, probablemente haya entrado aire al sistema. Que las luces de freno funcionen. Posibles grietas en las mangueras por las que circula el líquido de frenos. Revísalas vigilando que no existan manchas en el suelo por fugas. Los plazos del líquido de frenos, indicados por el fabricante del vehículo. Una vez que caducan, debes cambiar todo el contenido. Que el freno de mano funcione correctamente. Este debe mantener el vehículo quieto en una pendiente o impedir que se pueda poner en marcha con el freno puesto. El estado de discos y pastillas de freno. Debes revisarlos periódicamente y prestar atención ante ruidos producidos por su uso. El funcionamiento de los frenos mediante pruebas de frenado a baja velocidad si has: circulado por vías inundadas, lavado el vehículo o si el vehículo ha estado guardado por un largo tiempo. RECUERDA CONTROLAR: Si bien algunas de las verificaciones recomendadas puedes efectuarla tú, en otros casos debes acudir a un taller mecánico.", "18": "Presión de aire demasiado baja Presión de aire correcta Presión de aire demasiado alta presión de los neumáticos Los neumáticos Los neumáticos son el único punto de apoyo del vehículo con la calzada, por esto, es de vital importancia controlarlos regularmente. El agarre de los mismos aporta la seguridad necesaria bajo cualquier condición meteorológica, incluso en situaciones difíciles. Para que los neumáticos cumplan bien sus funciones de frenado, agarre y direccionalidad, los dibujos o surcos de sus bandas de rodamiento deben tener una profundidad aconsejable mínima de 3 mm. Cuando la profundidad de tales dibujos es muy baja (inferior a 1,6 mm) empeora la fricción con el pavimento mojado, aumentando el riesgo de que se pierda el contacto con el pavimento a causa de la capa de agua que se forma adelante de los neumáticos. Debes acostumbrarte a revisar periódicamente tus neumáticos y a constatar que sus detectores de desgaste de la profundidad de los surcos no te indiquen que esta es inferior a 1,6 mm. Además, es importante revisar la presión del aire en ellos. Esta debe ser constante durante todo el año. Presión de aire demasiado baja Presión de aire demasiado alta En una o en las dos ruedas traseras . En las ruedas delanteras . Se pierde la adherencia de los neumáticos. Puede aumentar significativamente la tendencia al giro. La dirección del vehículo es más pesada, y por ende el vehículo es más pesado de manejar. Una baja presión de aire en una rueda delantera hace que el vehículo tienda a torcer hacia ese lado. De los distintos elementos de un vehículo, los neumáticos son los que requieren mayor revisión de parte de la persona conductora.", "19": "Controlar la presión de los neumáticos cuando estos estén fríos y respetar las recomendaciones del fabricante. Si la presión se ajusta cuando los neumáticos están calientes, se tendrá una presión inferior a la adecuada. Una presión inadecuada contribuye al riesgo de patinaje. Inspeccionar periódicamente la banda de rodadura. No debe tener cortes profundos ni grietas. Circular a una velocidad moderada alarga la vida de los neumáticos. Tener en cuenta que situaciones como circular con carga, o por un pavimento en mal estado o un clima caluroso, pueden acelerar el desgaste de los neumáticos. Aumentar levemente la presión de los neumáticos cuando llevas una carga muy pesada. Cuidar que los neumáticos se encuentren correctamente balanceados. Si detectas algo anormal en los neumáticos o en el comportamiento del vehículo (como vibraciones al circular, por ejemplo), es bueno buscar asesoría de un profesional. Podría haber un problema de desbalanceo. Los neumáticos deben ser cambiados al menos cada 5 años. Aunque tengan poco uso y su dibujo esté bien, el material envejece y pierden sus propiedades para rodar con seguridad. Es recomendable que acudas a un profesional para que te asesore en el cambio de neumáticos. Si subes escalones o veredas con tu vehículo, pueden producirse deformaciones en las llantas y cortes o roturas en los neumáticos. Cuando dejes la rueda de repuesto, asegúrate que esta se encuentre con la presión más alta sugerida y, si tuvieras que usarla, no exceder la velocidad máxima indicada por el fabricante. Puedes encontrar información sobre la presión de aire apropiada para los neumáticos de tu vehículo en el manual del fabricante o en una tabla que generalmente está adosada al marco de la puerta de quien conduce, en la guantera o en el compartimento del motor. RECUERDA: Si al ir conduciendo se revienta un neumático trasero , debes girar el volante hacia el lado en que se desvía la cola del vehículo. En ambos casos, debes detenerte lentamente al costado de la vía. Si de lo contrario, se revienta un neumático delantero , debes frenar de forma suave sosteniendo el volante firmemente. importante , qué hacer en caso de reventar un neumático Testigo presión de neumáticos Un desgaste irregular puede deberse a problemas de alineamiento, de amortiguación o a que has estado conduciendo con una presión de aire inadecuada. Debes mantener los neumáticos a la presión indicada por el fabricante para evitar que el automóvil patine. Un desgaste notorio en la zona central de la banda de rodamiento significa que los neumáticos se han usado con exceso de aire, mientras que un desgaste sólo en los extremos de la banda indica que se han usado con menor presión de aire que la recomendada.", "20": "10 metros Asegúrate de que tus luces estén limpias, que funcionen y que sus focos de luces altas y bajas estén bien ajustados. Un mal ajuste puede encandilar a las demás personas usuarias de la vía y causar un siniestro. Puedes controlar tus luces bajas para que no cieguen a otras personas estacionando tu vehículo en un lugar plano y a unos 10 m de una pared o algo similar, luego encender tus luces bajas y verificar que el alto de la luz proyectada en la pared sea inferior a la altura de los faros de tu vehículo respecto del nivel del suelo. Las luces Todos los vehículos deben estar provistos de focos y luces exteriores para poder ver y ser visto por las demás personas cuando se conduce en la oscuridad o cuando la visibilidad se encuentra reducida, así como para poder advertir al resto determinadas situaciones o la intención de realizar algunas maniobras. Así, los automóviles y, en general, los vehículos motorizados de 4 o más ruedas, deben poseer los siguientes focos y luces exteriores: Parte delantera: Dos focos que proyecten luces altas y bajas, dos luces de estacionamiento y dos luces destellantes de viraje. Luces de niebla Luces de viraje, emergencia o advertencia de peligro Faros: Luces delanteras Luces de viraje, emergencia o advertencia de peligro Luz placa patente Luces altas Luz de estacionamiento Luces bajas Luz roja fija de estacionamiento y luz de freno Luz de retroceso Luz de freno La posición de las luces dependerá del modelo de tu vehículo. Parte trasera: Dos luces de estacionamiento, dos luces destellantes de viraje, dos luces de retroceso, dos luces rojas fijas, dos luces de freno y una luz que ilumine la placa patente del vehículo. Adicionalmente, debe contar con una tercera luz de freno ubicada al centro de la luneta trasera de los automóviles, jeeps, furgones, station wagon, camionetas y vehículos de transporte de escolares. Luces de advertencia de peligro : Las luces intermitentes de advertencia de peligro sólo deben utilizarse cuando el vehículo se encuentra detenido a consecuencia de una falla o avería, para avisar que temporal-", "21": "Testigo luces neblineras encendidas Testigo luces de posición y cruce encendidas Testigo luces altas encendidas Testigo luces bajas encendidas Testigo avería de luces exteriores Testigo luces de advertencia de peligro mente se está obstruyendo la circulación, así como también para advertir a las personas conductoras, que vienen detrás tuyo, de un peligro u obstrucción que haya más adelante, como por ejemplo, cuando estas siendo remolcado. Deben usarse sólo por el tiempo que sea necesario para que las demás personas noten tu advertencia, nunca como una excusa para un estacionamiento peligroso o ilegal. Luces neblineras: Algunos vehículos, además de contar con las luces antes señaladas que son obligatorias, están provistos también de luces neblineras. Estas pueden usarse sólo cuando la visibilidad se encuentre considerablemente reducida, ya sea a consecuencia de la niebla o de una lluvia torrencial, y deben apagarse tan pronto mejore la visibilidad. Los espejos Los espejos permiten a la persona conductora ver el tráfico que circula detrás de ella y a la derecha e izquierda del vehículo. La mayoría de los espejos laterales son convexos, por lo que las imágenes se visualizan más lejanas y/o más pequeñas de lo que están en la realidad. Ten presente que aun cuando tus espejos estén muy bien regulados, al conducir siempre existirá una zona sobre la cual no tendrás visión. Estos sectores son denominados puntos ciegos o ángulos muertos (en la imagen están indicados de color amarillo). Debes tener especial precaución con las y los usuarios vulnerables, es decir, con peatones, ciclistas y motociclistas. Recuerda que estos no cuentan con una carrocería para protegerse y absorber el impacto de un siniestro de tránsito.", "22": "Cinturones de seguridad Limpiaparabrisas Ventilación Líquido limpiaparabrisas Que al tomar el volante, tus brazos queden ligeramente flexionados. Tener buena visibilidad a través del parabrisas delantero, luneta trasera y ventanas laterales. Si no es así, activa el ventilador, ajusta las boquillas del aire y enciende el desempañador de la luneta trasera. Ajustar los espejos para tener buena visibilidad hacia atrás y hacia los lados. Debes ver lo más posible de la calzada y de los vehículos que vienen detrás. Tener las puertas cerradas. Si llevas niñas y/o niños, asegúrate de que vayan bien sujetos y que no puedan abrir las puertas desde el interior. Llevar los dispositivos reflectantes para casos de emergencia, extintor de incendio, rueda de repuesto y herramientas necesarias para su cambio. No llevar algún objeto suelto en el vehículo, que pueda lesionar a alguien en caso de una frenada brusca. Tener calzado que te permita un adecuado control de los pedales. Mirar a tu alrededor y chequear los puntos ciegos antes de poner tu vehículo en movimiento. Tener luces, vidrios y espejos limpios para tener siempre una buena visibilidad. ANTES DE CONDUCIR, CONTROLA: SIEMPRE DEBES ASEGURARTE DE: Neumáticos Desempañador luneta trasera Luces Frenos Espejos Puertas Bocina", "23": "La energía del movimiento Tienes que tener en cuenta que las personas que se desplazan en un vehículo están sujetas a las leyes físicas del movimiento y sus consecuencias. Por ejemplo, un vehículo que se aproxima a una curva tiende a continuar su desplazamiento en línea recta. Al mover el volante del automóvil, estás desviando la trayectoria recta que seguiría a causa de la fuerza de inercia, sin embargo, si conduces a una velocidad demasiado alta, la fricción puede no ser suficiente para mantener al vehículo en la carretera. Al aumentar la velocidad al doble, la energía del movimiento aumenta 4 veces, lo que hay que tener presente, por ejemplo, al acercarse a una curva, ya que costará más mantener la dirección. Siempre es importante que trates de prever el estado del camino con anticipación, que estimes bien el radio de una curva y que prestes atención a los obstáculos que puedas encontrar, como hojas caídas, derrames de combustible o alguna otra cosa que pueda hacer que la carretera esté resbaladiza. La magnitud de la fuerza centrífuga o fuerza lateral que en una curva tiende a sacar al vehículo de la carretera, depende directamente de la velocidad y de lo cerrada que sea la curva. La distancia de detención La distancia de reacción es la distancia que recorre el vehículo (manteniendo su trayectoria y velocidad) La energía y las leyes físicas Al enfrentarte a una curva, reduce la velocidad con tiempo antes de que comience la curva y acelera suavemente a la salida de la misma. Detención total del vehículo. Metros recorridos. S R F mientras la persona conductora reacciona frente a una situación. Esta, depende del tiempo de reacción de la persona y de la velocidad a la que circula. Un tiempo normal de reacción es un segundo. En este segundo, un vehículo a 36 km/h recorre 10 metros, 20 metros si lo hace a 72 km/h, etc. Además, existe la variable relacionada a la experiencia en conducción, que permite tener mejores tiempo de reacción. Puedes estimar aproximadamente la distancia de reacción, multiplicando por tres la primera cifra de la La distancia de detención (S) es la suma de la distancia de reacción (R) y la distancia de frenado (F).", "24": "velocidad. Este ejercicio es válido hasta los 99 km/h. Para velocidades sobre 100 km/h, debes considerear los 2 primeros dígitos (ver imagen de referencia). La distancia de frenado es la distancia que recorre el vehículo desde que se presiona el pedal de freno hasta su detención total. Esta depende de la velocidad, del estado de la calzada, de la pendiente, del estado de los frenos y neumáticos, y de la forma de frenar. La distancia de frenado crece al cuadrado con el aumento de la velocidad. Así, si duplicas la velocidad, la distancia de frenado aumenta cuatro veces; si la triplica, la distancia de frenado aumenta 9 veces, etc. (3x3) (5x3) (7x3) (9x3) (11x3) 33 m 9 m 15 m 21 m 27 m 70 km/h 50 km/h 30 km/h 110 km/h 90 km/h distancia de reacción ( r ) aproximada (metros recorridos en 1 segundo) En cuanto a la forma de frenar, hay varias maneras. La persona conductora que planifica su conducción disminuyendo a tiempo la presión sobre el acelerador y reduciendo su velocidad, hace menos uso del pedal de frenos y aumenta su seguridad. En situaciones inesperadas es necesario saber frenar correctamente. Ya se ha señalado que las ruedas atascadas impiden guiar el vehículo. Por ello, al comenzar a frenar se debe presionar el freno con la mayor fuerza posible. Si el vehículo no cuenta con frenos ABS y se bloquean las ruedas, hay que reducir en seguida la presión sobre el pedal de freno soltándolo. Distancia de reacción. Distancia de frenado, asfalto seco. Distancia de frenado, asfalto mojado. variación de distancia de detención Distancia de Reacción y Frenado según velocidad y estado del asfalto.", "25": "La fuerza de gravedad Si has andado en bicicleta y has tratado de frenar al ir cuesta abajo en una pendiente muy pronunciada, es probable que hayas experimentado que existen fuerzas que pueden provocarte dificultades. Ese mismo fenómeno se presenta cuando conduces un vehículo motorizado. Por ello, cuando veas señales que adviertan sobre pendientes pronunciadas, tómate tiempo para bajarlas. A veces, es necesario conducir en una marcha baja para que el motor vaya frenando y no se calienten los frenos. Recuerda nunca desenganchar el motor ya que pierdes el control del vehículo. Características de los vehículos y su influencia en la conducción Los vehículos tienen diferencias que hay que tener presentes antes de conducir. Por ello, antes de sentarse al volante de un auto desconocido, hazte estas preguntas: ¿Tiene tracción delantera, trasera o en las cuatro ruedas? ¿Qué tipo de sistema de frenos tiene? ¿Dónde está ubicado su centro de gravedad? Es importante saber los riesgos que implica un desplazamiento del centro de gravedad del vehículo, es decir el punto donde se encuentra su mayor peso. Por ejemplo, un vehículo con motor delantero normalmente es más pesado en su parte frontal, y tiene entonces una tendencia a girar menos. Por ende, si colocas una carga pesada en su parte trasera, tenderá a girar más de lo esperado y, al perder la fricción con el pavimento, dará un giro de 180º y continuará marchando con la parte trasera hacia delante. Respecto a la tracción de las ruedas, si tienes un vehículo con tracción delantera y realizas una aceleración mayor de lo que permite la fricción, las ruedas comenzarán a resbalar sobre sí mismas, lo que puede llevar a perder el control del vehículo y no poder girar. Si esto sucede, deja de acelerar y retoma tu trayectoria. Por otro lado, si tienes un vehículo con tracción trasera y las ruedas pierden fricción, pueden producirse uno o varios coletazos. En estas circunstancias, continúa acelerando y gira la dirección hacia la trayectoria. Un vehículo con tracción en las cuatro ruedas proporciona una posibilidad de conducción considerablemente mejor en pavimentos difíciles. En lo demás, estos vehículos con tracción en las cuatro ruedas se comportan igual que el resto. Otro factor que puede influir en que un vehículo gire más o menos de lo esperado es la presión de aire en sus neumáticos.", "26": "Elementos de seguridad Anteriormente, se han revisado algunos de los elementos de seguridad activa. A continuación, conoceremos en detalle algunos elementos de seguridad pasiva. El cinturón de seguridad Los cinturones de seguridad tienen la función de salvar vidas y disminuir las posibilidades de sufrir lesiones en un siniestro. Además, brindan mayor comodidad, mejor control y contribuyen a reducir el cansancio. Todas las personas que viajan en el automóvil deben ir bien sujetas, incluso aquellas que viajen en los asientos traseros. Nunca permitas que dos personas viajen sujetas con un mismo cinturón. El uso de este elemento en los asientos traseros, es obligatorio sólo si el vehículo tiene un año de fabricación 2002 o posterior. El cinturón de seguridad requiere ser utilizado de forma correcta, de no ser así, este dispositivo no protegerá de forma adecuada, y, además, puede ocasionar graves lesiones. elementos de seguridad activa elementos de segurida pasiva Son los sistemas que sirven para prevenir la ocurrencia de un siniestro de tránsito. Por ejemplo: neumáticos, frenos y luces. Son los componentes de seguridad del vehículo que contribuyen a evitar o reducir las consecuencias de un siniestro de tránsito. Por ejemplo, el cinturón de seguridad y el airbag. 30 km/h 50 km/h 70 km/h 90 km/h Un choque a 50 km/h sin llevar puesto el cinturón de seguridad, es como tirarse a la calle desde un cuarto piso sin red de seguridad. Si la velocidad es de 70 km/h, ello equivale a lanzarse desde un séptimo piso. Después de sufrir un siniestro, el cinturón podría estar dañado y su uso ya no ser seguro. En este caso deberás reemplazarlo por uno nuevo. Revísalo después de alguna eventualidad. Chocar a una velocidad de 90 km/h provoca los mismos efectos que una caída desde el piso 11.", "27": "uso correcto del cinturón de seguridad Banda toráxica: cruza desde el punto superior del hombro hasta la cadera. Una vez abrochado. Banda abdominal: entre los dos puntos inferiores de fijación. La banda toráxica debe pasar sobre la clavícula , a medio camino entre el hombro y el cuello, y debe descender por el centro del pecho . Si está colocada sobre el cuello o sobre un pecho, puede provocar graves lesiones durante el siniestro. Si se coloca sobre el hombro, puede deslizarse hacia fuera durante el siniestro y reducir al mínimo su eficacia. La banda abdominal debe colocarse sobre los huesos de la cadera , siempre por debajo del abdomen , incluso en el caso de una persona embarazada. Si se coloca sobre el abdomen, puede provocar graves lesiones internas durante el siniestro. Una vez abrochado el cinturón, debes estirarlo ligeramente hacia arriba para que quede bien ceñido a tu cuerpo . Siempre debes asegurarte de que no esté enganchado o torcido y que el cierre esté en buenas condiciones. Si el cinturón tiene holguras, recorrerás una mayor distancia durante el siniestro, pudiendo impactar contra el volante o el parabrisas. Si las bandas no están bien estiradas, el cinturón perderá eficacia y puede provocarte lesiones durante el siniestro.", "28": "No pongas toallas o almohadones (tanto sobre el asiento como detrás de la espalda), o algunas fundas especiales . Todos estos elementos pueden favorecer el deslizamiento de la persona, anulando las características del asiento enfocadas a evitar el efecto submarino. Pónte el cinturón de forma adecuada ; si pones la banda abdominal de forma incorrecta, es más probable que te deslices por debajo de ella. Las consecuencias del no uso del cinturón de seguridad no son individuales. Las personas que se ven impulsadas hacia adelante desde el asiento trasero no sólo se lesionan a sí mismas, sino que también pueden lesionar a la persona conductora o a quien viaje en el asiento delantero. Algunas personas conductoras se niegan al uso del cinturón de seguridad dando excusas que ponen en duda la eficacia de este elemento de seguridad pasiva. A continuación, analicemos algunas de estas: “No voy a sufrir siniestros, por lo tanto, no necesito usar el cinturón de seguridad” Nadie espera sufrir un siniestro de tránsito, pero el hecho de que no hayamos sufrido ningún siniestro no quiere decir que nunca vayamos a sufrir uno. “Sobrevivir a un siniestro de tránsito depende de la suerte o de la casualidad, por lo que el cinturón no es de gran ayuda” El estudio de miles de siniestros demuestra que las personas que no usan el cinturón, tienen el doble de probabilidad de fallecer en ellos. “En caso de tener un siniestro, es mucho más seguro salir eyectado del vehículo” Si un persona sufre un siniestro y por no tener puesto el cinturón de seguridad sale eyectada del vehículo, la probabilidad de sufrir una lesión medular aumenta en un 1.300% y la probabilidad de resultar fallecida aumenta en un 300%, lo que demuestra claramente que es mucho más seguro quedar dentro del vehículo. “En muchos siniestros, las personas quedaron atrapadas dentro del vehículo por el cinturón de seguridad y fallecieron por no poder salir a tiempo” Los estudios y estadísticas revelan que cada 1 millón, sólo en un siniestro, llevar el cinturón de segucómo evitar el efecto submarino Siempre debes conducir en una postura adecuada ; no reclinar el asiento en exceso, ya que no debes conducir “semi-acostado/a”. Recuerda siempre que una postura adecuada al volante facilita el buen funcionamiento del cinturón de seguridad. Asegúrate de que el cinturón esté bien tensado . El efecto submarino aparece con mayor facilidad si el cinturón no está bien ajustado al cuerpo. Por esta razón también evita conducir con ropa de mucho volumen. El uso adecuado del cinturón de seguridad evita el llamado efecto submarino , el cual se produce cuando la persona, durante frenadas bruscas o siniestros, se desliza por debajo de la banda abdominal.", "29": "ridad puede ser negativo. La experiencia demuestra que, por el contrario, en la mayoría de los siniestros el cinturón puede salvar la vida de las personas ocupantes del vehículo o evitarles graves lesiones. “El cinturón de seguridad no es necesario cuando se conduce por vías urbanas, donde la velocidad de circulación es baja” Cerca del 80% de los siniestros con víctimas, ocurren en zonas urbanas. Por ejemplo, un golpe frontal a tan sólo 30 o 40 km/h podría resultar mortal con facilidad si la cabeza de la persona impacta contra el parabrisas o contra el volante, lo que suele ocurrir con frecuencia. “Si el recorrido es corto, no hace falta ponerse el cinturón de seguridad” Ya hemos señalado que sufrir un siniestro siempre es posible, por lo que es importante utilizar el cinturón en todos los desplazamientos. Además, la mayoría de los siniestros con víctimas se producen a pocos kilómetros de sus casas. “Mi vehículo ya tiene muchos sistemas de seguridad, por lo que el cinturón no es tan importante” Ningún dispositivo de seguridad del vehículo es capaz de sustituir al cinturón, inclusive todos ellos están diseñados para funcionar de una forma complementaria al cinturón. Por ejemplo, si se activa el airbag en caso de una colisión frontal y no llevas puesto tu cinturón de seguridad, puedes sufrir graves lesiones cuando se infle la bolsa de aire. “El cinturón resulta incómodo” En la medida en que uses habitualmente tu cinturón de seguridad, desaparecerá esa incomodidad inicial que algunas personas experimentan. Muchas personas con el tiempo llegan a sentirse incómodas e inseguras, cuando no usan el cinturón de seguridad. “Durante el embarazo, no hay que utilizar el cinturón, ya que resulta peligroso para el bebé” Las personas embarazadas también deben ponerse el cinturón de seguridad, debido a que el riesgo de lesionar y perder el bebé durante un siniestro es mayor si no lo usan (por ejemplo, si ella golpea el vientre contra el volante). “En los asientos traseros no hace falta llevar el cinturón de seguridad” En un siniestro, las personas de los asientos traseros que van sin cinturón pueden salir eyectadas, pudiendo golpear mortalmente a las demás personas; su uso no sólo puede salvar su vida, sino también evitar que provoquen graves lesiones a las y los demás ocupantes del vehículo.", "30": "El airbag El airbag es una bolsa de aire que se infla en apenas unas milésimas de segundo al producirse un impacto. Hay diferentes tipos: laterales, para la cabeza, frontales, traseros, entre otros. Además, existen distintos tipos de tecnología para que estos se activen ante un impacto. Es recomendable que, a la hora de adquirir un vehículo nuevo, te informes sobre la existencia de airbags en él y sobre el funcionamiento de los mismos. Este elemento de seguridad pasiva, permite proteger a las personas ocupantes del vehículo de las siguientes formas: 1. Frena suavemente el movimiento de las y los ocupantes, evitando que las fuerzas de deceleración produzcan daños en ellos, especialmente en la cabeza (por ejemplo, reduce la probabilidad de ocurrencia de lesiones cervicales). 2. Evita el impacto de las y los ocupantes contra algunos elementos del interior del vehículo: el volante, el tablero, el parabrisas o las ventanas. 3. Protege la cara y los ojos de los fragmentos de cristal u otros elementos que pueden desprenderse, por ejemplo, del parabrisas. Al producirse un siniestro, la bolsa de aire se infla a una velocidad de hasta 300 km/h, por lo que, si el cinturón no retiene a la persona y el airbag impacta contra ella antes de haber llegado a extenderse completamente, puede llegar a provocarle graves lesiones por la enorme fuerza del golpe. La eficacia del airbag frontal se basa en la combinación del uso del cinturón de seguridad, una buena posición de las manos frente al volante y la regulación del apoya cabezas al nivel de las orejas. Se ha estimado que el uso de airbag frontal en conjunto con el cinturón de seguridad, puede llegar a reducir un 20% la probabilidad de sufrir lesiones mortales. Cuando el sistema de airbag presente fallas en su estado de reposo, se prenderá el testigo del airbag y este debe ser revisado a la brevedad. El airbag no es eficaz si no se utiliza junto con el cinturón de seguridad. Testigo del Airbag Nunca debes poner un Sistema de Retención Infantil en el asiento delantero, con excepción de los vehículos con cabina simple, siempre y cuando se haya desactivado el airbag previamente.", "31": "Los apoya cabezas Cuando un vehículo sufre un impacto por atrás es sometido a una aceleración hacia adelante, lo que provoca que el asiento empuje el cuerpo de la persona también hacia adelante. Si la cabeza de esta no se encuentra apoyada, oscila respecto del torso, lo que provoca un violento cambio de dirección en el cuello, que toma forma de “s” al principio y posteriormente se va hacia atrás. Este movimiento se denomina efecto latigazo . La forma de prevenir este efecto y las lesiones cervicales asociadas, es usando los apoya cabezas. No utilizarlo correctamente podría desencadenar en un esguince cervical, una lesión muy peligrosa y mucho más frecuente de lo que pensamos. Este puede afectar a diversas estructuras del cuello, como los músculos, las articulaciones o los ligamentos, y trae como consecuencia dolores musculares y de cabeza, una disminución de la movilidad del cuello, vértigo o mareos, entre otras molestias, que con frecuencia podrían prolongarse algunos meses. En ocasiones las lesiones producidas por el latigazo cervical llegan a ser mucho más graves. Por ejemplo, si se dañan las vértebras cervicales, la persona podría llegar a sufrir algún tipo de discapacidad irreversible, como una tetraplejia. el correcto uso del apoya cabezas La posición exacta es detrás de la cabeza. El borde superior del apoya cabezas debe quedar situado entre el límite superior de la cabeza y la altura de los ojos. Esta posición debe ser ajustada a cada persona dentro del vehículo, en los asientos delanteros y traseros. Nunca debes ubicarlo por debajo de tu cabeza, esto produce que su efectividad se reduzca drásticamente. La separación entre la cabeza y el apoya cabezas debe ser la mínima posible y nunca superior a 4 cm. 4 cm", "32": "CAPÍTULO 3 Convivencia Vial", "33": "Una buena Convivencia Vial es aquella en donde las personas conductoras de vehículos, usuarias de las vías, peatones y pasajeros, se respeten entre sí, resultando una interacción armoniosa y segura. Para lograr dicho cometido, es necesario que todas las personas involucradas gocen de un nivel adecuado de Educación Vial . La Educación Vial es la adquisición de valores imprescindibles para la conducción, que trata de inculcar hábitos y actitudes positivas de convivencia como el respeto (respeto a tu vida y la de las demás personas), la solidaridad, la comprensión, el perdón y la tolerancia. Además, es la incorporación de normas de comportamiento (Ley de Tránsito) y el conocimiento de un catálogo de señales que afectan al tránsito. Todo esto con el fin de contribuir a la Seguridad Vial . La meta de la Seguridad Vial es la eliminación total de los siniestros de tránsito , partiendo de la reducción de los mismos y la minimización de sus consecuencias. Para que esto ocurra, se debe tener una adecuada y real percepción del riesgo . Dicha percepción, en la mayoría de las personas conductoras suele estar por debajo del riesgo real, pues suele ser una percepción subjetiva y poco realista, lo cual produce que el riesgo percibido sea prácticamente nulo. Debes saber que mientras conduces un automóvil corres riesgos y que un comportamiento incorrecto en estas circunstancias puede poner en peligro tu vida y la de las demás personas. La imprudencia y la falta de práctica de quienes conducen son el mayor riesgo a la hora de conducir. El parque automotriz del país ha crecido incesantemente en los últimos años, por lo que también ha aumentado el número de siniestros que se producen. Para combatir este crecimiento de la siniestralidad vial todas y todos debemos colaborar. El primer paso es eliminar la idea de que “los siniestros de tránsito solo le ocurren a los demás”. Los siniestros tienen en su mayoría poco de accidentales. Hay que ser conscientes y adquirir una percepción del riesgo objetiva, pues la mayoría de los siniestros son evitables . Muchas veces las personas conductoras de automóviles, por querer demostrar su habilidad al volante, no son conscientes de los riesgos a los que exponen a las y los demás usuarios al efectuar conductas imprudentes como circular a exceso de velocidad, adelantar en zonas no permitidas o el no respeto a otras señales de tránsito. Al no respetar una luz roja de un semáforo o un paso de peatones señalizado, no solo se está cometiendo una infracción a la Ley de Tránsito, sino que se está atentando contra la Convivencia Vial, poniéndose en riesgo a sí mismas y a las demás personas. Convivencia Vial Cerca del 90% de los siniestros de tránsito con víctimas son producto de fallas humanas, de errores producidos por personas conductoras con una equivocada percepción del riesgo. e d u c a c i ó n v i a l SEÑALES s e g u r i d a d v i a l VALORES NORMAS", "34": "Para practicar una conducción segura y responsable y para reducir las probabilidades de sufrir un siniestro vial, se deben eliminar, en la medida de lo posible, los factores de riesgo . Estos tipos de comportamientos erróneos atentan contra la convivencia ordenada en el tránsito y contra el principio de confianza que lo inspira, donde todas las personas conductoras esperan que cada integrante del tránsito cumpla con su papel, que es respetar las normas de convivencia y comportamiento vial. Debes ser consciente de que estas acciones o infracciones no quedan impunes, a pesar de que no siempre te fiscalizarán y sancionarán, estas imprudencias pueden desencadenar un siniestro de tránsito donde tú y otras personas serán afectadas. Quien se pasa una luz de un semáforo en rojo, no desconoce el significado reglamentario de esa luz y sabe qué consecuencias sancionadoras tendría si lo viera Carabineros o personal de Fiscalización. Esta conducta debilita el principio de confianza. La Educación Vial es indispensable en la educación social e individual de las personas, pues todas y todos seremos peatones, ciclistas, usuarios de vehículos o conductores en distintos momentos de nuestras vidas. Necesitamos de la Educación Vial para convivir de una forma ordenada y respetuosa con las demás personas, y en un entorno amable, positivo y justo. Sobre el Entorno Vial Las vías por donde circulan los vehículos conforman el Entorno Vial. Pero este Entorno Vial es mucho más que calles o carreteras por las que se puede circular. Este es un espacio de convivencia social, un entorno en el que se desarrollan las personas, como seres humanos. Los vehículos son conducidos por personas, las calles y las carreteras las utilizan personas, y todas estas personas son en realidad el tránsito . Para que el tránsito sea ordenado, seguro y no se produzcan siniestros, existen reglas que se deben cumplir y que se apoyan en una serie de principios como el de la confianza . Sin este principio no se podría salir a la calle, si no se confiara en que las demás personas cumplirán su rol, nadie se atrevería a conducir su automóvil. Al circular, se espera que todas y todos respeten su sentido de circulación y no invadan el tuyo, que respeten los semáforos, que cedan en paso cuando se tiene la prioridad, etc. Alcohol y drogas , que disminuyen las facultades para conducir. Velocidad inadecuada , presente en la cuarta parte de los siniestros con víctimas. principales factores de riesgo Las distracciones son un factor importante y una de las principales causas de siniestros. Fatiga, cansancio, sueño o somnolencia , el consumo de fármacos o conducir en situaciones de estrés . Todos estos factores de riego pueden generar la pérdida de control del vehículo.", "35": "La Convivencia Vial exige un compromiso con la Educación Vial, un compromiso con las demás personas y contigo misma/o. Quienes conducen automóviles deben ser conscientes de que son integrantes de la circulación, junto con peatones y ciclistas, que son las y los usuarios vulnerables. La precaución es el principio fundamental en la conducción de un vehículo. Debemos ser conscientes y admitir que todas las personas pueden equivocarse y cometer errores, por lo tanto, debes estar pendiente a las condiciones del tránsito practicando la conducción defensiva y preventiva para garantizar tu seguridad. Tu actitud en la conducción de automóviles debe ser de respeto hacia las demás personas y hacia ti. Debes mantener en todo momento una actitud segura, responsable y tranquila, lo que te ayudará a conducir mejor. En el Entorno Vial, la solidaridad es la mejor virtud que se puede tener al conducir un vehículo. Esta permite que dicho entorno funcione armónicamente ya que se llevan a cabo acciones como ceder el paso, dejar espacio suficiente para permitir que te adelanten, tener consideración con las y los usuarios vulnerables, entre otras prácticas en pos de una buena Convivencia Vial. Recuerda siempre ver y ser visible. La prevención será siempre su principal defensa. Mantén una distancia suficiente y prudente con los demás vehículos y las y los usuarios. No des por hecho que las demás personas conductoras se hayan dado cuenta de tu presencia. Conduce a la defensiva. Respeta siempre las normas del tránsito y aprende su significado. Mantén tu vehículo en perfecto estado de funcionamiento. Conduce sólo si te encuentras en las mejores condiciones físicas y mentales. Sé una persona considerada y amable con las demás personas usuarias de las vías. claves para la convivencia vial Cuando debas conducir, no lo hagas transformando la ocasión en un momento de molestia o angustia. Para conducir con seguridad debes estar suficientemente protegida/o. Utiliza siempre el cinturón de seguridad, y asegúrate que quienes te acompañan también lo usen. Debes conducir siempre a una velocidad adecuada y segura, la que te permite mantener el control del vehículo y reaccionar a tiempo ante cualquier situación imprevista. Tu prisa no debe poner en riesgo tu vida ni la de las demás personas. Tómate todo el tiempo que sea necesario para conducir. Concéntrate sólo en la conducción. Adapta tu conducción a las condiciones climáticas, ambientales y del pavimento.", "36": "CAPÍTULO 4 La persona en el tránsito", "37": "Las personas que conducen un vehículo tienen una gran responsabilidad y se encuentran permanentemente solucionando problemas. Sabemos que la capacidad del ser humano tiene un límite, el cual solemos olvidar al momento de tomar el volante. Por ello, es importante que al momento de iniciarte como persona conductora, estés consciente de cómo actúan las y los usuarios del tránsito, y su capacidad para tomar decisiones. Es necesario practicar la conducción y obtener seguridad frente a los estimulos visuales y la percepción de estos , así se dará origen a decisiones seguras, pues las reglas del tránsito no siempre pueden ofrecer la claridad para saber cómo se resuelven determinadas situaciones. Lo decisivo en muchos casos es el sentido común, el buen juicio y la responsabilidad. Esto se adquiere a través de la experiencia en la conducción, traducida en horas al volante. Tomar buenas decisiones contribuye a un tránsito respetuoso y más seguro. La persona en el tránsito Estadísticas internacionales señalan que las personas conductoras principiantes sufren siniestros de tránsito (en los que no se ven involucrados otros vehículos) con una frecuencia 10 veces mayor que aquellas con más experiencia en la conducción. efectos visuales en la conducción Densidad de pauta: sucede cuando hay mayor densidad de objetos, provocando que estos se perciban más lejanos de lo que se encuentran. Perspectiva lineal: las líneas convergentes parecieran encontrarse en un punto que está más alejado de lo que realmente se encuentra. Tamaño relativo: es el efecto que se produce cuando objetos del mismo tamaño son percibidos de tamaño distinto debido a la distancia entre estos y la persona. El objeto más distante se interpretará como uno de menor tamaño pero realmente no es así. Sobrecubrimiento: un objeto que cubre a otro parece hallarse más cerca del ojo.", "38": "Está oscureciendo, está nublado y la visibilidad es reducida. La carretera parece desaparecer al final de una cuesta ( ). La velocidad es de 90 km/h y el conductor ve cómo la carretera continúa más allá. Él espera que haya una curva hacia la izquierda, justo decide cambiar de sintonía la radio y al volver su atención a la ruta, se sorprende con que la curva era hacia la derecha, viéndose obligado a maniobrar bruscamente, al mismo tiempo que afloja la presión sobre el acelerador. Por suerte, el pavimento está seco y tiene buena fricción. Después de la curva a la derecha hay una hacia la izquierda, y poco después de esta se acerca algo que parece ser una motocicleta, pero resulta ser un automóvil cuyo foco izquierdo va apagado ( ). Luego, el automovilista se ve obligado a reducir la velocidad, ya que va a sobrepasar a una ciclista y la carretera es demasiado estrecha para dar cabida a tres vehículos; el riesgo es muy alto. Posteriormente, el conductor se cruza con un vehículo cuyas luces bajas son muy potentes (quizás estén mal ajustadas), y sorpresivamente descubre a un peatón que transita a escasos metros adelante de su vehículo. Este peatón no lleva nada reflectante, pero por suerte caminaba por el borde de la calzada, lo que permite evitar un siniestro ( ). El conductor comienza a sentir una sensación de disgusto. Piensa en lo ocurrido en el último kilómetro y, a la vez, a 90 km/h, ingresa a una zona con bosques a ambos lados de la carretera. Con su atención dispersa, descubre dos animales que están cruzando de izquierda a derecha, a unos 100 metros adelante de su automóvil. El conductor frena levemente y continúa a una velocidad más baja, ya que luego virará a la derecha ( ). Rápidamente llega al cruce, y al virar a la derecha, sobrepasa la línea central, que marca el eje de la calzada ( ). Sin embargo, no ocurre un siniestro porque no venían vehículos en sentido contrario. Afortunadamente, el conductor llega a salvo a su destino. A continuación, analizaremos el recorrido de una persona conductora: 1 2 3 4 5 Puedes ver esta historia animada pinchando aquí o escanenado el código QR. 1 2 3 4 5", "39": "A lo largo de estos kilómetros se han manifestado aspectos importantes del tránsito y del comportamiento de quien conduce. Estos serán examinados, conjeturando acerca de lo que pudo suceder. En la posición 1, el conductor interpretó mal el terreno: esperaba una curva hacia la izquierda, pero la curva era hacia la derecha. Luego, de igual modo, interpretó mal al auto que llevaba un foco roto, creyendo que era una motocicleta. Estas interpretaciones erróneas del entorno , que son bastante comunes, pueden ser muy peligrosas. Surgen cuando los indicios en cuanto a distancia y forma son insuficientes o poco claros. Otros ejemplos de interpretaciones erróneas son cuando al conducir por terreno montañoso o sinuoso, se tiene la sensación de ir cuesta abajo, en circunstancias que lo hace cuesta arriba; o cuando los focos sucios o con luz poco potente de un vehículo hacen que este parezca encontrarse a mayor distancia de la real. Una especie de imagen estereoscópica aparece una vez que el cerebro ha hecho su interpretación, pero esta capacidad de percibir distancias funciona sólo cuando se trata de distancias cortas. A distancias superiores a los 50 m los indicios y pistas del entorno adquieren más importancia a la hora de juzgar distancias. ¿Por qué es importante saber esto? Porque, en ocasiones, carecerás parcialmente de ciertos indicios o estos se presentarán de un modo confuso o incluso no existirán, por ejemplo, cuando hay niebla, cuando está oscuro o cuando te encandiles por la luz; y el resultado puede ser interpretaciones erróneas muy peligrosas. Por lo tanto, una buena regla es mostrar desconfianza de las propias percepciones y no conducir cuando exista cansancio. Falta de concentración Volvamos al caso del conductor que acabamos de presentar. Con seguridad, una causa que contribuyó a que fuera sorprendido por la curva a la derecha fue el hecho de que se desconcentró al poner su atención en el cambio de sintonía de la radio. Hacer dos cosas al mismo tiempo puede resultar muy riesgoso, especialmente tratándose de personas conductoras con poca experiencia en conducción. Por una parte, porque estas pueden perder con mayor facilidad el control de su vehículo, y, por otra, porque podrían tener mayor dificultad para enfrentar una situación difícil. Además de llevar las dos manos sobre el volante, es importante concentrarse en el tránsito. Por ello, no debes conducir si sientes molestia o disgusto por algo que te ha sucedido y evita las discusiones mientras conduces. Los problemas emocionales que desvían los pensamientos, ocuparse de la radio, de un teléfono, fumar o comer mientras conduces, influyen negativamente en la seguridad del tránsito. Las distracciones al conducir son causa de muchos siniestros. Si te distraes tendrás menos tiempo para reaccionar ante un imprevisto, ya que tardarás más tiempo en recibir información. ¡Conducir requiere toda tu atención!", "40": "Capacidad de reacción En el relato, el conductor reaccionó rápidamente cuando estuvo a punto de salirse del camino en la primera curva: demostró buena capacidad de reacción. El movimiento del volante y la reducción de velocidad salvaron la situación. El tiempo de reacción de las personas conductoras tiene gran importancia cuando se enfrentan a una situación difícil. Sin embargo, debes tener presente que en una comparación entre quien tiene un menor tiempo de reacción y quien conduce a baja velocidad, es este último quien logrará detener el vehículo primero. Con frecuencia se piensa que las y los conductores jóvenes reaccionan en cualquier situación con mayor rapidez que quienes tienen más edad. Esto es falso. El tiempo de reacción de una persona joven suele ser menor si se refiere sólo a la reacción simple; es decir, la reacción ante una señal que se sabe que se va a presentar, pero este tipo de situaciones no se dan con mucha frecuencia en el tránsito. En situaciones reales que requieren reacciones complejas, en las que deben interpretarse rápidamente muchas impresiones, las personas conductoras expertas tienen una reacción mucho más rápida. El grupo de edad “más rápido” corresponde a quienes tienen entre 35 y 50 años. Posteriormente, a medida que la edad va aumentando, el tiempo de reacción va siendo mayor. Capacidad visual El conductor se vió sorprendido al descubrir a un ciclista a pocos metros de su vehículo. Esto nos lleva a pensar en nuestra capacidad para ver en la oscuridad y descubrir los objetos importantes en el tránsito, ya que los seres humanos no contamos con la agudeza visual de otros seres vivos, como por ejemplo el halcón y los felinos. Al conducir en la oscuridad es frecuente que se presenten efectos de ceguera , ya que, a pesar de que no se miren directamente las luces de los vehículos que vienen en sentido contrario, es posible que algunos rayos de luz se reflejen dentro del ojo, empeorando por corto tiempo la visión. Adaptarse a los cambios de iluminación lleva cierto tiempo. Cuando se pasa a un recinto oscuro desde la luz del día y a pleno sol, al principio se ve muy mal; incluso, durante algunos momentos puede que no se vea nada. La ceguera real temporal que se produce al mirar directamente a los focos de un vehículo, tiene un efecto mucho más grande y prolongado, y puede ocasionar serios riesgos de siniestro. Otras ocasiones de ceguera pueden darse, por ejemplo, cuando tras conducir en un túnel se sale a la luz del sol, o cuando al atardecer el sol da directamente a los ojos. Recordemos que el conductor de nuestro relato descubrió al peatón a unos pocos metros de distancia. Quizás ello se debió a que las luces del vehículo que venía en sentido contrario estaban mal ajustadas. Pero la verdad es que la distancia de visibilidad en un cruce de vehículos que van con luces bajas no supera los 15 o 20 metros; cuando no hay tal cruce es posible ver las demarcaciones de la calzada hasta unos 70 metros. Cuando se produce un efecto de ceguera temporal, la distancia de visibilidad es de 0 metros.", "41": "Descubrir personas o animales en la vía puede resultar muy difícil en ciertas circunstancias. Por lo tanto, debes tener en cuenta que siempre existirá la posibilidad de encontrar un obstáculo en la vía. Ten precaución. Percepción selectiva Lo analizado hasta ahora hace referencia a las limitaciones del ojo para ver en la oscuridad, dado que el conductor tardó en descubrir al peatón que caminaba adelante. Pero también hay otras causas que limitan la visión. En efecto, no siempre se ve oportunamente lo que es más importante. Las personas funcionan de tal manera que descubren lo que están dispuestas a ver, esto es, lo que esperan encontrar. Dicho de otro modo, lo que no se espera ver no se descubrirá o tardará mucho más tiempo en hacerlo . Al ir conduciendo, se está expuesto a una gran cantidad de impresiones sensoriales pero no se tiene el tiempo necesario para descubrir y ponerle atención a cada una, por lo que el cerebro debe seleccionar los estímulos o información a la que prestará atención. Esta selección e interpretación no dependen de la casualidad, sino que se ven influenciadas por las expectativas, necesidades y por el estado de vigilancia . Lo anterior es aplicable a todas las personas y suele llamarse percepción selectiva . Sin embargo, existen diferencias entre las distintas personas en cuanto a cómo captan e interpretan una situación. Así, lo que una persona ha visto puede no haber sido percibido por otra, y la interpretación de un hecho puede ser muy diferente de una persona a otra. Después de realizado el proceso perceptivo, que es rapidísimo, se decide acerca de una acción . Esta acción, en combinación con la de las demás personas usuarias y con la carretera, conduce a un resultado , el que proporciona experiencia y nuevos conocimientos. Volvamos al relato, al momento donde el conductor se enfrenta con los animales cruzando la vía. Con seguridad, él no tenía ni el más mínimo presentimiento de que pudieran aparecer estas dos vacas, razón por la que tampoco estaba preparado para ello. Recordemos que el conductor tenía prisa, cuando estamos apurados tratamos de prescindir de todo aquello que “estorba” la conducción. La necesidad de llegar pronto al destino tiene como efecto que todo lo que “no viene al caso” no tenga cabida en la conciencia. En ese caso domina una especie de mecanismo de represión. El estar consciente y la consideración de la aparición de riesgos debieran llevar a una reducción de la velocidad, pero ello quizás supone una contrariedad para un conductor que tiene prisa. La utilización de vestimenta favorable para la visibilidad es una forma de contribuir a tu seguridad y la de los demás. La ropa oscura refleja sólo el 5% de la luz; la ropa blanca un 80%, y los materiales reflectantes entre un 90 y 98%. CÓMO APORTAR A AUMENTAR TU VISIBILIDAD A causa de la percepción selectiva se corre el riesgo de pasar por alto circunstancias importantes en el tránsito.", "42": "Localización Anteriormente, vimos como el conductor tuvo dificultad para percibir objetos importantes. En parte, ello se debió a las limitaciones del ojo para ver en la oscuridad, así como también al fenómeno de la percepción selectiva. Pero además, existe otro factor importante: la forma en cómo el conductor mira durante la conducción. ¿Hacia dónde, en qué orden y durante cuánto tiempo mira el conductor? Estos tres factores dependen de la habilidad de cada persona y van variando con la experiencia. Para poder comprender mejor, hay que saber cómo funcionan nuestros ojos. cómo funciona el ojo humano La pupila regula la entrada de luz variando de tamaño; esta aumenta en la oscuridad. El cristalino provoca la refracción del rayo de luz para que vaya a parar a la retina (en un ojo normal). La capacidad de refracción del cristalino puede modificarse con los músculos y fibras que se contraen y relajan. La retina cubre gran parte del extremo posterior del ojo y contiene células que transforman los rayos de luz en señales eléctricas, que a través del nervio óptico son transmitidas al cerebro , donde se percibe la imagen. En el punto en que el nervio óptico entra en el ojo se encuentra la llamada mancha o mácula ciega . En esta no hay células visuales, por lo que el reflejo de un objeto en él no puede ser percibido. ejercicio . Cierra el ojo izquierdo y mira fijamente el círculo con el derecho. Mantén el libro a unos 30 cm de distancia. Verás la cruz en tu visión periférica. Acerca despacio el libro a tu rostro. A cierta distancia desaparecerá la cruz. La razón es que ha ido a parar a la mácula ciega. Pupila Cristalino Músculos del Cristalino Mácula Lútea Mácula Ciega Retina Nervio Óptico", "43": "En las partes externas de la visión periférica, la agudeza o nitidez visual es menos del 0,1% , incluso en personas con visión normal. En la ilustración, el círculo amarillo corresponde a la zona en que se tiene la mejor agudeza visual. Con esto presente, será más fácil comprender la importancia que adquiere en el tránsito el localizar correctamente la mirada. Lo principal, es el efecto de compenetración entre la visión directa y la visión periférica. Se descubren las cosas con la visión periférica y se reconocen con la visión directa . Por ejemplo, si descubre algo en el ángulo derecho del ojo, mueves la cabeza y los ojos y lo reconoces. Aunque no se vea con gran nitidez con la visión periférica, es fundamental que se vea algo. Normalmente se tiene un campo visual de algo más de 180º. Una significativa reducción de este puede ocasionar serias dificultades en la capacidad de orientación. Las personas conductoras con experiencia, aprovechan su visión periférica más que quienes conducen recientemente. Esto es debido a que tienen una técnica de localización más sistemática, versus las personas que se inician en la conducción, que casi siempre ven lo que se encuentra cerca del vehículo y concentran su mirada en objetos fijos. Una reducción de la visión, del tipo que sea, puede influir significativamente en la capacidad de quien conduce. Un campo visual satisfactorio y una visión tal que permita percibir nítidamente objetos a diferentes distancias durante el día y la noche, son imprescindibles para poder resolver las situaciones más complicadas del tránsito. Procesamiento limitado de información Si vuelves por última vez al caso del conductor: en el cruce, él traspasó el eje de calzada al doblar a la derecha. Es probable que ello se debiera a que subestimó la velocidad que llevaba. Entre otras causas, tal subestimación se produce al acostumbrarse a cierta velocidad y a no recibir las impresiones sensoriales necesarias para darse cuenta de la velocidad a la que va. Los automóviles modernos tienen una marcha bastante silenciosa y sin vibraciones, lo que facilita el no advertir la velocidad a la cual se conduce. Asimismo, la conducción monótona por una carretera recta y en buen estado tampoco presenta variaciones en lo que a las impresiones de la vista se refiere. Visión periférica Visión directa Para la conducción, es fundamental que si percibes cualquier tipo de alteración en tu vista, consultes al médico y tomes las medidas que te indique. Subestimar la velocidad puede ser muy riesgoso, sobre todo porque puedes equivocarte al juzgar la distancia de frenado.", "44": "Las limitaciones de la capacidad del cerebro para procesar la información no sólo se reflejan en una estimación errónea de la velocidad que se puede llevar, sino también cuando se trata de captar información o cuando se juzga la distancia entre otros vehículos. Como ejemplo se puede mencionar el fenómeno denominado visión de túnel , en donde el campo visual se reduce a medida que aumenta la velocidad. Como lo muestra la imagen, cuanto mayor es tu velocidad, tanto más lejos fijas tu mirada, con lo que ves sólo una parte de tu campo visual y no puedes descubrir lo que hay a los lados de la carretera. Este efecto de visión de túnel se presenta también cuando la persona que conduce se encuentra en estado de estrés, por consumo de medicamentos o drogas. Otro fenómeno relacionado al procesamiento limitado de la información, es aquel que ocurre en la estimación de punto de encuentro entre dos vehículos . Calcular la velocidad de los vehículos que vienen en sentido contrario es muy difícil, y normalmente, la estimación del lugar en el que se cruzarán los vehículos resulta ser una estimación del punto medio de la distancia entre ambos; es decir, el cerebro presupone que los vehículos circulan exactamente a la misma velocidad, lo que rara vez coincide con la realidad. Como se aprecia en la imagen inferior, si conduces a 90 km/h y te cruzas con un vehículo que lo hace a 100 km/h, el punto de cruce real (PR) se hallará más cerca de ti que el punto estimado (PE) . La magnitud del error, que es la diferencia en metros entre PR y PE, aumentará mientras mayor sea la diferencia de velocidad entre tu vehículo y el que viene en dirección opuesta. 30° 42° 70° 100° A : 130 km/h B : 100 km/h C : 65 km/h D : 35 km/h velocidad campo visual A B B C C D D Si el cerebro fuera capaz de realizar este tipo de cálculos, muchos siniestros de tránsito no se producirían. PE: Punto estimado para el cruce. PR: Punto real del cruce. 90 km/h 100 km/h", "45": "Capacidad de raciocinio y decisión Para optar a una Licencia de Conducir es necesario haber cumplido 18 años (o excepcionalmente 17) ya que esta es la edad que la sociedad ha fijado como el momento donde se ha alcanzado el grado de madurez requerido para ser una persona conductora responsable, que es capaz de decidir, con razón suficiente, lo que debe hacer o no. Para aquello, cuenta con el desarollo adecuado de sus órganos y dispone de mecanismos psiológicos para controlar sus impulsos que van en contra de su propia decisión. Lamentablemente, este escenario no es igual para todas las personas. Las cifras demuestran que las personas conductoras jóvenes se ven involucradas con mayor frecuencia en siniestros de tránsito que aquellas de más edad y más experiencia. A continuación, revisaremos la explicación de este fenómeno , lo que te permitirá reconocer tus falencias al momento de conducir, corregirlas y reforzar aquellas conductas positivas: Las personas jóvenes tienen particularidades propias de la etapa vital en que se encuentran, que influyen en una mayor vulnerabilidad a sufrir siniestros de tránsito. Entre algunas de estas características se destacan: Excesiva necesidad de autoafirmación , lo que las hace más competitivas y dispuestas a no obedecer las normas del tránsito. Capacidad de conducción sobrevalorada , por lo que no consideran necesario tomar medidas de seguridad como ponerse el cinturón. Comportamiento exhibicionista en grupo , lo que las lleva a realizar maniobras de riesgo cuando van con compañía. Asumir mucho riesgo al conducir , lo que se puede relacionar con las competencias con otros vehículos. Influencia de la publicidad , especialmente por aquella que incita al riesgo. Las y los jóvenes son propensos a asumir riesgos durante la conducción debido a la baja percepción del mismo. Existen 5 factores que influyen en la evaluación y aceptación del peligro , y que podrían explicar su comportamiento que lleva a una mayor tendencia a sufrir siniestros: 1. Actitud frente al tránsito. No perciben la conducción como algo que puede llegar a ser peligroso, por lo que, difícilmente adoptarán comportamientos prudentes al conducir. 2. Atribuciones sobre el comportamiento. Muchas personas jóvenes creen que conducen mejor que el resto, por lo que le atribuyen los errores a las demás personas. 3. Experiencia en la conducción. Gran parte de las personas dentro de este rango etario no tienen demasiada experiencia en la conducción, lo que hace que no perciban bien los riesgos. 4. Nivel de control. Confían mucho en su capacidad de controlar el vehículo en situaciones peligrosas, por lo que asumen más riesgos. La conducción segura requiere equilibrio emocional", "46": "5. Baja percepción del riesgo. Muchas personas jóvenes no ven como peligrosas situaciones de riesgo (por ejemplo, conducir tras haber ingerido alcohol), por lo que su comportamiento será más arriesgado. Ser una buena persona conductora exige muchos conocimientos y destrezas: hay que ser capaz de registrar a tiempo muchas impresiones sensoriales; el cerebro debe poder interpretar dichas impresiones y adoptar una decisión rápida; hay que colocarse en la situación de otras personas usuarias de la vía, hay que ser capaz de actuar con determinación y en forma correcta, y algo muy importante: hay que ser una persona precavida. En realidad, apenas se puede comprender la cantidad de procesos que el cerebro tiene que efectuar, y se piensa que todo funcionará automáticamente cuando al ir conduciendo se presenten situaciones complicadas. Sin embargo, basta que la velocidad se exceda sólo un poco para que el límite de la capacidad se vea superado rápidamente, y la persona conductora cometa un error. Las y los conductores jóvenes no siempre han tenido la experiencia necesaria para determinar dónde está dicho límite, lo que usualmente les hace cometer más errores que las personas con más experiencia. Además, las personas jóvenes tienen menos práctica y por ello, mayor dificultad para corregir sus errores sobre la marcha. Capacidad de adaptarse a la realidad Por otro lado, para ser una persona conductora responsable, hay que adaptarse a la realidad en el tránsito. Es decir, debemos poder distinguir qué conductas son adecuadas y en qué contexto. Por ejemplo, existe quienes transitan efectuando maniobras temerarias e imprudentes imitando a corredores de carreras, poniendo en peligro a las personas usuarias de las vías, no respetando así las leyes y normas que rigen en el contexto del tránsito. La identidad Poseer una identidad implica tener una idea clara acerca de quién eres, qué principios y valores tienes, qué es lo que quieres, qué es lo que sabes y qué limitaciones tienes. Durante el período previo a alcanzar una identidad, en el que se busca conocer los límites, se puede cometer errores, que muchas veces pueden resultar fatales. En el caso de una persona conductora joven esto puede significar lamentablemente, por ejemplo, probar cuál es la velocidad máxima del vehículo, tratar de pasar una curva cerrada a 80 km/h o tratar de batir la marca de tiempo que lleva conducir cierto trayecto. Debes conocer tus habilidades y limitaciones, y ser capaz de aceptar que tienes falencias, las que en un determinado momento podrían ser la causa de una conducta errada. Autocontrol El saber controlarse en situaciones que afectan tu lado más vulnerable es también una muestra de madurez personal. Dominar la eventual irritación o ira, incluso cuando otra persona usuaria de la vía haya tenido una conducta incorrecta, o tu la percibas así, es primordial para tomar buenas decisiones.", "47": "La agresividad provoca que se perciba y juzge erróneamente una situación y además, lleva a tomar decisiones impulsivas. Debes tener la capacidad de mantener la atención y concentración durante largo tiempo. Un ejemplo recurrente de distracción que disminuye tu atención en la ruta, es querer ver una notificación en tu celular. Responsabilidad La madurez tiene una relación directa con una actitud responsable. Para que exista Seguridad Vial dependerá en gran medida de tu responsabilidad. Como persona conductora, muestra consideración hacia las demás personas usuarias, siguiendo las normas del tránsito y afrontando las consecuencias de tus acciones. La empatía Para conducir, es fundamental el desarrollo de la empatía. Una convivencia en armonía requiere de una participación activa de todas las y los actores. Se debe velar por la comprensión hacia las demás personas, la generosidad y la tolerancia. Estos comportamientos nos llevan a que como personas conductoras tratemos de ayudar, que nos sintamos en comunidad con el resto y que tengamos consideración con las y los usuarios vulnerables, es decir, ciclistas, motociclistas y peatones. Manejo de la presión social A veces, cuando una persona se encuentra en compañía de otras, reacciona en forma poco usual. Hace cosas que quizás no haría estando sola. De alguna manera, la presencia y las opiniones de otras personas significan mucho. Así, ser quien conduce cuando se va en el auto con amistades, puede requerir exigencias más altas que cuando se conduce sin compañía. Como persona conductora debes estar atenta a tus propias reacciones. ¿Influye la presencia de tus amistades en tu forma de conducir? ¿Deseas impresionarles? ¿Sientes inseguridad y tienes miedo de cometer algún error que provoque críticas y bromas? La influencia del grupo puede ser altamente negativa y contribuir a que efectues acciones imprevistas. Suele hablarse de la presión del grupo, para aludir al proceso de influencia social de este hacia ti, lo que te lleva a actuar siguiendo los deseos del grupo. Esto no necesariamente es siempre negativo. También la presión del grupo puede tener un efecto positivo si priman en él valores y principios de seguridad y de responsabilidad para con las demás personas usuarias de las vías. Si tus acompañantes o el grupo han ingerido droga y/o alcohol, es probable que más de alguien exprese sus ideas en forma alborotada y agresiva. ¿Serás capaz de negarte a las exigencias del grupo de conducir a mayor velocidad, acelerar violentamente y efectuar maniobras riesgosas? ¿O no podrás soportar que te tilden de una persona miedosa si te niegas a transportar mayor cantidad de pasajeros de la que acepta tu vehículo, o que se rían de tu prudencia para conducir?", "48": "Conductas que implican riesgos Investigaciones han concluido que existen conductas o variables, como las que se describen a continuación, que facilitan que se produzcan siniestros de tránsito o situaciones conflictivas. 1. La impulsividad La impulsividad, que significa que se actúa sin pensar, no previendo las consecuencias, es casi siempre negativa. Con frecuencia lleva a acciones que hacen que se pierda el control del vehículo o se sorprenda a otras personas usuarias de la vía, con el consiguiente riesgo de siniestros. 2. El no asumir la culpa Ciertas personas tienen una gran propensión a culpar a otras y se niegan a ver su propio comportamiento en el desarrollo de los acontecimientos. Evaden su culpa con pretextos, lo que en la mayoría de los casos genera la irritación de las demás personas. No asumen su responsabilidad y, por lo tanto, no modifican su conducta, ni sacan experiencias valederas, frenando así su desarrollo personal al no existir aprendizaje de las experiencias. El darse cuenta de que se ha cometido un error y comprender que el comportamiento como persona conductora debe mejorar constantemente, es muy importante cuando se desea desarrollar y convertir en una persona conductora segura. Capacidad de raciocinio y decisión Autocontrol Capacidad de adaptarse a la realidad Manejo de la presión social Responsabilidad La identidad La empatía REQUISITOS PARA UNA CONDUCCIÓN SEGURA Ante muchos siniestros de tránsito cabría preguntarse, ¿en qué grado fue responsable el grupo de que ocurriera el siniestro? Es importante que muestres y fomentes actitudes responsables y positivas, practicando las reglas básicas de seguridad de tránsito, convirtiéndote en una persona conductoras autónoma y segura.", "49": "3. La represión En diferentes situaciones de la vida las personas tratan de reprimir o dejar de lado los pensamientos que, de alguna manera, están impidiendo lograr sus objetivos. El contemplar y comprender la realidad correctamente, en lugar de tergiversarla o reprimirla, puede resultar decisivo cuando se conduce un vehículo. ¿Asumes el riesgo de seguir conduciendo a la misma velocidad a pesar de haber oscurecido y de que la carretera brilla a consecuencia de una fina capa de agua o hielo?, ¿eres una persona lo suficientemente temeraria para creer que el adelantamiento saldrá bien a pesar de que el espacio disponible es escaso? o ¿captas los riesgos o no te importan? En tu conciencia sabes que los riesgos aumentan. Sin embargo, en ocasiones, otras cosas parecieran ser más importantes, como llegar a cierta hora. Si bien la mayoría de las personas conductoras no tienden a reprimir los riesgos, existen otras que lo hacen frecuentemente, generando la disminución de la consciencia del riesgo y aumentando la tendencia a correrlos, e incrementándose así enormemente la probabilidad de sufrir un siniestro. 4. Formación de reacción Muchos siniestros de tránsito son consecuencia del mecanismo denominado formación de reacción. Este tiende a manifestarse en personas tímidas o que sienten temor a quedar en ridículo. Estas suelen albergar sentimientos contradictorios sobre sí mismas: por una parte desean parecer seguras y eventualmente osadas, pero por otra, se sienten inseguras. ¿Cómo resolver tal conflicto? Se puede reaccionar de distintas maneras, pero no es raro que uno de los sentimientos se vea fortalecido en exceso y el resultado sea que una persona insegura muestre un comportamiento agresivo. En determinadas circunstancias, una persona tímida puede desear mostrarse atrevida para sobresalir y recibir el elogio o la estimación de otras; lo que podría desencadenar riesgos en su conducción. 5. Validación Quizás alguien desea mostrar a sus acompañantes lo competente que es como persona conductora. Así, la acción se refuerza frecuentemente con palabras para que estas se den cuenta de cómo hay que conducir un automóvil. Otra forma de validarse puede derivar en un deseo de defender su derecho a toda costa. Sentir que eres superior al resto o pensar que tienes más derechos, lleva con frecuencia a pensar que algunas acciones de otras personas, son desafíos o provocaciones que aumentan los riesgos de sufrir o provocar un siniestro. Represión Impulsividad Formación de reacción No asumir la culpa (Responsabilidad) Validación CONDUCTAS QUE IMPLICAN RIESGOS", "50": "1era vez 2da vez 3era vez 2 años 5 años Cancelación 0,31 - 0,79 gramos por mil de alcohol en la sangre 0,8 + gramos por mil de alcohol en la sangre Bajo las influencia del alcohol Sin daño ni lesiones Lesión, daño causado Grado etílico Sin daños, daños materiales o lesiones leves Lesiones gravísimas o muerte Reincidencia bajo la influencia del alcohol Lesiones gravísimas o muerte 1era vez Reincidencia 1era vez 1era vez 2da vez o más 3 meses Tiempo suspensión de licencia Inhabilidad de por vida 3-5 años 4-6 años Estado de ebriedad LIBRO PARA LA CONDUCCIÓN EN CHILE LA PERSONA EN EL TRÁNSITO 50 Sobre el alcohol en la conducción En el año 2012 fue promulgada la modificación a la Ley de Tránsito, conocida como Ley Tolerancia Cero , que redujo los niveles permitidos de alcohol en el organismo para definir lo que se entiende por conducción bajo la influencia del alcohol y en estado de ebriedad , aumentando también las sanciones asociadas a la conducción con alcohol. Con una alcoholemia entre 0,3 y 0,5 g/l el riesgo de sufrir un siniestro es el doble que si no hubiera bebido. En cambio, si se llega a una alcoholemia entre 0,5 y 0,8 g/l, el riesgo es cinco veces más que si no hubiera bebido. alcohol y conducción 0,31 - 0,79 gramos por mil de alcohol en la sangre. 0,8 o más gramos por mil de alcohol en la sangre. Bajo la influencia del alcohol Estado de ebriedad Sanción: multas y suspensión de Licencia de Conducir. Sanción: multas, cancelación de licencia y presidio (cárcel). Las sanciones aumentan significativamente en caso de reincidencia, o si la persona conductora, además de haber bebido participa en un siniestro en el que resulten daños materiales, personas fallecidas y/o con lesiones.", "51": "Una modificación legal en el año 2014, conocida como Ley Emilia , sanciona con cárcel efectiva de al menos un año a las personas conductoras, que en estado de ebriedad, generan lesiones gravísimas o la muerte a terceros. Además, se consideran delitos calificados: La reincidencia. La conducción con licencia cancelada o inhabilitada. Si el delito hubiese sido cometido por una persona conductora de vehículos para el transporte de pasajeros o carga en el ejercicio de sus funciones. Por otro lado, si la persona conductora que participa en un siniestro se negase injustificadamente a realizarse las pruebas de detección de alcohol (prueba respiratoria u otra prueba científica), será sancionada con suspensión de licencia, multas y penas de cárcel que podrían llegar a ser efectivas dependiendo de las consecuencias del siniestro. Efectos del alcohol en el organismo El cerebro es afectado por el alcohol mucho más que otros órganos del cuerpo. Los primeros efectos del alcohol se manifiestan en el ámbito psicológico, como por ejemplo: la atención, percepción y procesamiento de la información. Con pequeñas concentraciones de este (0,1 gramo por mil de alcohol en la sangre), se afecta el comportamiento y la conducta , ciertas inhibiciones disminuyen, la autoconfianza se fortalece y aumenta la tendencia a sobreestimar la propia capacidad. Esto constituye un gran peligro, ya que muchas personas desean acrecentar estas sensaciones bebiendo más. El alcohol perturba el estado de ánimo, hace más lenta la comunicación en el sistema nervioso e inhibe la capacidad de distinguir entre diferentes estímulos, lo que influye negativamente en el tiempo de reacción y coordinación de una persona conductora ante un imprevisto. Asimismo, la mayoría de las personas no nota una reducción de su visión después de tomarse unos tragos, lo que puede ser correcto en relación a la visión directa. Sin embargo, lo que no se percibe es que la visión periférica sí disminuye , lo que podría provocar que la persona no logre descubrir los obstáculos a tiempo, provocando un siniestro. A mayores concentraciones de alcohol, la visión empeora, sobre todo en forma de visión doble. Los músculos de cada ojo no trabajan correctamente y, además, los músculos del cristalino y la pupila comienzan a fallar, lo que dificulta enfocar la mirada. La única tasa de alcohol segura para conducir es “0”. Si vas a beber, no conduzcas, busca otra alternativa para transportarte. La visión periférica, la atención, el tiempo de reacción y la capacidad de interpretación y decisión se ven influidas antes que la parte motriz; es decir, las funciones verdaderamente decisivas se ven afectadas antes de que empieces a darte cuenta del estado en que te encuentras. RESUMIENDO: Cuando se ingiere alcohol, aumentan las infracciones a las normas de tránsito dado que las capacidades se ven deterioradas o disminuidas, y además, se tiene un menor sentido de la responsabilidad y de la prudencia.", "52": "Cómo varía la tasa de alcohol en la sangre Para conocer la tasa de alcohol que tiene una persona que ha bebido, se requiere analizar una muestra de sangre (alcoholemia) o efectuar una prueba espirométrica con equipos especiales usados por Carabineros de Chile. La cantidad de alcohol en la sangre varía de acuerdo a diversos factores. Los principales son: La cantidad de alcohol que una persona consume. La masa corporal: A menor peso corporal se alcanza una mayor tasa de alcoholemia. Esto significa que, si dos personas beben exactamente la misma cantidad, aquella que tenga menor peso va a tener una mayor tasa de alcohol en la sangre. El sexo: Existen diferencias fisiológicas entre hombres y mujeres que originan que, si un hombre y una mujer que tienen igual peso y beben igual cantidad de alcohol, es más probable que la mujer obtenga una tasa de alcoholemia más alta que el hombre. Por lo tanto, si dos personas ingieren el mismo tipo y cantidad de alcohol, no necesariamente alcanzan el mismo nivel de alcoholemia, ni experimentan los mismos efectos. El tiempo que dura la ingesta. El punto máximo que alcance el alcohol en el organismo, llamado meseta en la curva de la alcoholemia, será mayor si se bebe en poco tiempo. Si se bebe más lentamente y/o se deja pasar tiempo entre una bebida y otra, el cuerpo eliminará algo de alcohol antes de recibir más. La siguiente figura muestra un ejemplo en que la persona ingiere alcohol en un período de 4 horas y luego duerme durante 8 horas. El alcohol se detecta en la sangre 5 minutos después de haber sido ingerido. En el organismo la tasa de alcoholemia aumenta muy rápido hasta llegar a su nivel máximo, el que se alcanza, en promedio, a la hora después de haber bebido. El cuerpo se libera del alcohol mediante la metabolización de este. Se calcula que en una persona promedio y sana de 70 kilos la presencia de alcohol disminuye a razón de entre 0,10 a 0,15 g de alcohol por litro de sangre por hora. Pero hay que tener presente que esta es una cifra promedio, que no necesariamente debe aplicarse a tu caso. La metabolización no se puede apresurar. Este proceso se realiza a un ritmo constante, que no se acelera con remedios caseros como un café, comer dulces, fumar un cigarrillo, una ducha fría o ejercicios físicos. Como se evidencia en el gráfico, dormir pocas horas no garantiza la metabolización total del alcohol, lo que provoca una conducción insegura. curva de alcoholemia", "53": "El alimento ingerido: La concentración de alcohol en la sangre varía según lo mucho o poco que se coma antes o mientras se bebe. El alimento reduce la cantidad de alcohol que pasa del estómago a la sangre. Debes saber que la mezcla de alcohol con bebidas carbonatadas aumenta la absorción por el estómago. La edad: Los menores de 18 años y los mayores de 65 años perciben con mayor intensidad los efectos del alcohol. Los efectos del alcohol son más peligrosos en las personas conductoras principiantes, debido a que aún no han automatizado muchos movimientos necesarios para conducir, porque no han tenido la práctica necesaria. Como podrás deducir, con tantos factores es muy aventurado predecir a priori el resultado de una alcoholemia. Las drogas y estupefacientes El mayor riesgo de conducir bajo el efecto de drogas está dado por el hecho de que todas ellas actúan sobre el cerebro y pueden alterar la percepción, la cognición, l
