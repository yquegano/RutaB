a atención, el equilibrio, la coordinación, el tiempo de reacción y otras facultades requeridas para conducir de manera segura . Los efectos de cada droga específica difieren dependiendo de su mecanismo de acción, la cantidad consumida, el historial de la persona consumidora, entre otros factores. El consumo de estas constituye un riesgo para tu salud, generan dependencia física y psicológica, además, conlleva peligros reales al conducir bajo sus efectos, por lo que es necesario conocer estos riesgos: Marihuana Se clasifica como depresor, alucinógeno. No es estimulante. Sus efectos en el organismo son de rápida aparición y varían según la dosis, el tipo de marihuana y el estado del individuo, tanto físico como anímico. Las principales consecuencias de su consumo son: Se altera la percepción del entorno (como por ejemplo, los colores). Se altera la percepción del tiempo, del espacio y de la velocidad , lo que causa cálculos errados de distancia. Cuesta mantener la concentración , por lo que existe una gran probabilidad de tener una distracción al volante. Aumenta el tiempo de reacción y, por ende, la distancia de detención ante una situación de riesgo. Produce fuertes somnolencias . Cocaína Es un estimulante cuyos principales efectos son: Produce un comportamiento más competitivo e incluso agresivo .", "54": "El comportamiento puede volverse impulsivo , lo que provoca cometer grandes errores al volante. Se sobreestiman las capacidades, lo que conlleva asumir mayores niveles de riesgo , cometiendo más infracciones y conduciendo de forma peligrosa. La percepción del entorno se ve alterada y disminuye la capacidad de concentración , pudiendo sufrir distracciones fácilmente. Pasta Base Los efectos de fumar Pasta Base de Cocaína (PBC) dependen del tipo de preparación, dosis, frecuencia de consumo, impurezas y adulteraciones que contenga, entre otras variables. Su efecto después de fumar es rápido e intenso, aparece en un lapso de segundos y dura algunos minutos. Al consumir pasta base, se pueden distinguir cuatro etapas: 1. Etapa de euforia: caracterizada por un estado de euforia, disminución de inhibiciones, sensación de placer, éxtasis, intensificación del estado de ánimo, cambios en los niveles de atención, hiperexitabilidad, falsa sensación de capacidad y competencia, aceleración de los procesos de pensamiento, disminución de hambre, sueño y fatiga. 2. Etapa de disforia: sensación de angustia, depresión, inseguridad, tristeza y apatía, entre otros. También se produce un deseo incontenible de seguir fumando. 3. Etapa en que la persona empieza el consumo ininterrumpido , cuando aún tiene dosis en la sangre, para evitar la disforia. 4. Etapa de sicosis y alucinaciones: pérdida del contacto con la realidad, la que puede darse después de días o incluso semanas del consumo pudiendo durar semanas o meses. Se sufren alucinaciones sensoriales, que pueden ser visuales, auditivas, olfatorias o cutáneas. En todas sus etapas los riesgos para la conducción son altos y evidentes. Entre los efectos físicos destacan: falta de coordinación, mareos, dilatación de las pupilas, temblores, náuseas y/o vómitos. Éxtasis El consumo de éxtasis puede generar las siguientes manifestaciones: Períodos de mayor sensibilidad a la luz , por lo tanto mayor tendencia a los deslumbramientos . Ilusiones ópticas, como flashes en la periferia del campo visual , lo que podría ocasionar la acción de maniobras evasivas bruscas y peligrosas. Episodios de visión borrosa . Dificultad para mantener la concentración . Episodios de depresión o ansiedad . Una vez que desaparecen los síntomas, períodos de agotamiento físico y mental .", "55": "Tablas resumen Dificultad de atención. Dificultad para calcular distancias. Alteración sensorial. Distracciones al volante por falta de concentración. Alteración motora. Impulsividad. Aumento en el tiempo de reacción. Afecciones cardíacas. Alteración de la percepción del entorno. Comportamiento más competitivo o agresivo con las demás personas conductoras. Alteración velocidad de pensamiento. Pánico durante la conducción. Impulsividad para enfrentar imprevistos. efectos fisiológicos manifestaciones en la conducción marihuana cocaína éxtasis pasta base marihuana cocaína éxtasis pasta base Si has consumido cualquier droga, no conduzcas. Debes recordar que todo consumo implica un riesgo en la conducción. Esperar que los efectos desaparezcan o disminuyan no es una garantía para volver a conducir de forma segura.", "56": "Enfermedades que pueden afectar a la conducción Conducir un vehículo con seguridad requiere de toda nuestra concentración y de poder reaccionar adecuadamente ante situaciones de riesgo, por lo que es necesario que nuestras capacidades estén en buen estado. Cada día existe mayor conciencia social de los riesgos que conlleva conducir bajo los efectos del alcohol o de las drogas, sin embargo se desconoce la inseguridad de conducir bajo los efectos de muchos medicamentos y los riegos que puede tener una determinada enfermedad a la hora de conducir un vehículo . No todas las enfermedades implican los mismos riesgos para la conducción, por ejemplo, los trastornos neurológicos son los que tienen mayor riesgo de ocurrencia de siniestros, seguidos de adicciones a medicamentos (de forma similar a la adicción a drogas) y la diabetes . Otras patologías que revisten riesgos en la conducción son las enfermedades cardiovasculares, problemas en el sistema motor, artritis, dificultades para escuchar y algunos problemas de visión. Ten presente que al iniciar un proceso de otorgamiento de Licencia de Conducir, se te realizará un examen médico donde se evaluarán las enfermedades y/o condiciones que pueden afectar a la conducción. La o el médico evaluador podrá requerir un informe de un médico especialista para contar con mayor información respecto a tu caso y así, poder aprobar o rechazar el examen médico. Si tienes alguna enfermedad de base o la desarrollas una vez otorgada tu Licencia de Conducir, es tu responsabilidad preguntar al médico tratante acerca de las consecuencias y riesgos de conducir. Esto te permitirá tomar las precauciones necesarias para evitar sufrir un siniestro. De la misma manera, si ingieres medicamentos por prescripción médica, debes informarte sobre los posibles efectos de estos en la conducción. En el caso de tener una enfermedad crónica , puedes disminuir el riesgo de sufrir un siniestro si llevas a cabo las siguientes acciones: Conocer bien tu enfermedad. Conocer los efectos secundarios de los medicamentos que consumes. Reconocer los síntomas de una crisis y saber cómo actuar. Evitar situaciones que puedan desencadenar una crisis. Evitar conducir durante una crisis o en fase aguda de la enfermedad. No modificar ni abandonar el tratamiento sin prescripción médica. No consumir alcohol mientras consumes medicamentos. Consultar con un médico los riesgos de tu patología para una conducción segura. Si no te sientes bien, no conduzcas.", "57": "Enfermedades que pueden afectar a la conducción Enfermedades Cardíacas Enfermedades Respiratorias Enfermedades Neurológicas y Trastornos Mentales enfermedad tipo de enfermedad posibles riesgos para el tránsito * enfermedades con mayor riesgo de afectar nuestras capacidades para conducir un vehículo Hipertensión arterial Mareos; pérdida repentina de conciencia. Angina de pecho Pérdida de concentración. Arritmia Pérdida de atención. Infarto Gripe/Resfriado común Bronquitis crónica Demencias (Alzheimer) Asma bronquial Apnea obstructiva del sueño Epilepsia Depresión Trastornos de ansiedad Rinitis alérgica Insuficiencia cardíaca Se aconseja conducir luego de 3 meses después del evento. Pérdida de atención; pérdida de concentración; somnolencia. Pérdida de atención. Deficiencias cognitivas graves; desorientación. Pérdida de atención; dificultad de movimientos. Pérdida de atención; somnolencia. Pérdida de concentración; descoordinación de movimientos; posibilidad de ataques repentinos. Distracciones (ensimismamiento); somnolencia; lentitud de movimientos; comportamiento errático o imprevisible. Impulsividad; pérdida de concentración; pérdida de atención; agresividad. Pérdida de atención; pérdida de concentración; menor coordinación visual; irritación ocular. Falta de concentración; somnolencia. * Principalmente en fase sintomática y sin el debido tratamiento.", "58": "Además de las enfermendades expuestas en la tabla anterior, existen otras alteraciones en nuestro organismo que influyen en una conducción segura. A continuación, revisaremos alguna de ellas. Alergias Respiratorias Los síntomas más frecuentes de una alergia respiratoria, son muy similares a los de un resfrío común: necesidad constante de sonarse la nariz, ojos llorosos, visión borrosa, estornudos, fatiga y dolores de cabeza, entre otros, son tan cotidianos que no se percibe lo peligroso que pueden ser a la hora de conducir. Hay antecedentes de que algunos de estos síntomas podrían llegar a producir errores en el cálculo de las distancias y una menor capacidad para mantener la concentración en el tránsito. Además, los antihistamínicos ingeridos habitualmente para aliviar estos síntomas, pueden provocar una mayor somnolencia al volante . Es importante saber que esta enfermedad puede afectar gravemente la seguridad al conducir. En un viaje por carretera circulando a 90 km/h, durante un estornudo de un segundo de duración, el vehículo recorre unos 25 metros sin que se pueda prestar atención a las condiciones de la vía. Intentar no abrir las ventanas durante la conducción, las corrientes de aire pueden aumentar las crisis, ya que contienen polen. Cuidado con el uso de aire acondicionado, la inhalación directa de este, podría provocar crisis alérgicas. Mantener limpios los conductos de ventilación y el interior del vehículo, hacer limpiezas con frecuencia, en particular si transportas animales. Usar lentes de sol, ya que protegen los ojos de alérgenos. CONSEJOS ÚTILES PARA PERSONAS CONDUCTORAS ALÉRGICAS: Intentar no realizar viajes demasiado largos bajo el efecto de algún medicamento, de no ser posible, consultar a un médico la posibilidad de variarlos o de retrasar la dosis. Evitar conducir al amanecer y por zonas húmedas, ya que en ambos casos se producen grandes concentraciones de polen. No automedicarse, consultar siempre a un médico. Los consejos de amigos y familiares pueden no recomendar el medicamento más adecuado. Estrés El estrés es un mecanismo de defensa del organismo ante situaciones amenazantes o que demandan un gran esfuerzo. En este sentido, las reacciones de estrés pueden ayudar a superar determinadas situaciones adversas, sin embargo, si la situación se mantiene durante mucho tiempo pueden sufrirse trastornos de sueño, ansiedad, problemas digestivos e incluso infartos.", "59": "El estrés implica que el agotamiento mental se convierta en angustia provocando reacciones incorrectas. En lugar de concentrar las fuerzas en la solución de un problema difícil, el estrés empeora la conducta orientada a la solución del problema. No obstante, es importante recordar que no todo el estrés tiene que ser necesariamente negativo. Por el contrario, cierto grado de estrés puede contribuir a mejorar el rendimiento. La influencia negativa de un grado demasiado alto de estrés radica en que la persona conductora puede tener reacciones impulsivas y/o reducir su campo de atención , aferrándose a ciertos pensamientos o acciones. Entonces, la persona se ve afectada por cierta rigidez cerebral y muscular. Otra reacción de la persona conductora, que se desencadena a causa del estrés, es el darse por vencida ante ciertas situaciones. La sensación de fracaso se convierte inconscientemente en el sentimiento dominante y la persona se muestra pasiva y, en el peor de los casos, alejada de sí misma y contemplando el desarrollo de los acontecimientos como si fuera una espectadora. También existe la posibilidad de que una persona bajo estrés pueda tener reacciones de pánico . Los sentimientos se apoderan de ella, efectuando una serie de acciones innecesarias o simplemente inadecuadas. Una persona conductora dominada por el pánico no tiene posibilidad de resolver por sí misma la situación. Todos estos estados son de alto riesgo en la conducción. Depresión La depresión es una enfermedad muy frecuente en nuestra sociedad. Su principal característica es sufrir una alteración del estado de ánimo que trae como consecuencia episodios de apatía, tristeza, decaimiento y falta de energía, entre otros. En caso de sospechar que estás padeciendo de una depresión, debes acudir a un especialista a la brevedad, de forma que este determine la terapia a seguir. La depresión influye sobre las capacidades para conducir un vehículo: Los cambios de estado de ánimo provocan que la persona conductora esté sumergida en sus pensamientos y no en las condiciones del tránsito. No existe la misma preocupación por parte de la persona conductora de buscar información del entorno, por lo que podría demorar en detectar situaciones de riesgo, como una persona que ingresa a la calzada. La depresión conlleva mayor probabilidad de sufrir estados de somnolencia y de fatiga, por lo que no se recomienda conducir de noche, ni durante mucho tiempo, ni en entornos monótonos. Una persona con depresión puede alterarse con facilidad ante algunas circunstancias y reaccionar de forma impulsiva o desproporcionada ante las demás personas usuarias de la vía. La depresión produce inseguridad, lo que facilita cometer errores o comportarse de forma inesperada al conducir. El uso de algunos medicamentos para tratar la depresión pueden afectar la capacidad para conducir. La presencia de ideas suicidas puede inducir a la persona a provocar un siniestro de tránsito. Siempre debes evitar conducir cuando presentas síntomas de estrés, así como también debes tratar de no llegar a situaciones de estrés mientras conduces.", "60": "Medicamentos que pueden afectar a la conducción Existen ciertos medicamentos que alteran las capacidades para conducir de forma segura, por esto, en caso de que estés tomando alguno, es importante que consultes a un profesional sobre los efectos que podría ocasionarte. Conozcamos los efectos de algunos medicamentos de uso extendido en la población: Antihistamínicos De uso común y extendido para el tratamiento de alergias, existen de diversos tipos, pero algunos de ellos tienen efectos secundarios que resultan especialmente peligrosos para la conducción. Se ha comprobado que el riesgo de conducir bajo los efectos de algunos de estos medicamentos es equivalente al riesgo de conducir con una tasa de alcohol en la sangre de 0,5 g/l a 0,8 g/l , esto es, conducir bajo la influencia del alcohol. Hoy existen antihistamínicos que no producen somnolencia, por lo tanto, son más seguros para la conducción. Nunca consumas antihistamínicos mezclados con alcohol o con otros medicamentos, ya que podrían producir otros efectos no deseados. Psicofármacos Son aquellos medicamentos usados para el tratamiento de enfermedades mentales, tales como depresión, ansiedad o trastornos del sueño. Muchos de ellos pueden alterar las capacidades para una conducción segura. Existen distintos tipos de psicofármacos: Ansiolíticos, sedantes e hipnóticos : se usan para aliviar síntomas de ansiedad, disminución de estados de activación elevada e inducción de sueño, como los somníferos y sedantes que reducen el estado de vigilia. Antidepresivos : se usan principalmente en el tratamiento de la depresión. Neurolépticos o antipsicóticos : se usan en el tratamiento de trastornos de tipo psicótico, como la esquizofrenia. Pueden provocar sueño e hipotensión. Psicoestimulantes : tienen un efecto activador sobre el sistema nervioso central y sobre las funciones psíquicas. Por ejemplo, existen algunos tipos de anfetaminas que generan una efímera y fuerte sensación de autoconfianza. Algunos de estos medicamentos generan efectos tan fuertes en el organismo que, en algunos países se prohíbe conducir mientras se consumen. Algunos medicamentos disminuyen la atención y aumentan el tiempo de reacción al conducir.", "61": "Confusión Ataxia Confusión/reducción de reflejos Ansiedad/insomnio Hipoglucemia Nerviosismo/temblor Discinesia Fatiga Alteraciones de la coordinación Los dolores La diabetes La circulación La circulación y la tensión Otros Dormir y para los nervios Los resfriados, la tos y los bronquios Analgésicos Analgésicos narcóticos Ansiolíticos e hipnóticos Antidepresivos Antipsicóticos Psicoestimulantes Antidiabéticos Antitusivos Antihistamínicos Antiinfecciosos Anticoagulantes y antiagregantes Vasodilatadores e antihipertensivos Anticolinérgicos Anticonvulsivantes Antiparkinsonianos si estás en tratamiento para : podrías sentir : te medicas con : sueño euforia mareo hipertensión visión borrosa otros efectos Tabla sobre los efectos que provocan ciertos medicamentos Cuando vayas a consumir medicamentos, en especial los antes mencionados, debes consultar al médico sobre los posibles riesgos para la conducción, de forma tal de que puedas adoptar los cuidados necesarios.", "62": "Cansancio, sueño y fatiga Datos a nivel internacional revelan que entre el 15 y el 30% del total de los siniestros de tránsito ocurre porque el factor sueño está asociado directa o indirectamente, y muchos de ellos tienen consecuencias graves. Normalmente, se piensa que los siniestros por sueño son causados por personas conductoras que se quedaron dormidas al volante, lo cual no siempre es correcto. Los riesgos de tener un siniestro por somnolencia aparecen mucho antes. Otra creencia popular es creer que el sueño sólo aparece de noche, cuando el sueño puede aparecer en el día por muchas causas. Efectos del cansancio y del sueño en la conducción La persona conductora tiene una gran responsabilidad cuando siente que el cansancio va apareciendo. Los efectos de cansancio o sueño en la conducción, se muestran de la siguiente manera: Aumenta el tiempo de reacción. Esto explica siniestros como colisiones por alcance, cuando el vehículo de adelante frena y no se alcanza a frenar a tiempo. Aumenta el número de distracciones al volante, ya que la somnolencia dificulta la concentración en el tránsito y las distracciones aparecen con mayor facilidad. Esto es especialmente peligroso cuando se conduce en un entorno monótono y con poco tráfico. La capacidad para tomar decisiones al volante y el juicio se alteran. Con sueño las personas demoran más en tomar una decisión, aumentando la probabilidad de participar en una situación de riesgo. El sueño contribuye también a que se cometan muchos más errores al conducir, sobre todo cuando se necesite responder con rapidez ante una situación complicada como acceder a una autopista o carretera. El cansancio y el sueño incrementan los errores en la estimación de velocidades. La coordinación psicomotriz empeora y la movilidad de la persona conductora se altera. Los músculos se relajan ocasionando movimientos más lentos y menos precisos. Existe la tendencia de hacer movimientos de forma automática, lo que puede derivar en maniobras realizadas sin pensar y no necesariamente adecuadas a la situación del tránsito. Por ejemplo, atravesar un cruce semaforizado sin asegurarse de tener luz verde. Pueden presentarse microsueños , que son períodos de algunos segundos en que la persona conductora, sin darse cuenta, se queda ligeramente dormida y totalmente ajena a lo que ocurre a su alrededor. Normalmente la persona conductora no tiene conciencia de haberse dormido, ni siquiera cuando despierta; los microsueños pasan absolutamente desapercibidos. Numerosos siniestros se producen a consecuencia de estos. La percepción del entorno se altera. Con sueño la visión se vuelve borrosa, resulta más difícil enfocar la vista y puede aparecer una fatiga ocular. Es más fácil sufrir un deslumbramiento cuando otro vehículo lleva luces altas cuando se tiene sueño. El cansancio es una causa importante de siniestros de tránsito, principalmente de los que se registran en carreteras.", "63": "Se producen cambios en el comportamiento. Con sueño, una persona conductora puede ponerse inquieta o puede volverse más hostil con las demás personas usuarias de la vía. Es posible aceptar un mayor nivel de riesgo, como por ejemplo aumentar la velocidad, en especial cuando se está más cerca del destino y ansiosa por llegar. El cansancio puede presentarse por distintas razones. Tratándose de la conducción de un vehículo, la causa más corriente es quizás una combinación de esfuerzo físico y monotonía. Conducir durante largo rato exige cierto trabajo muscular, la conducción se hace pesada para los ojos y los diferentes ruidos contribuyen al cansancio. Que la persona permanezca sentada todo el tiempo empeora la circulación de la sangre, ya que hay menor oxigenación de esta. Diferentes fases de cansancio La primera señal de cansancio se manifiesta con una falta de interés frente a los estímulos y cierta sensación de pereza ante la actividad intelectual. En esta fase inicial se presencian los primeros bostezos. No es extraño que la persona conductora tenga la boca seca y empiece a sentir frío. Esta última sensación es traicionera, ya que se deseará aumentar la temperatura interior del vehículo, lo que provocará mayor somnolencia. Los bostezos son más frecuentes y son cada vez más profundos. Los párpados comienzan a cerrarse. La velocidad de conducción se hace irregular y la persona se puede desorientar. En las fases finales, los músculos de la nuca se relajan, lo que provoca movimientos involuntarios de la cabeza. Las ganas de dormirse son demasiado fuertes y el sueño no puede dominarse ni con el máximo esfuerzo de voluntad. Como podrás notar, debes detenerte para descansar mucho antes de experimetnar los síntomas descritos. A veces es necesario pausar el viaje para estirar las piernas, tomar aire fresco o dormir unas horas. ¡Nunca permitas que tu apuro sea tanto como para arriesgar tu vida y la de las demás personas! Si en alguna ocasión comienzas a sentir cansancio al ir conduciendo, mientras buscas un lugar para detenerte, asegúrate de que entre aire fresco a tu vehículo. Factores que favorecen la aparición de sueño Entre las situaciones más comunes que pueden favorecer la aparición de somnolencia están: El momento del día. La madrugada, especialmente entre las 3 y las 5 horas, y las primeras horas de la tarde, entre las 14 y las 16 horas, son especialmente favorables para la aparición de somnolencia, aunque hayas dormido lo suficiente. Dormir menos horas que las habituales. Cada persona sabe cuántas horas necesita para levantarse descansada, poder estar despejada y activa. Puedes sentir mucha somnolencia después de dormir poco, especialmente si duermes menos de la mitad de las horas que necesitas. Si duermes una o dos horas menos, en pocos días experimentarás una gran somnolencia.", "64": "Cambiar las horas habituales de sueño. Mientras más horas seguidas esté despierta una persona, más difícil le será resistirse al sueño. Este aparece con mucha facilidad a la hora en que se acostumbra ir a dormir y, más tarde, el sueño será aún mayor. Evita conducir en estas condiciones, ya que el riesgo de siniestro será aún mayor. Las personas que trabajan en turnos cambiantes, como personal de salud o de servicios de emergencia, que varían con frecuencia los períodos y la cantidad de horas dedicadas al sueño, suelen experimentar períodos de fuerte somnolencia mientras están despiertas. La calidad del sueño. Si el sueño no es reparador, a la mañana siguiente la persona estará cansada y somnolienta, por lo que no se encontrará en óptimas condiciones para conducir. También puede ocurrir que tenga el sueño ligero y, al no alcanzar las fases más profundas, no descansará lo suficiente. Así, aunque no despierte durante la noche, al día siguiente puede sufrir de una fuerte somnolencia. El tránsito monótono. Conducir de noche por una carretera recta y sin tráfico, durante muchos kilómetros, favorece la somnolencia. En cambio en vías en las que se experimentan cambios constantes de entorno, como las urbanas con mucho tráfico, es más fácil que la persona se mantenga activa y despejada. El consumo de sustancias sedantes. El alcohol o algunos medicamentos, pueden favorecer la aparición de sueño. Lo mismo puede ocurrir al consumir una comida abundante. Evítalas si vas a conducir. El consumo de sustancias estimulantes. El café, té, hierba mate y las bebidas energéticas pueden resultar útiles en el momento inmediato y en algunas situaciones, sin embargo cuando cesa su efecto, se puede producir un efecto rebote , es decir, el sueño aparecerá repentinamente. Los trastornos de sueño , como el insomnio, pueden provocar una fuerte somnolencia en el día, la que influye muy negativamente en la Seguridad Vial. Las pocas horas o la mala calidad del sueño, el consumo de medicamentos con efecto sedante o la monotonía al volante, no afectan a todas las personas de la misma manera . Fatiga al volante La fatiga es cansancio extremo del cuerpo o la mente, la cual puede provocar efectos adversos como somnolencia e incomodidad en general. Además, la fatiga es una de las causas más frecuentes de siniestros de tránsito, especialmente entre las personas conductoras profesionales. La fatiga y la somnolencia son dos fenómenos que suelen aparecer juntos con mucha frecuencia: una persona que conduce cansada genera somnolencia y, si conduce somnolienta favorece la aparición y la intensidad de la fatiga. Los efectos de la fatiga más riesgosos para la conducción La capacidad de mantener la atención en el entorno se ve alterada dificultando la concentración en el tránsito, lo que favorece las distracciones. Alteración de sensaciones y de percepciones , como: - Visión borrosa que impide percibir el entorno de forma adecuada.", "65": "- Disminución de la sensibilidad auditiva, lo que afecta la percepción adecuada de sonidos del entorno. - Posibilidad de experimentar reacciones bruscas y desproporcionadas ante sonidos repentinos, como frenar de forma brusca al escuchar una bocina. - Sensaciones de pesadez, dolor de nuca y espalda, migrañas, calambres y otras sensaciones molestas o desagradables. Alteraciones de movimientos: - Serán más lentos e imprecisos. - También disminuye el número de maniobras realizadas, por ejemplo, se corregirá la trayectoria menos veces. - Aparecen movimientos indicadores de fatiga: cambios de postura frecuentes, estiramientos, bostezos, constantes acomodos en el asiento, movimientos de las manos (como rascarse) o las llamadas conductas lúdicas (como cantar o silbar). Alteraciones de comportamiento: - Es posible comenzar a conducir de forma automática y más pasiva. Por ejemplo, prestando menos atención al entorno. - Es usual asumir mayores riesgos al volante. - Es posible que la persona esté más nerviosa o irritable, lo que aumenta conductas hostiles o agresivas hacia los demás. Alteraciones de la toma de decisiones de la persona conductora: - La cantidad y calidad de información que se recoge del entorno disminuye, lo que facilita malinterpretar situaciones o comportamientos de las demás personas. - El razonamiento de quien conduce estará gravemente afectado y probablemente las decisiones que tome no serán las más adecuadas o las más seguras. - El tiempo de reacción se incrementará. Situaciones que pueden favorecer la aparición de la fatiga al volante La aparición de la fatiga al volante es cuestión de tiempo, por tanto, si conduces durante largo tiempo, tarde o temprano, sentirás sus síntomas. Por lo anterior, es importante saber qué circunstancias favorecen su aparición y aumentan su intensidad: Circunstancias en la vía y su entorno: - Circular por una vía con mucho tráfico, ya que exige un aumento de la concentración. - Conducir por una vía con el pavimento en mal estado, ya que la conducción es más incómoda por las vibraciones del vehículo, entre otras situaciones. - Conducir por un camino no conocido, ya que obliga a prestar atención durante todo el recorrido.", "66": "- Conducir de noche o con condiciones climatológicas que no favorecen a la conducción (por ejemplo, lluvia, niebla o nieve), ya que la conducción se hace más difícil exigiendo mayor atención. Circunstancias en el vehículo: - Mala ventilación o altas temperaturas al interior del vehículo. - Circular en un vehículo en mal estado vuelve la conducción incómoda, como por ejemplo, problemas de suspensión o de dirección. - Un diseño poco ergonómico del asiento o de otros elementos interiores del vehículo, también vuelve la conducción incómoda y la dificulta. Circunstancias de la persona conductora: - Conducir mucho tiempo seguido sin descansar o descansando de forma inadecuada, es la principal causa de fatiga al volante. - Mantener una velocidad excesiva durante mucho tiempo. - Alteraciones previas del estado de la persona conductora, como por ejemplo conducir con sueño, sintiéndose enferma o bajo los efectos del alcohol o drogas. - Cambiar los hábitos normales de conducción, por ejemplo, conducir de noche cuando sólo se tiene costumbre de conducir de día. - Ser una persona conductora sin experiencia, ya que, al no haber automatizado muchos de los procesos necesarios, se necesita más concentración. - Mantener posturas inadecuadas en el asiento que hagan incómoda y difícil la conducción. Si sientes cansancio o sueño al ir conduciendo, lo mejor es que te detengas a descansar en un lugar adecuado y dormir; 20 o 30 minutos de sueño son suficientes en la mayoría de los casos. Si continuas conduciendo en esas condiciones, el riesgo de sufrir un siniestro aumentará. En viajes largos, descansa al menos 20 a 30 minutos cada 2 horas o 200 kilómetros de conducción, como máximo. CONSEJOS EN CASO DE FATIGA O CANSANCIO EN LA CONDUCCIÓN: Pon atención a la aparición de los síntomas de sueño o de fatiga que se han expuesto anteriormente. Si tienes dudas siempre será más seguro parar y descansar un poco. Evitar las circunstancias que favoren la aparición de fatiga, o aumentar el número de descansos, podrá garantizar tu seguridad y la de las demás personas.", "67": "CAPÍTULO 5 Las y los usuarios vulnerables", "68": "Si bien todas las personas usuarias de las vías públicas están propensas a sufrir algún tipo de siniestro de tránsito, hay ciertas personas que son más vulnerables. Estas corresponden a niñas y niños, peatones en general (particularmente personas mayores), personas ciclistas, motociclistas, entre otras. Peatones En Chile, los atropellos representan aproximadamente el 15% de los siniestros, sin embargo, las personas atropelladas fallecidas en estos siniestros corresponden aproximadamente al 28% del total de fallecidas. La alta siniestralidad de estas personas usuarias de las vías se relaciona con su comportamiento en la zona de incertidumbre , es decir, en aquel espacio que las rodea cuando circulan por la vía. Estas personas tienden a moverse de forma más impredecibles que el resto. Por ello, una persona conductora encuentra más difícil anticiparse al comportamiento de las y los usuarios vulnerables. Además, las y los peatones suelen cometer muchas infracciones, entre las que destacan descender sorpresivamente a la calzada y cruzar de manera indebida, es decir, no utilizar los pasos peatonales, pasarelas o no respetar los semáforos. Sumado a este comportamiento, hay que considerar el uso de teléfonos y audífonos, entre otras tecnologías. Muchas personas escuchan música por audífonos a modo tal, que se encuentran aisladas acústicamente de todo lo que les rodea. Otras, caminan pendientes del celular y, con seguridad, prestarán más atención a este que al tránsito. Es probable que puedan descender a la calzada sin mayor cuidado. Ten mucha precaución. Las y los usuarios vulnerables Peatones, ciclistas y motociclistas, junto con sus pasajeros, representan casi la mitad de las víctimas mortales por causa del tránsito en el mundo. 3 Estar siempre alerta y anticiparte a las posibles infracciones de las y los peatones. Si conduces por la pista izquierda y ves que en la pista derecha hay un vehículo detenido antes de un paso de cebra, debes disminuir la velocidad y prepararte para detener tu vehículo, ya que podría haber peatones que han comenzado a cruzar. COMO PERSONA CONDUCTORA DEBES: Al pasar cerca de un bus detenido en una parada, debes disminuir tu velocidad ya que un peatón podría aparecer sorpresivamente en la calzada adelante o detrás del bus, o corriendo para subir a este. Considera que peatones pueden salir repentinamente detrás o adelante de vehículos estacionados. Estos probablemente no te han visto. (3) Fuente: Informe sobre la situación mundial de la seguridad vial, OMS.", "69": "Personas de edad avanzada Como persona conductora debes mostrarte especialmente respetuosa ante este grupo de peatones, considera que sus tiempos de movilidad pueden ser reducidos, además de otras dificultades que deben enfrentar. Para poder tener consideración con las personas mayores, es importante que conozcas los principales problemas que encuentran en la vía pública: Exceso de ruido en el ambiente , lo que puede dificultar su audición. Dificultad para apreciar la velocidad de los vehículos. Menor movilidad y reacciones más lentas. En ocasiones existe dificultad para distinguir bien los colores del semáforo. Escasez de pasos peatonales en determinadas zonas. Las calles pueden resultar demasiado anchas para cruzar y pueden estar mal iluminadas . Una persona mayor puede necesitar 4 segundos más que una persona joven para cruzar una calle de 16 metros de ancho. Pueden tener problemas con la orientación cuando no conocen bien las calles. Una persona mayor, al cruzar la calle, podría devolverse antes de alcanzar la vereda, o detenerse en la calzada; o podría no estar atenta al tránsito y descender inesperadamente a la calzada. Por otro lado, debes saber que, en general, las personas mayores que conducen un vehículo poseen gran experiencia al volante y son prudentes al conducir. Sin embargo, existen alteraciones psicofisiológicas que se van produciendo al avanzar la edad, las cuales pueden afectar la capacidad de conducción. Demuestra consideración hacia las y los peatones. Conduce con cuidado y a baja velocidad cuando los haya cerca, especialmente en calles comerciales muy concurridas, áreas residenciales, cerca de establecimientos educacionales y de carros de venta o tiendas móviles, o cuando atravieses pequeños poblados. Ante la presencia de personas ebrias, reduce tu velocidad, es mejor darles la preferencia que provocar un siniestro. Ten presente que las personas pueden sufrir de algún impedimento, que puede ser visible o invisible. Así, un peatón puede tener lesiones en la visión, en el oído o dificultades para desplazarse. Quienes sufren de algún impedimento no tienen la obligación de mostrarlo. Por ello, reduce siempre tu velocidad cuando sospeches que un peatón pueda tener problemas de algún tipo. Maneja con cuidado y demuestra consideración hacia las personas mayores o en situación de discapacidad. En general las vías no están adaptadas para este tipo de usuarios, dales tiempo para cruzar, y no asumas que las personas pueden escuchar tu vehículo: pueden tener dificultades auditivas.", "70": "El deterioro de las capacidades psicomotoras necesarias para la conducción puede suponer, por ejemplo, pérdida de fuerza al momento de frenar, peor manejo del volante, disminución en la capacidad para mantener la atención, procesamiento más lento de la información de la vía o un aumento en el tiempo de reacción. Por esto, muchos adultos mayores tienen más riesgo de sufrir siniestros en situaciones de tránsito complejas que exigen una respuesta rápida. Sin embargo, en situaciones donde existe tiempo suficiente para reaccionar, tienen los mismos problemas que otras personas más jóvenes. Por ello, hay que darles tiempo suficiente y no presionarlos a actuar. Las niñas y niños Muchos siniestros ocurren cuando las niñas y niños cruzan repentinamente la calle corriendo. Este grupo etario no suele ser consciente de las condiciones y riesgos del tránsito, por lo que es necesario que como persona conductora, tomes conocimiento de algunos de sus comportamientos y prevengas situaciones peligrosas. Es tu responsabilidad que no ocurra un siniestro . Debes saber que las niñas y niños: Tienen una estatura pequeña: por eso, con facilidad pueden no ser vistos cuando juegan detrás de un vehículo estacionado. No tienen la vista completamente desarrollada: la vista no se desarrolla completamente hasta los 15 años de edad. Su campo visual es limitado y ven sólo una cosa a la vez. Actúan impulsivamente: hacen lo que necesitan, sin pensar en las consecuencias. Juegan siempre: todo es juego. No consideran que el tránsito puede ser peligroso. Tienen dificultad para juzgar la distancia y la velocidad. Comienzan a actuar con seguridad en el tránsito entre los 9 y 12 años de edad. Sé una persona cautelosa y mantente preparada para detener tu vehículo: En áreas residenciales donde las niñas y niños juegan en calzadas y veredas. Cuando haya niñas y niños que descienden de un vehículo por el lado que no deben. En las proximidades de establecimientos educacionales, especialmente, en horarios de inicio y término de actividades. Cuando pases a un vehículo de transporte escolar detenido: puede haber niñas y niños subiendo o bajando. Cuando te encuentres cerca de un carro o vehículo en el que se vendan golosinas o helados. Las niñas y niños se interesan más en éstos que en el tránsito. Vehículos a tracción animal Presta atención cuando en un camino o una carretera te encuentres con alguien montando a caballo, o con carreta, y prepárate para reducir la velocidad. Si la persona va en igual dirección que la tuya y, al mismo tiempo, vienen En zonas rurales, donde es más frecuente encontrar personas a caballo, debes prestar más atención a la presencia de estas, especialmente en las curvas a la derecha.", "71": "muchos vehículos en contra, no te acerques demasiado y espera hasta que los vehículos hayan pasado para adelantarle. Mantén una distancia lateral prudente. No hagas señales luminosas o acústicas ni aceleres el motor en cercanía de animales ya que estos pueden asustarse fácilmente y provocar una situación de riesgo. Motociclistas Las motocicletas son un medio de transporte utilizado cada vez con mayor frecuencia. Esto puede deberse a las ventajas que ofrece su movilidad y tamaño reducido. Pese a sus ventajas, la falta de carrocería produce que los siniestros sufridos en este tipo de vehículo resulten fácilmente fatales. La probabilidad de muerte es mucho más alta en este tipo de vehículo que en uno cerrado y de mayor tamaño. Son frecuentes las colisiones que se producen en intersecciones con la participación de motociclistas, por esta razón, debes tener especial cuidado al acercarte a los cruces, ya que por las altas velocidades en que se suelen conducir estos vehículos, resulta difícil percibirlos a tiempo. Como persona conductora de automóvil ten especial cuidado con las motocicletas, porque son pequeñas y difíciles de ver. Considera también, la presencia de triciclos motorizados de carga , que suelen circular a una velocidad reducida y, en general, no cuentan con carrocería para proteger a quien los conduce. Personas ciclistas Se entiende como persona ciclista a toda aquella que utiliza algún ciclo para transportarse , ya sea una bicicleta, un scooter, patines, entre otros. Todos estos son vehículos y deben transitar bajo la normativa de tránsito. Debes tener en cuenta que la micromovilidad cada día es más habitual, por lo que es fundamental aprender a convivir con los distintos ciclos. Ten en cuenta que tu vehículo cuenta con la infraestructura diseñada para absorber el impacto de un siniestro de tránsito, en cambio, las personas ciclistas no cuentan con esta carrocería, siendo su cuerpo el que recibe el mayor impacto . El elemento de seguridad principal de las y los ciclistas es el casco. Este reduce hasta tres veces la probabilidad de sufrir lesiones en la cabeza, las cuales son las de mayor importancia en caso de atropello. Ante la presencia de ciclistas: Al pasar con tu vehículo cerca de una persona ciclista, la normativa indica que debes dejar un espacio lateral de al menos 1,5 metros , ya que esta podría desviarse o tambalear. Ello puede ocurrir con mayor probabilidad cuando existe viento fuerte o en subidas a causa del mayor esfuerzo desarrollado al pedalear. Ante la proximidad de una persona ciclista en la acera, mantén atención, ya que podría no verte e incorporarse en la calzada sin previo aviso.", "72": "Cuando circules detrás de una persona ciclista, debes prestar atención ante los cruces, ya que esta podría querer virar olvidando señalizar. No adelantes a una persona ciclista antes o en un cruce, y especialmente si vas a virar a la derecha. Espera que esta haya pasado la intersección. Recuerda que al virar, pierdes tu preferencia. Ten presente que los ciclos no tienen espejos retrovisores. Tu vehículo cuenta con puntos ciegos donde es posible que no notes la presencia de una persona ciclista, ten especial cuidado con estas zonas. Recuerda que una persona ciclista también puede utilizar un cruce peatonal para cruzar una intersección. Si es de noche o la visibilidad ha disminuido, ten especial cuidado. No siempre circulan con luces que permitan verles oportunamente. Recuerda que como persona conductora de un vehículo motorizado, no puedes circular, detenerte ni estacionar en las ciclovías. Si tuvieses que bajar de tu vehículo cercano a una, procura mirar si viene una persona ciclista antes de abrir la puerta. Viraje a la derecha Brazo izquierdo en ángulo recto hacia arriba o brazo derecho extendido horizontalmente. Viraje a la izquierda Brazo izquierdo extendido horizontalmente. Disminución de la velocidad o detención Brazo izquierdo extendido hacia abajo. Señalización de maniobras que deben utilizar las personas ciclistas para comunicarse Si eres ciclista y quieres obtener más información respecto a la conducción segura en ciclos, te invitamos a revisar la Guía para ciclistas en Chile, de CONASET que se encuentra en https://mejoresconductores.conaset.cl", "73": "Niñas y niños en el automóvil Cuando lleves niñas y/o niños en tu vehículo enfrentarás algunas exigencias. Puede ser agotador escucharles jugar o pelearse cuando vas conduciendo. Por ello, debes estimularles para que viajen con tranquilidad, y no olvides utilizar en las puertas los seguros de niños , que impiden que estas puedan ser abiertas desde el interior del vehículo. Ten en cuenta que eres un ejemplo a seguir, así como tú usas el cinturón de seguridad apropiadamente, las niñas y niños deben ir siempre en su Sistema de Retención Infantil , el dispositivo de seguridad diseñado para su traslado al interior de un vehículo, en todo tipo de viaje. Es tu obligación, como persona conductora, hacer uso de este al momento de transportar a niñas y niños en un automóvil. Los siniestros de tránsito son una de las principales causas de muerte prematura en niñas y niños en países de América Latina y El Caribe. En Chile, durante la última década, fallecieron 497 niñas, niños y adolescentes menores de 12 años, el 45% murió en calidad de pasajero de un vehículo en siniestros de tránsito y 36.221 resultaron con lesiones. Desde 2006, el traslado de niñas y niños en SRI es obligatorio. Además, a partir de marzo de 2016, se aumentaron las exigencias. Se estableció la prohibición del traslado de menores de 12 años en los asientos delanteros de los vehículos, debiendo ser transportados en el asiento trasero (excepto en vehículos de cabina simple), utilizando algún SRI adecuado a su peso, talla y nivel de desarrollo, o el cinturón de seguridad si este ya les queda bien posicionado (ver esquema inferior). Asimismo, desde marzo de 2017 la Ley de Tránsito obliga a las personas conductoras a transportar niñas y niños de hasta 8 años inclusive (es decir, hasta un día antes de cumplir los 9 años), o de una estatura menor o igual a 135 centímetros y 33 kilogramos de peso, en Sistemas de Retención Infantil. Lo anterior, es exigible a los vehículos particulares, exceptuándose de esta obligación al transporte público, transporte escolar y vehículos de similares características. El incumplimiento de estas medidas es sancionado como una falta gravísima y la multa es de 1,5 a 3 UTM y la suspensión de la Licencia de Conducir de 5 a 45 días. Para disminuir los riesgos de daños y lesiones, es necesario utilizar Sistemas de Retención Infantil (SRI), adecuados para su peso, talla y nivel de desarrollo. Recuerda que con su uso, puedes salvar vidas.", "74": "El niño o niña abordo debe sentarse apoyando completamente la espalda en el respaldo del asiento. La banda inferior debe estar bien ajustada sobre la parte superior de los muslos y no debe quedar sobre el abdomen. El cinturón debe pasar por la mitad del hombro y pecho. Los pies deben apoyarse completamente en el piso del vehículo. En estos casos, es necesario el uso de un Sistema de Retención Infantil (SRI). ¿CÓMO SE USA CORRECTAMENTE EL CINTURÓN DE SEGURIDAD? Uso correcto de un Sistema de Retención Infantil (SRI) Se debe tener en cuenta que no basta solo con utilizar un Sistema de Retención Infantil, sino que debe ser utilizado correctamente , ya que un dispositivo mal instalado no brinda la protección necesaria para que las niñas y niños viajen seguros, generando una falsa sensación de seguridad. Por esto, se debe fijar bien la silla al asiento del vehículo , siguiendo cuidadosamente las instrucciones indicadas en el manual de usuario del SRI, y sujetar a la niña o niño a la silla a través del arnés o el cinturón de seguridad. Estos dispositivos deben utilizarse desde el primer viaje de las niñas y niños; es decir, desde que nacen (incluye el primer viaje desde del centro de salud donde nace) hasta que puedan usar el cinturón de seguridad directamente. El uso incorrecto del cinturón de seguridad, genera lesiones importantes en los órganos ubicados en la zona abdominal como hígado, intestinos, vejiga y riñones, que pueden comprometer seriamente la vida. Consideraciones para elegir un Sistema de Retención Infantil (SRI) Se deben tener en cuenta distintos aspectos al momento de elegir un Sistema de Retención Infantil, aquellos más relevantes a considerar, son los siguientes: Peso, altura y nivel de desarrollo de la niña y/o niño: Debes seleccionar el Sistema de Retención Infantil de acuerdo a la etapa de desarrollo de la niña y/o niño, eligiendo el modelo adecuado a su peso y altura. Se recomienda que el SRI sea instalado a contramarcha, de manera tal que las niñas y niños viajen", "75": "mirando hacia atrás, el mayor tiempo posible, hasta alcanzar los límites de peso y altura indicados por el fabricante (mínimo hasta los dos años). Características del vehículo: Debes asegurarte que el SRI puede instalarse en tu vehículo, tomando en cuenta el tamaño de este y de la silla a utilizar, además del tipo de anclaje (ISOFIX, LATCH o cinturón de seguridad) con el que cuenta el vehículo. Recuerda revisar el manual de tu vehículo, para comprobar las características que este tenga. Características del grupo de pasajeros que realizarán el viaje: Debes asegurarte que todas las personas que viajen en tu vehículo lo hagan con un sistema de retención adecuado para ellas, por esto la instalación de un SRI no debe interferir con el correcto ajuste del correspondiente a las y los demás pasajeros. Que se puede instalar correcta y fácilmente: Debes asegurarte de usar un SRI que pueda ser instalado correctamente y con facilidad en tu vehículo. Estos pueden ser anclados al vehículo a través de los sistemas ISOFIX y LATCH o con el cinturón de seguridad. Si están correctamente instalados, cualquiera de los tres es seguro por sí mismo, por lo que no se requiere utilizar dos sistemas al mismo tiempo, a menos que lo indique el fabricante del SRI. Esta es la etiqueta que deben llevar las sillas infantiles que estén certificadas: La etiqueta debe ir pegada a la silla, es de color amarillo con letras negras y mide 9,5 cm de alto y 7,5 cm de ancho. Composición del código de acreditación 3CV: Centro de Control y Certificación Vehicular del Ministerio de Transportes y Telecomunicaciones. ASN: Acreditación SRI. XX: Marca del fabricante del SRI. XXX: Nombre del modelo de SRI. 2015: Año de acreditación. 000: Número correlativo de acreditación. Símbolo Anclaje Isofix Símbolo Anclaje superior LATCH y anclaje superior Anclaje ISOFIX Que cumpla con normas reconocidas: Debes asegurarte que el SRI que utilices esté certificado, de acuerdo a la normativa vigente, con normas internacionales y acreditado en Chile.", "76": "CAPÍTULO 6 Normas de circulación", "77": "Lograr un buena Convivencia Vial requiere cumplir con las normas de circulación, para ello, es necesario reconocer y comprender el lenguaje asociado al tránsito. Estos pueden expresarse de cuatro maneras: Las señales de Carabineros de Chile. Los semáforos. La señalización del tránsito: señales verticales y demarcaciones viales. Las reglas del tránsito. Normas de circulación Carabineros vistos de frente o de espalda: indican detención. Carabinera vista de costado: autoriza para avanzar. Carabinero con el brazo en alto: indica advertencia. Quienes están detenidos deben prepararse para avanzar una vez que el carabinero se ponga de costado y quienes tengan vía libre deben detenerse. Carabineros de Chile Inspectores Fiscales Inspectores Municipales entidades encargadas de velar por el cumplimiento de las normas de circulación Las señales de Carabineros Cuando existe congestión vehicular, ha ocurrido un siniestro de tránsito, o un semáforo no funciona, entre otras razones, es muy probable que Carabineros regule o dirija el tránsito. Puede que en alguna ocasión, enfrentes más de una instrucción, por ejemplo, la indicación de un carabinero y de un semáforo. En tal caso, las indicaciones dadas por Carabineros de Chile prevalecen sobre las demás.", "78": "Los semáforos En los cruces con altos flujos vehiculares se instalan semáforos para regular la circulación de los vehículos y aumentar la seguridad de los mismos. Pese a que estos buscan aportar a una buena Convivencia Vial, el no conocimiento de su significado o el incumplimiento de sus señales, convierte a estas intersecciones en zonas de riesgo para la generación de siniestros de tránsito. Debes reconocer y conocer los distintos tipos de semáforos que existen en las vías. A continuación, un resumen de estos. significado de las luces del semáforo Luz verde: Indica paso. Los vehículos que la enfrentan pueden continuar en el mismo sentido o virar, a menos que en el lugar haya una señal de tránsito que prohíba algún viraje. Aún teniendo luz verde, no avances si pasado el cruce no tienes a lo menos 10 metros expeditos en tu pista de circulación. Las y los peatones que también enfrentan la luz verde tienen prioridad para cruzar. Recuerda que en un cruce pea tonal también puede haber ciclistas que utilicen este paso para cruzar. Si vas a virar, debes cederles el paso . Luz roja: Indica detención. Los vehículos que enfrentan luz roja deben detenerse antes de la línea de detención o la línea de detención adelantada y no deberán avanzar hasta que se encienda la luz verde. Luz roja intermitente: Indica ceda el paso. Los vehículos que enfrenten una luz roja intermitente podrán continuar una vez que verifiquen que no se aproximan vehículos por la otra vía que hagan riesgoso el cruzar. Luz amarilla: Indica prevención. Los vehículos deben detenerse antes de entrar al cruce , ya que la luz amarilla advierte que la roja aparecerá a continuación. Si la luz amarilla te sorprende tan próximo al cruce que ya no puedes detenerte con suficiente seguridad, continúa con precaución. Si te sorprende dentro del cruce, continúa con precaución. Luz amarilla intermitente: Advierte peligro. Los vehículos que enfrenten luz amarilla intermitente deberán aproximarse al cruce a una velocidad reducida y continuar con la debida precaución . No respetar la indicación de la luz roja de un semáforo, es una infracción gravísima a la Ley de Tránsito.", "79": "Semáforo con cabezal para ciclistas: Cuando existe una ciclovía, los cruces semaforizados pueden tener cabezales especiales para posibilitar el cruce seguro a las y los ciclistas. Si estás virando, aun cuando enfrentes luz verde, recuerda que tienen la preferencia . Semáforos peatonales: Suelen instalarse en lugares específicos de algunas vías, con el propósito de permitir a las y los peatones cruzarlas con seguridad . Algunos de estos semáforos son activados por las personas. Semáforos con cruces ferroviarios: Estos lugares están provistos de señales luminosas, que se activan automáticamente ante la proximidad de un tren, y que pueden estar acompañadas de señales acústicas y/o barreras. Las señales luminosas en los cruces ferroviarios son de color blanco y rojo. La luz roja (también pueden ser dos luces rojas intermitentes y alternadas) advierte la proximidad de un tren , en tanto que la blanca indica que no se acerca alguno, lo que no significa que se pueda pasar sin peligro. Siempre verifica que el cruce esté despejado, el sistema de seguridad podría fallar. Luz roja y flecha verde: Los vehículos que enfrenten estas luces podrán entrar cuidadosamente al cruce, pero sólo para continuar en la dirección indicada por la flecha , y deberán respetar a las y los peatones que estén cruzando, así como a los demás vehículos que estén circulando reglamentariamente. Si el semáforo, en el lugar de la luz verde redonda, contiene una flecha del mismo color, puedes avanzar sólo en la dirección indicada por esta o estas, y continuar con la debida precaución.", "80": "Semáforo para el transporte público: En vías donde existen pistas exclusivas para buses pueden utilizarse semáforos especiales para regular el tránsito en los cruces. Estos semáforos afectan sólo a los vehículos que circulan por la pista exclusiva . Los colores de las luces que contienen y su significado no difieren de los de un semáforo tradicional, salvo que el color verde puede ser reemplazado por blanco. Una pista puede encontrarse temporalmente cerrada al tránsito. Para ello se pueden utilizar señales de mensaje variable ubicadas sobre la calzada. La equis, usualmente de color rojo, indica que la pista está cerrada. La flecha muestra que la vía está abierta al tránsito. Señales de tránsito Señales verticales Estas señales se emplean para indicar a las personas conductoras y peatones la forma correcta y segura de hacer uso de las vías. Para facilitar su lectura tienen símbolos, colores y formas diferentes. Estas se clasifican en grupos acorde a lo que informan. Hay señales que indican una prohibición o un mandato, otras advierten sobre peligros existentes y otras entregan información importante. A continuación, conoceremos los grupos de señales y puedes conocer más ejemplos de cada uno, en el Anexo 1 de la página 150. Señales reglamentarias: tienen por finalidad notificar a las personas usuarias de la vía acerca de prioridades, prohibiciones, restricciones, obligaciones y autorizaciones. Por lo general, estas señales tienen forma circular o rectangular, teniendo los símbolos y/o números inscritos dentro de un círculo u orla roja. Se exceptúan de lo anterior las señales PARE, Ceda el Paso, Fin Restricción, Paso Obligado, Permitido Virar Derecha con Luz Roja, Sólo Bicicletas, entre otras. Es importante destacar que la señal FIN RESTRICCIÓN pone término a la restricción mostrada al interior del círculo. En el ejemplo mostrado, corresponde a “No adelantar”.", "81": "Señales de advertencia de peligro: tienen como propósito advertir la existencia de peligros o riesgos permanentes. Estas tienen forma de rombo, su color de fondo es amarillo y su símbolo es negro. Excepto la señal denominada Cruz de San Andrés. En algunos casos, existen señales, en particular las relacionadas con las y los usuarios más vulnerables, que pueden ser de un color amarillo distinto al resto, con una tonalidad levemente verde. Dado que todas estas señales advierten un peligro, debes evitar los adelantamientos una vez pasada la señal y tomar las precauciones del caso, ya sea reduciendo la velocidad o realizando las maniobras necesarias para tu seguridad y la de las demás personas. Señales informativas: tienen como propósito orientar y guiar a quienes conducen, para que puedan llegar a sus destinos de la manera más segura, simple y directa posible. Se clasifican en dos grupos: las que guían a tu destino y las que contienen otra información de interés, como servicios, atractivos turísticos y otros. Son de forma cuadrada o rectangular y, en general, de color azul en el caso de Autopistas y Autovías y de color verde en otro tipo de vía. Sin embargo, las que informan sobre atractivos turísticos también pueden ser de color café. Señales transitorias: Estas pueden corresponder al tipo preventivo o informativo y responden a la presencia de riesgos o peligros de carácter no permanente derivados de la ejecución de trabajos en la vía. Son de color naranja, con la excepción de la primera señal que advierte sobre los trabajos, la que es de color amarillo. Recuerda moderar tu velocidad en zonas con trabajos y si es necesario, redúcela. La eventual presencia de personas trabajando, materiales como arena, piedras o ripio, incluso maquinaria, pueden ser un riesgo.", "82": "Las líneas longitudinales discontinuas ( ), de color blanco, pueden ir acompañadas de tachas reflectantes de igual color. Puedes traspasar estas líneas y cambiar de pista advirtiendo previamente a las y los demás usuarios de la vía tu intención de hacerlo y siempre que ello no imponga riesgos a las demás personas. Las líneas longitudinales continuas ( ), pueden estar complementadas con tachas reflectantes de color rojo, e indican que no existen condiciones de seguridad para que pueda ser traspasada. Como, por ejemplo, insuficiente visibilidad antes de una curva o ante un cambio de rasante. En ocasiones, las líneas longitudinales pueden presentarse en forma mixta ( ), esto es, tanto en forma segmentada como continua. En estos casos, sólo puede ser traspasada por los vehículos que circulan por el lado en que esta es segmentada. Otro caso de importancia, es el de la línea longitudinal que indica el borde de calzada ( ) llamado berma . No debes circular por esta franja de seguridad lateral. Solo en áreas rurales, en caso de emergencia, podrás traspasar esta línea para permanecer en la berma. La línea de borde de calzada también puede ser segmentada cuando hay un ensanchamiento de la calzada al llegar a un cruce, cuando se provee una zona de estacionamiento o cuando hay una pista de desaceleración o aceleración. Se distinguen por tener un patrón diferente al de las otras líneas discontinuas que delimitan las pistas de circulación, y en el caso de autopistas y autovías, por ser, además, en general más anchas (ver imagen en la página 118). Además, debes saber que en caminos de montaña donde la nieve es frecuente, tanto la demarcación del eje central como la de borde de calzada pueden ser de color amarillo ( ). Por otro lado, en áreas urbanas suele demarcarse al borde de la calzada o en la solera misma, una franja amarilla continua, con el propósito de señalar la prohibición de estacionar a lo largo de esta ( ). 2 3 1 Señales horizontales o demarcaciones Las demarcaciones (marcas viales) aclaran y fortalecen las normas. Es así como pueden servir de advertencia, para dividir la calzada o también para indicar prohibiciones. Estas constan de líneas longitudinales o transversales, flechas, símbolos, leyendas y otros. Conozcamos los tipos de marcas viales: Demarcaciones de pistas, de centro y bordes de calzada La línea longitudinal de color blanco que marca el eje de calzada y que separa los flujos vehiculares que circulan en sentidos opuestos puede ser continua o discontinua (segmentada). 6 5 4 1 2 3 4 5 6", "83": "¡No lo olvides! En un paso de cebra, las y los peatones tienen prioridad. Demarcaciones en los cruces: En un cruce regulado con semáforo adquiere gran importancia la línea blanca trasversal a la calzada que determina la línea de detención antes de la cual deben detenerse los vehículos ( ). Además, son importantes las líneas blancas que señalan el paso de peatones y de ciclistas. Bajo ciertas condiciones (cruce semaforizado, ancho de la calzada) puede existir una zona entre la línea de detención y el paso de peatones que corresponde a la zona de espera especial para personas conductoras de ciclos y/o motociletas ( ). Las líneas de detención pueden estar asociadas también a señales PARE o Ceda el Paso, así como a pasos peatonales y cruce de ciclovías. Demarcación paso de cebra: Los pasos peatonales en lugares no semaforizados, es decir, los pasos o cruces de cebra, se encuentran demarcados con franjas blancas paralelas al eje de la vía, precedidas por una línea de detención transversal ( ) y muchas veces, también, por líneas en zig-zag al borde de la calzada. En los pasos cebra y en los pasos peatonales en cruces semaforizados no demarcados, siempre existe una línea de detención. Aunque esta no esté pintada, imaginariamente se ubica a no menos de un metro antes de éstos. Demarcación de no bloquear cruce: Algunas intersecciones pueden estar demarcadas con líneas amarillas diagonales que forman cuadrados ( ). Estas marcas, que se utilizan en vías congestionadas, advierten a las personas conductoras que deben tomar todas las medidas del caso a fin de no quedar detenidas en la intersección. Las personas que enfrenten esta demarcación sólo pueden cruzar cuando en la salida del cruce exista espacio suficiente para no quedar detenido en él. Demarcación de símbolos y leyendas: Estas marcas indican a quienes conducen las maniobras permitidas y acciones que deben realizar, así como también advierten sobre peligros. En este grupo se encuentran las flechas que indican la o las direcciones a seguir o el deber de abandonar una pista, las señales Ceda el Paso, PARE y la leyenda LENTO ( ), entre otras. Otras demarcaciones: Entre estas se encuentran las líneas longitudinales que delimitan lugares de parada de buses, pistas para ciclistas y pistas prioritarias para vehículos de emergencia ( ), así como las áreas achuradas que posibilitan una mejor canalización de los flujos. No debes circular, menos aún estacionar, sobre estas áreas achuradas ( ). Si vas por una pista con estas marcas, abandona la pista tan pronto puedas hacerlo de manera segura. 7 7 8 8 9 10 11 12 13 11 10 9 12 13", "84": "Recuerda: El espacio requerido para virar por un vehículo de gran tamaño puede exceder el ancho de una pista. Detente si estás en una situación como la mostrada en la imagen, o si estás detrás del camión, y espera a que finalice su maniobra. Las reglas del tránsito Además de las instrucciones que se expresan a través de Carabineros, semáforos o señalización, existen también otras reglas para regular la circulación de los vehículos por calles y caminos, y hacer que esta sea más segura. Estas reglas se describen en los capítulos y subcapítulos que siguen. La obligación de ceder el paso Los encuentros en cruces, en general, implican ciertos riesgos. Muchos siniestros de tránsito ocurren en estos lugares. Las razones son variadas: a veces, quien conduce no ha puesto atención al tránsito; otras, ha calculado mal la distancia y velocidad, y otras, ha estimado mal su propia capacidad de detenerse a tiempo. Para que el tránsito sea seguro en las intersecciones, existen reglas acerca de la prioridad al cruzar. Cuando te aproximes a un cruce sin semáforo, o a uno donde no haya un Carabinero regulando el tránsito, y este no tenga señales PARE o Ceda el Paso, siempre tienes que dar preferencia a los vehículos que se aproximan al cruce por la otra vía desde tu derecha . Al momento de virar no tienes preferencia : cuando tengas el propósito de virar, carecerás de toda preferencia y deberás respetar el derecho preferente de paso que en tales circunstancias tengan los demás vehículos que circulen y las y los peatones en los cruces o pasos reglamentarios. Al incorporarte a una zona de tránsito en rotación –rotonda o minirrotonda- , debes ceder el paso a los vehículos que circulan por ella . Al enfrentar la señal PARE debes detener tu vehículo y permitir el paso de quienes circulan por la otra vía. Sólo podrás reanudar la marcha cuando no exista posibilidad alguna de siniestro. Al enfrentar una señal CEDA EL PASO , debes reducir la velocidad hasta detenerte si es necesario y ceder el paso a los vehículos que circulan por la otra vía y cuya proximidad constituya riesgo de siniestro.", "85": "En las áreas rurales, cuando te aproximes a una vía principal por una secundaria, debes ceder el paso a los vehículos que circulen por la vía principal . Cuando te aproximes a un cruce no semaforizado y tengas la obligación de ceder el paso, reduce tu velocidad con tiempo suficiente para detenerte cuando sea necesario. Tienes que mostrar claramente tu intención . Ten presente también, que ceder el paso significa que quien tiene la preferencia en el uso de la vía no debe verse en la obligación de modificar su trayectoria ni su velocidad a consecuencia de la acción de quien no tiene la prioridad. Otras obligaciones de ceder el paso: Al aproximarte a un paso de cebra en el que alguien se disponga a cruzar, debes detenerte y cederle el paso. Al incorporarte a la circulación desde una vía particular, desde un inmueble o un estacionamiento, debes ceder el paso a los vehículos en tránsito, incluidos los ciclistas, así como a las y los peatones. Al ponerte en marcha después de una detención, debes ceder el paso a los vehículos en tránsito y a las y los peatones. Al salirte de la circulación para ingresar a una vía particular, a un estacionamiento o un inmueble, carecerás de todo derecho preferente de paso respecto de peatones y vehículos en tránsito. Cuando la pista por la que circulas se ve sorpresivamente obstaculizada, también carecerás de prioridad frente a los demás vehículos, para poder cambiarte de pista. Vehículos de emergencia: Ante la aproximación de un vehículo de emergencia (vehículos policiales, carros bomba, ambulancias y pertenecientes a la Policía de Investigaciones) que hagan uso de sus señales luminosas y/o acústicas, deberás cederles el derecho a vía , ya sea desplazándote hacia un lado en la calzada y deteniéndote si es necesario hasta que haya pasado si ambos circulan en el mismo sentido, o bien cediéndoles el paso si se trata de un cruce. Si en estas circunstancias vas por una pista demarcada para vehículos de emergencia, abandónala tan pronto puedas hacerlo de manera segura. Signos y señales A veces, ya sea por desconocimiento o porque interpretamos mal las señales de otras personas, pueden presentarse malentendidos en el tránsito. Como persona conductora, tienes la obligación de hacer saber a quien conduce el vehículo que te sigue qué es lo que vas a hacer, para que sepa a qué atenerse . Sin embargo, el hecho de que hagas señales a tiempo no te libera de la obligación de tener precaución. Pon mucha atención a las señales de las demás personas e intenta interpretar sus intenciones. Si un vehículo hace señales con su intermitente izquierdo, significa que va a virar hacia la izquierda. Si interpretas mal la situación y crees que te está indicando que puedes pasarlo, puede ocurrir un siniestro.", "86": "Señaliza cuando vayas a ponerte en movimiento desde el borde de la calzada. Señaliza con suficiente anticipación cuando vayas a cambiar de pista de circulación y cuando vayas adelantar o sobrepasar. Señaliza con al menos 30 metros de anticipación cuando vayas a virar. Algunos casos: La señal debe darse con tiempo suficiente antes de iniciar la maniobra pensada, y debe ser visible e inequívoca. El que señalices no te libera de la posibilidad de un siniestro. Concentra tu atención en lo que estás haciendo y no dejes de tener consideración hacia las demás personas usuarias de las vías. Ante un cambio de pista, no comiences a señalizar hasta que no tengas seguridad de que podrás realizar la maniobra. Recuerda siempre la secuencia espejo – señalización – maniobra . Alternativamente, las maniobras de viraje y de cambio de pista pueden ser advertidas por quien conduce mediante señales realizadas con su brazo , de la siguiente manera: Brazo extendido horizontalmente indica viraje a la izquierda. Brazo en ángulo recto hacia arriba indica viraje a la derecha. Brazo extendido hacia abajo indica disminución de velocidad o detención.", "87": "Las luces de freno se encienden automáticamente cuando pisas el pedal de freno . A veces, puede resultar necesario avisar a quienes van detrás tuyo, pisando ligeramente el pedal de freno para que las luces se enciendan. Las luces intermitentes de emergencia advierten a las demás personas que tu vehículo se encuentra detenido . Úsalas cuando tu vehículo haya sufrido un desperfecto o haya una situación de riesgo. DEBES SABER: Las luces traseras blancas se encienden al retroceder . Sólo para prevenir un siniestro y siempre que su uso sea estrictamente necesario, puedes hacer uso de la bocina de tu vehículo. Nunca la utilices en un túnel, ni a la entrada o salida de este. Tampoco las uses cerca de personas ciclistas. Ni al adelantar o sobrepasar a animales . También recuerda que esta es la forma que tienen las personas ciclistas para advertir sus maniobras. Además, pueden indicar su viraje a la derecha con el brazo derecho extendido horizontalmente y complemetar la advertencia con la utilización de un señalizador eléctrico adosado al cuerpo. La ubicación del vehículo El mantenerte a una distancia suficiente de quienes marchan adelante tuyo y el situar bien tu vehículo antes de virar, también son una forma de comunicación entre las personas usuarias de las vías. Las pistas están diseñadas con el espacio necesario para conducir un vehículo de cuatro ruedas, si bien pueden existir casos donde estas no estén demarcadas, siempre contarán con el espacio necesario para circular. En ocasiones, el eje de calzada puede no estar demarcado. En este caso, la división de la calzada es en dos partes iguales y siempre debes circular por la derecha. Distancia a los vehículos que van delante Saber cuál es la distancia correcta con respecto al vehículo que va adelante puede resultar difícil. Una regla aplicable en carreteras dice que se debe mantener una distancia medida en metros equivalente a lo que el velocímetro te indica en kilómetros. Por ejemplo, si circulas a 80 km/h debes mantenerte a una distancia de unos 80 metros respecto del vehículo que va delante. En el tránsito urbano, dicha distancia puede reducirse a la mitad. Mantener una distancia muy corta aumenta los riesgos de siniestro, siendo uno de los factores que con mayor frecuencia contribuye a éstos. La visibilidad hacia adelante se ve reducida, dificultando los adelantamientos. La conducción se hace irregular y poco económica.", "88": "1001 1002 1003 Otra regla aplicable en carreteras que te permite saber si marchas a una distancia adecuada del vehículo que va delante, es la denominada “ Regla de los Tres Segundos ”: Para usarla, fija tu mirada en un punto, por ejemplo, un árbol. Tan pronto el vehículo que circula adelante pase el árbol, comienza a contar... mil uno, mil dos, mil tres. Si pasas el árbol antes de haber contado mil tres significa que la distancia que estás guardando es muy corta. Disminuye la presión sobre el acelerador. Cuando descubras que un vehículo que va adelante tuyo ha comenzado a frenar, transcurrirá aproximadamente un segundo antes de que tú empieces a frenar. En este tiempo recorrerás alrededor de 15 metros si vas a 50 km/h, de 20 metros si vas a 70 km/h y 25 metros si vas a 90 km/h. Por lo general, los choques en serie se deben a que las personas conductoras guardan una distancia demasiado corta respecto de los vehículos que van delante, lo que no les permite frenar a tiempo. Varía la distancia que mantienes respecto del vehículo que va adelante según la velocidad y estado del pavimento. En caso de congestión vehícular, cuando las distancias disminuyen y los riesgos de choques y colisiones aumentan, pon mayor atención y prepárate para poder actuar a tiempo. PARA REDUCIR LOS RIEGOS DE COLISIÓN: Mantén una distancia adecuada de los vehículos que van adelante. En carreteras, usa la “Regla de los Tres Segundos”. Como persona conductora, debes permanecer atenta al tránsito y estar preparada para frenar: cambia el pie desde el pedal del acelerador al del freno y mantenlo listo para utilizarlo. Agrega un tiempo extra si las condiciones climáticas o de la carretera son adversas.", "89": "Sobre esta materia, la ley señala que cuando dos o más vehículos circulan en un mismo sentido por la derecha, cada persona conductora debe mantener, respecto del vehículo que le antecede, una distancia suficiente para que cualquier otro pueda adelantarlo, ingresando sin peligro en dicho espacio. La misma ley exime de tal disposición sólo a los vehículos que marchan en caravana en un cortejo fúnebre. Aumenta tu distancia si en la ciudad vas circulando detrás de un vehículo con patente extranjera. Quien conduce el vehículo podría desconocer el lugar y frenar sorpresivamente para leer el nombre de una calle, pasar por alto una señal o virar inesperadamente. Distancia lateral Los cruces con vehículos y los adelantamientos implican siempre riesgos. El riesgo es mayor cuando la visibilidad es reducida, como en curvas, en cambios de rasantes, en la oscuridad y cuando hay niebla. Por ello, ubica tu vehículo de forma segura en la pista, por posibles adelantamientos y cruces con otros. Cuando circules por una carretera de una pista por sentido, mantente lo más cerca posible del borde derecho de la calzada. Otras personas conductoras pueden equivocarse al hacer sus maniobras, como se muestra en la imagen. Tanto los vehículos que vienen en sentido contrario como los que vienen detrás tuyo pueden adelantar en una ocasión no adecuada. Recuerda que para adelantar debes hacerlo por la izquierda. Cuando hay vehículos estacionados Deja un espacio suficiente, equivalente al ancho de una puerta , al pasar cerca de vehículos estacionados. Alguien podría intentar bajar a la calzada repentinamente, o un vehículo abandonar el estacionamiento sin previo aviso. Reduce tu velocidad y presta atención a peatones que puedan aparecer entre los vehículos con la intención de cruzar.", "90": "Uso correcto de las pistas de circulación Sitúate completamente dentro de una pista, a fin de no obstaculizar el tránsito por la otra. Circula siempre por la mitad derecha de la calzada. En ocasiones, puedes circular por la pista izquierda cuando: Requieras traspasar el eje de la calzada para adelantar a otro vehículo. El tránsito por la mitad derecha de la calzada esté impedido por trabajos u otros siniestros que alteren la circulación normal. En el tránsito urbano, la calzada tenga demarcadas tres o más pistas de circulación en un mismo sentido. En el tránsito urbano, la calzada esté señalizada para la circulación en un solo sentido. Te encuentres en autopistas y carreteras. De todas formas, te recomendamos circular por la pista derecha y dejar libre la o las de la izquierda para quienes deseen sobrepasarte. No olvides respetar la señalización que designa pistas destinadas a encauzar la circulación en determinada dirección o sentido, así como también la que reserva pista para el tránsito de alta o baja velocidad. Cambios de pista de circulación Como se señaló anteriormente, en ciertos casos podrás ubicar tu vehículo en cualquiera de las pistas de circulación. Podrás cambiarte a la pista adyacente siempre y cuando puedas hacerlo en forma segura y sin obstaculizar innecesariamente a las demás personas, pero no podrás pasar hacia aquella pista para ingresar de forma inmediata a una tercera. Las flechas en la calzada te indican que debes abandonar la pista de aceleración e incorporarte al resto del tránsito. Las señales de tránsito informativas colocadas en altura sobre la calzada facilitan la selección de la pista correcta.", "91": "Virajes Pasos a seguir para realizar un viraje a la derecha Ubícate tan cerca como sea posible del borde derecho de la calzada, a menos que exista una ciclovía, en cuyo caso debes posicionarte los más cerca del elemento segregador. Asegúrate que no estén transitando ciclos. Gira tan cerca como sea posible de la cuneta de la mano derecha, del borde de la calzada, o del costado del elemento segregador de la ciclovía. Luego de haber virado, elije la ubicación más conveniente para continuar. Verificar a través del espejo retrovisor, de los espejos laterales y mirando por encima de tu hombro que no vienen vehículos que te impidan el cambio. Advierte tu intención de cambiar de pista mediante el brazo o accionando los dispositivos luminosos del vehículo con anticipación suficiente. AL CAMBIARTE DE PISTA DEBES: Ayuda a quienes intenten cambiar de pista. Evita los cambios de pista sin necesidad (cada desplazamiento implica siempre un riesgo). Mirar a larga distancia hacia adelante y hacia atrás. No olvides que: Debes señalizar tu intención de virar con una anticipación suficiente: a lo menos 30 metros antes . Posicionarte correctamente facilitará tu maniobra y el paso de las demás personas usuarias. Al ubicarte correctamente mostrarás a las demás personas conductoras la trayectoria que vas a seguir. Asegúrate a través de tus espejos retrovisores que no vengan ciclistas. Debes ceder el paso a las y los peatones que estén cruzando por un paso peatonal. También debes planear pronto tu ubicación correcta después de haber virado. Debes apagar el señalizador una vez finalizado el viraje. 30 mts", "92": "Recuerda que tus preparativos para efectuar un viraje tienen que comenzar con anticipación, de modo que las demás personas no se sorprendan con la maniobra que has pensado hacer. La distancia con que debas señalizar tu maniobra dependerá de la velocidad en cada ocasión. En una carretera donde la velocidad máxima permitida sea 100 km/h puede tratarse de unos 300 a 400 metros. 1 2 3 Viraje a la izquierda Mucho antes de virar a la izquierda usa los espejos para asegurarte de conocer la posición y el movimiento del tráfico que viene detrás tuyo. Señaliza tu intención de virar a lo menos con 30 metros de anticipación y fíjate en las y los peatones. Para virar desde una vía de doble tránsito, aproxímate en forma segura al costado derecho del eje o de la línea central de la vía por la cual circulas ( , 2 ). Como es muy difícil juzgar la velocidad de los vehículos que vienen en sentido contrario, si no sientes seguridad de alcanzar a virar adecúa tu velocidad o detente, y continúa luego de dejarlos pasar. Si te ves en la obligación de detenerte, hazlo unos metros antes de la intersección con tus ruedas delanteras orientadas hacia adelante. Si te chocaran por atrás ( 3 ) y tuvieras tus ruedas torcidas a la izquierda, serías lanzado hacia la pista que viene en sentido contrario, lo que podría dar origen a una colisión frontal. No te sitúes en forma oblicua. Ingresa a la intersección cuando dispongas del espacio y tiempo suficiente y luego entra a la otra vía tomando el lado derecho de su eje o de la línea central si la vía es bidireccional, o la pista de tu izquierda si la vía fuese de un único sentido de tránsito. Antes de efectuar un viraje a la izquierda es especialmente importante concentrar tu atención en el tránsito que viene tanto en sentido contrario como por detrás. Si te encuentras con objetos o vehículos que dificulten tu visión, debes detenerte y luego avanzar lentamente hasta que tengas una visión plena. Debes ceder el paso a quienes transitan en sentido contrario y no obstaculizar innecesariamente a los vehículos que se acercan por detrás tuyo. 1 2 3", "93": "Pon especial atención cuando vayas a efectuar un giro a
