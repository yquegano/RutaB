<style>
:root{--bg:#fbf7f2;--card:#ffffff;--ink:#2f2a3d;--muted:#766f86;--line:#ece4f3;--pink:#f7b8cf;--coral:#f9c6a8;--mint:#b6e8d3;--sky:#b9dcf7;--sun:#fde7a3;--lav:#cfc2f5;--ok:#2e9e6b;--bad:#d9546a;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;margin:0 0 .4em;font-weight:600}
button{font-family:inherit;font-size:15px;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 90px}
header.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--lav);color:var(--ink);position:relative;z-index:6;}
.logo{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-family:Fredoka;font-size:24px;color:#7b62d6;flex-shrink:0}
.top small{display:block;font-size:12px;color:#4d4363}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:rgba(253,246,238,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5;border-bottom:2px dashed var(--line)}
nav.tabs button{background:#fff;border:2px solid var(--line);color:var(--ink);padding:7px 13px;border-radius:999px;white-space:nowrap;font-weight:800}
nav.tabs button.on{background:var(--lav);color:var(--ink);border-color:#b9a8ee}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{border-radius:16px;padding:12px;color:var(--ink)}.stat b{font-size:28px;font-family:Fredoka;display:block}.stat span{font-size:13px;opacity:.95}
.s1{background:var(--lav)}.s2{background:var(--mint)}.s3{background:var(--pink)}.s4{background:var(--sun)}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;color:var(--ink);background:var(--sky);box-shadow:0 3px 0 #9cc4e6}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.y{background:var(--sun);box-shadow:0 3px 0 #e8cf7f}.btn.p{background:var(--pink);box-shadow:0 3px 0 #e39ab6}.btn.m{background:var(--mint);box-shadow:0 3px 0 #92cdb4}
.btn.o{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#f1ecfc;color:#6d58c4}
.pill.d{background:#fff3cc;color:#a77800}
.opt{display:block;width:100%;text-align:left;background:#fbf9ff;border:2px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:14px;margin:8px 0;font-weight:600}
.opt:hover{border-color:#9cc4e6}
.opt.ok{border-color:var(--ok);background:#e5fbf1}.opt.bad{border-color:var(--bad);background:#ffe9ec}.opt.sel{border-color:#b9a8ee;background:#f1ecfc}
.exp{border-left:5px solid var(--sun);padding:10px 12px;background:#fffaeb;border-radius:0 12px 12px 0;margin-top:10px;font-size:15px}
.bar{height:12px;background:#f1eaff;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint)}
.mod h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mod ul{margin:.3em 0 0;padding-left:1.2em}.mod li{margin:.35em 0}
.src{font-size:12px;color:var(--muted)}
.big{font-size:46px;font-family:Fredoka;font-weight:700;color:#7b62d6}
.hearts{font-size:22px;letter-spacing:2px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
a{color:#6d58c4}
.timer{font-family:Fredoka;font-size:22px}
.spk{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:800}
.spk.playing{background:var(--pink);border-color:var(--pink)}
.bookbtn{background:#eafaf4;border:2px solid #c6f0e0;color:#178a66;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:800}
/* libro */
.viewer{position:relative;background:#fff;border-radius:14px;overflow:hidden;border:2px solid var(--line);margin:8px auto;max-width:760px}
.viewer img{display:block;width:100%;height:auto}
.hl{position:absolute;background:rgba(253,215,110,.45);border:2px solid #f0b46e;border-radius:4px;box-shadow:0 0 0 4px rgba(240,180,110,.2);animation:pulse 1.4s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,138,92,.05)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--sun);border-color:var(--sun)}
input[type=text],input[type=number]{font-family:inherit;font-size:15px;padding:9px 11px;border:2px solid var(--line);border-radius:12px}
.code{font-family:Fredoka;font-size:40px;letter-spacing:8px;color:var(--lav)}
.player{display:flex;justify-content:space-between;padding:8px 10px;border-radius:12px;background:#faf7ff;margin:4px 0;font-weight:700}
.vol{display:flex;align-items:center;gap:8px;font-size:13px}
input[type=range]{accent-color:#7b62d6}
.badges{display:flex;gap:6px}.bdg{background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.hero{background:var(--lav);border-radius:22px;padding:18px;margin:12px 0}
.hero .hi{font-size:13px;color:#4d4363}.hero .nm{font-family:Fredoka;font-size:24px;font-weight:600;margin:2px 0 12px}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hs{background:#fff;border-radius:14px;padding:10px 12px}.hs b{display:block;font-family:Fredoka;font-size:24px;line-height:1.1;color:#6d58c4}.hs span{font-size:12px;color:var(--muted)}
.prob{background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}.prob b{font-family:Fredoka;font-size:28px;color:#2e9e6b}
.dedi{background:var(--pink);border-radius:16px;padding:10px 14px;margin:12px 0;text-align:center;font-weight:800}
.sec{font-family:Fredoka;font-size:18px;margin:18px 0 8px}
.comp{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0;cursor:pointer}
.comp .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.comp .inf{flex:1;min-width:0}.comp .inf b{display:block;font-size:15px}.comp .inf small{color:var(--muted);font-size:12px}
.comp .bar{margin-top:5px;height:8px}.comp .st{font-size:12px;font-weight:800;white-space:nowrap}
.ev{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;cursor:pointer}
.ev .t{font-family:Fredoka;font-size:17px}.ev .d{font-size:13px;color:var(--muted)}.ev .mt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:800;color:#6d58c4}
.ev.c1{border-left:8px solid var(--sky)}.ev.c2{border-left:8px solid var(--sun)}.ev.c3{border-left:8px solid var(--mint)}.ev.c4{border-left:8px solid var(--pink)}
@media(max-width:520px){.badges{display:none}}
@media(max-width:520px){header.top h1{font-size:17px!important}.top small{font-size:11px}.vol input{width:60px!important}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style id="cute">
:root{--sol:#FFE08A;--durazno:#FFCBA4;--lila:#C9B6F0;--lila-d:#A98FE0;--cielo:#A9DCF2;--limon:#C2E89A;--menta:#A8E6D4;--rosa:#FFC4D6;--verde:#A5DD8A;--crema:#FFFCF5;--tinta:#2E2435;
 --bg:#C9B6F0;--ink:#2E2435;--line:#2E2435;--lav:#C9B6F0;--mint:#A8E6D4;--pink:#FFC4D6;--sky:#A9DCF2;--sun:#FFE08A;--coral:#FFCBA4;--muted:#5d5170}
body{font-family:'Baloo 2',system-ui,sans-serif;font-weight:600;background:var(--lila);font-size:17px}
h1,h2,h3,.big,.timer,.nm,.sec,.ev .t,.hs b,.prob b,.stat b{font-family:'Chewy',cursive!important;font-weight:400;letter-spacing:.3px}
header.top{background:var(--lila);border-bottom:0}
header.top h1{color:#fff;text-shadow:3px 3px 0 var(--tinta);font-size:24px!important}
.top small{color:var(--tinta);font-weight:700}
.logo{border:3px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta);font-family:'Chewy';color:var(--lila-d);background:var(--sol)}
.bdg{border:3px solid var(--tinta);box-shadow:2px 2px 0 var(--tinta);background:var(--sol)}
nav.tabs{background:var(--lila);border-bottom:0;backdrop-filter:none}
nav.tabs button{border:3px solid var(--tinta);box-shadow:2px 2px 0 var(--tinta);font-weight:800}
nav.tabs button.on{background:var(--sol);border-color:var(--tinta)}
.card,.hero,.comp,.ev,.dedi,.viewer{border:4px solid var(--tinta)!important;box-shadow:6px 6px 0 var(--tinta);border-radius:24px}
.card,.comp,.ev{background:#fff}
.hero{background:var(--crema)}
.hs,.prob{border:3px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta)}
.hs:nth-child(1){background:var(--sol)}.hs:nth-child(2){background:var(--menta)}.hs:nth-child(3){background:var(--rosa)}.hs:nth-child(4){background:var(--cielo)}
.hs b{color:var(--tinta)}.prob b{color:var(--lila-d)}
.sec{display:inline-block;color:var(--tinta);text-shadow:none;font-size:20px;background:var(--sol);border:3px solid var(--tinta);border-radius:999px;box-shadow:3px 3px 0 var(--tinta);padding:2px 16px;margin:16px 0 8px}
.comp .ic{border:3px solid var(--tinta)}
.ev{border-left-width:4px!important}.ev.c1{background:var(--cielo)}.ev.c2{background:var(--sol)}.ev.c3{background:var(--menta)}.ev.c4{background:var(--rosa)}
.ev .d,.ev .mt{color:var(--tinta)}
.btn,.spk,.bookbtn{border:3px solid var(--tinta)!important;border-radius:100px;box-shadow:4px 4px 0 var(--tinta)!important;font-weight:800;color:var(--tinta)}
.btn{background:var(--lila-d);color:#fff;font-family:'Chewy';font-size:19px;font-weight:400;padding:9px 20px}
.btn.y{background:var(--sol);color:var(--tinta)}.btn.m{background:var(--menta);color:var(--tinta)}.btn.p{background:var(--rosa);color:var(--tinta)}.btn.o{background:#fff;color:var(--tinta)}
.btn:active,.spk:active,.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--tinta)!important}
.opt{border:3px solid var(--tinta);border-radius:18px;box-shadow:4px 4px 0 var(--tinta);background:#fff;font-weight:700}
.opt.ok{background:var(--verde);border-color:var(--tinta);animation:pop .4s}.opt.bad{background:var(--rosa);border-color:var(--tinta);animation:shake .4s}
@keyframes pop{40%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.exp{border:3px dashed var(--tinta);border-radius:16px;background:var(--crema)}
.pill{background:var(--sol);color:var(--tinta);border:2px solid var(--tinta)}.pill.d{background:var(--durazno)}
.bar{background:#fff;border:2px solid var(--tinta);height:14px}.bar i{background:var(--verde)}
.dedi{background:var(--rosa);font-family:'Chewy';font-size:20px;font-weight:400}
.big{color:var(--lila-d);text-shadow:3px 3px 0 var(--tinta)}
.mascota{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer}
.robot{font-size:62px;line-height:1;animation:idle 3s ease-in-out infinite;filter:drop-shadow(0 5px 0 rgba(0,0,0,.12))}
.robot.talk{animation:talk .35s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-8px)}}@keyframes talk{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.08) rotate(4deg)}}
.bubble{flex:1;background:var(--menta);border:3px solid var(--tinta);border-radius:18px;padding:10px 12px;font-size:16px;position:relative;font-weight:700}
.bubble::before{content:'';position:absolute;left:-13px;top:50%;transform:translateY(-50%);border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:13px solid var(--tinta)}
.hearts{font-size:26px}

.shead{background:#fff;border:3px solid var(--tinta);border-radius:18px;box-shadow:4px 4px 0 var(--tinta);padding:8px 14px;margin:10px 0}
.shead .tg{display:inline-block;background:var(--sol);border:2px solid var(--tinta);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.shead h2{margin:0;font-size:21px}.shead p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.35}
.mlist{display:grid;gap:10px}
.mitem{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--tinta);border-radius:20px;box-shadow:4px 4px 0 var(--tinta);padding:12px;cursor:pointer}
.mitem .ic{width:48px;height:48px;border-radius:14px;border:3px solid var(--tinta);display:grid;place-items:center;font-size:24px;flex-shrink:0}
.mitem b{display:block;font-size:16px}.mitem small{color:var(--muted);font-size:13px;display:block;line-height:1.3}
.mhdr{border:4px solid var(--tinta);border-radius:24px;box-shadow:6px 6px 0 var(--tinta);padding:16px;margin:12px 0;background:var(--sol)}
.mhdr .mic{font-size:40px}.mhdr .mtag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.mhdr h2{margin:4px 0}.mhdr .mmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:800;margin-top:6px}
.blk{border:3px solid var(--tinta);border-radius:18px;padding:12px 14px;margin:10px 0;background:#fff}
.blk .bl{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.blk.obj{background:var(--menta)}.blk.tem{background:var(--cielo)}.blk.sab{background:#fff}.blk.ley{background:var(--durazno)}
.blk ul{margin:.2em 0 0;padding-left:1.2em}.blk li{margin:.3em 0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:110px;background:#fff;border:3px solid var(--tinta);border-radius:20px;box-shadow:4px 4px 0 var(--tinta);padding:12px;font-family:inherit;font-weight:800;font-size:15px;color:var(--tinta)}
.tbtn .e{font-size:30px}.tbtn .n{font-size:12px;background:var(--sol);border:2px solid var(--tinta);border-radius:999px;padding:1px 8px}
.tbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--tinta)}
.pgd{background:#fff;border:3px solid var(--tinta);border-radius:16px;box-shadow:3px 3px 0 var(--tinta);padding:10px 12px;margin:8px 0}.pgd summary{cursor:pointer;font-size:15px}
.gidx{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.gidx a{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--sol);border:2px solid var(--tinta);color:var(--tinta);text-decoration:none;font-family:'Chewy';font-size:18px;box-shadow:2px 2px 0 var(--tinta)}
.gdet{margin:10px 0;scroll-margin-top:70px}.gdet summary{display:inline-flex;gap:8px;align-items:center;cursor:pointer;list-style:none;background:var(--lila-d);color:#fff;border:3px solid var(--tinta);border-radius:999px;box-shadow:4px 4px 0 var(--tinta);padding:6px 18px;font-family:'Chewy';font-size:22px}.gdet summary::-webkit-details-marker{display:none}.gdet summary span{font-family:'Baloo 2';font-size:13px;background:#fff;color:var(--tinta);border-radius:999px;padding:0 8px}
.gblk{display:inline-block;width:auto}.gblk.on{display:block}.gblk .gbody{display:none}.gblk.on .gbody{display:block}.gletter{cursor:pointer;margin:6px 6px 6px 0!important}.gblk.on .gletter{background:var(--sol);color:var(--tinta)}
.gletter{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--lila-d);color:#fff;border:3px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta);font-family:'Chewy';font-size:24px;margin:14px 0 6px}
.gitem{border:2px solid var(--tinta);border-radius:14px;padding:10px 12px;margin:8px 0;color:var(--tinta)}
.leyes p{margin:0 0 10px;line-height:1.45}
.dedi2{background:var(--rosa);border:4px solid var(--tinta);border-radius:24px;box-shadow:6px 6px 0 var(--tinta);padding:16px;margin:12px 0;text-align:center}
.dedi2 h3{margin:0 0 6px}.dedi2 p{margin:.3em 0}
.steps{counter-reset:st;list-style:none;padding:0;margin:0}.steps li{counter-increment:st;position:relative;padding:8px 0 8px 44px;border-bottom:2px dashed #e4dcf3}
.steps li::before{content:counter(st);position:absolute;left:0;top:6px;width:32px;height:32px;border-radius:50%;background:var(--sol);border:3px solid var(--tinta);display:grid;place-items:center;font-family:'Chewy';font-size:18px}
main.wrap{padding-bottom:130px}
#alien{position:fixed;right:16px;bottom:18px;left:auto!important;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:6px;cursor:pointer}
#alien .a{width:66px;height:66px;border-radius:50%;background:var(--limon);border:4px solid var(--tinta);box-shadow:4px 4px 0 var(--tinta);display:grid;place-items:center;font-size:36px;animation:flot 3s ease-in-out infinite}
#alien .t{background:#fff;border:3px solid var(--tinta);border-radius:16px;padding:4px 10px;font-size:13px;font-weight:800;box-shadow:2px 2px 0 var(--tinta)}
#alien .a.puff{animation:puff 1.4s ease-out forwards;background:#fff}#alien .a.pop{animation:pop2 .6s ease-out}
@keyframes puff{0%{transform:scale(1);opacity:1}60%{transform:scale(1.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}@keyframes pop2{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes flot{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
#amodal{position:fixed;inset:0;background:rgba(46,36,53,.45);z-index:40;display:none;align-items:flex-end;justify-content:center;padding:12px}
#amodal.on{display:flex}#amodal .box{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#fff;border:4px solid var(--tinta);border-radius:24px;box-shadow:6px 6px 0 var(--tinta);padding:16px}
</style>
<style id="app-install">
#instBtn{flex-shrink:0;border:3px solid var(--tinta,#2E2435);box-shadow:2px 2px 0 var(--tinta,#2E2435);background:var(--sol,#FFE08A);color:var(--tinta,#2E2435);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px;min-height:40px}

const TEMAS={sin:'Siniestros y física',veh:'El vehículo y seguridad',per:'La persona en el tránsito',vul:'Usuarios vulnerables y niños',cir:'Normas de circulación',est:'Estacionamiento',esp:'Circunstancias especiales',lic:'Proceso de licencia'};
const Q=[
{t:'sin',q:'Según el libro, ¿qué pasa con la probabilidad de que un peatón muera atropellado si la velocidad sube de 30 a 50 km/h?',o:['Se duplica','Se multiplica por ocho','Aumenta un 10%','No cambia'],a:1,e:'La probabilidad de muerte del peatón se multiplica por ocho cuando la velocidad sube de 30 a 50 km/h.',p:8,d:1},
{t:'sin',q:'Un peatón impactado a 30 km/h o menos tiene aproximadamente…',o:['50% de posibilidades de sobrevivir','90% de posibilidades de sobrevivir','10% de posibilidades de sobrevivir','Ninguna posibilidad'],a:1,e:'A 30 km/h o menos, los peatones tienen 90% de posibilidades de sobrevivir; a 45 km/h o más, menos del 50%.',p:8,d:1},
{t:'sin',q:'¿En qué porcentaje de los siniestros de tránsito está presente la falla humana?',o:['Cerca del 30%','Cerca del 50%','Más del 90%','Menos del 10%'],a:2,e:'Las estadísticas indican que la falla humana está presente en más del 90% de los siniestros.',p:8},
{t:'sin',q:'¿Cuál es un tiempo normal de reacción de una persona conductora?',o:['Un segundo','Tres segundos','Medio minuto','Una décima de segundo'],a:0,e:'Un tiempo normal de reacción es de un segundo. En ese segundo, a 36 km/h se recorren 10 metros; a 72 km/h, 20 metros.',p:23},
{t:'sin',q:'Durante un segundo de reacción, un vehículo a 72 km/h recorre aproximadamente…',o:['5 metros','10 metros','20 metros','72 metros'],a:2,e:'A 36 km/h se recorren 10 m por segundo; al doble de velocidad (72 km/h), 20 m.',p:23,d:1},
{t:'sin',q:'Si duplicas la velocidad, la distancia de frenado…',o:['También se duplica','Aumenta cuatro veces','Se mantiene igual','Disminuye'],a:1,e:'La distancia de frenado crece con el cuadrado de la velocidad: al duplicarla, aumenta cuatro veces; al triplicarla, nueve.',p:24,d:1},
{t:'sin',q:'Con pavimento bueno y seco, ¿cuántos metros se necesitan aproximadamente para detenerse a 50 km/h?',o:['Unos 10 metros','Unos 25 metros','Unos 80 metros','Unos 150 metros'],a:1,e:'A 50 km/h se necesitan unos 25 metros; a 100 km/h, unos 80 metros.',p:96,d:1},
{t:'sin',q:'¿Qué ocurre en un "aquaplaning" o hidroplaneo?',o:['El motor se moja y se apaga','Una capa de agua se interpone entre la calzada y los neumáticos y se pierde adherencia','Los frenos se recalientan','El parabrisas se empaña'],a:1,e:'Con lluvia intensa se forma una película de agua entre la calzada y los neumáticos, haciendo muy difícil el control.',p:121},
{t:'veh',q:'¿Cuál es la profundidad mínima aconsejable de los surcos de los neumáticos?',o:['1 mm','3 mm','6 mm','No importa'],a:1,e:'Se aconseja un mínimo de 3 mm. Bajo 1,6 mm empeora mucho la fricción con pavimento mojado.',p:18},
{t:'veh',q:'Un choque a 50 km/h sin cinturón de seguridad equivale a…',o:['Caer desde un segundo piso','Tirarse a la calle desde un cuarto piso sin red','Un golpe sin consecuencias','Caer de una silla'],a:1,e:'El libro compara un choque a 50 km/h sin cinturón con tirarse desde un cuarto piso sin red de seguridad.',p:26,d:1},
{t:'veh',q:'Según los estudios citados en el libro, quienes no usan cinturón tienen…',o:['La misma probabilidad de fallecer','El doble de probabilidad de fallecer','La mitad de probabilidad de fallecer','Menos lesiones'],a:1,e:'Las personas que no usan cinturón tienen el doble de probabilidad de fallecer en un siniestro.',p:28,d:1},
{t:'veh',q:'¿Por qué no debes poner toallas o almohadones sobre el asiento o detrás de la espalda?',o:['Porque ensucian el tapiz','Porque favorecen el deslizamiento y anulan la protección contra el "efecto submarino"','Porque son ilegales','Porque calientan el asiento'],a:1,e:'Estos elementos favorecen que la persona se deslice por debajo de la banda abdominal (efecto submarino).',p:28,d:1},
{t:'veh',q:'¿A qué altura se debe regular el apoya cabezas?',o:['A la altura del cuello','A la altura de las orejas','Lo más bajo posible','Da lo mismo'],a:1,e:'La eficacia del airbag se combina con el cinturón, buena posición de manos y apoya cabezas al nivel de las orejas.',p:30},
{t:'veh',q:'Al cargar combustible debes…',o:['Mantener el motor encendido','Apagar el motor y no hablar por celular','Fumar solo fuera del auto','Abrir y cerrar la tapa varias veces'],a:1,e:'Para prevenir incendios: apagar el motor, no encender cigarrillos, no hablar por celular y evitar inhalar vapores.',p:13},
{t:'veh',q:'Adelante, un automóvil debe tener como mínimo:',o:['Un foco central','Dos focos de luces altas y bajas, dos luces de estacionamiento y dos luces destellantes de viraje','Solo luces de niebla','Dos focos y una bocina'],a:1,e:'Parte delantera: dos focos de luces altas y bajas, dos luces de estacionamiento y dos destellantes de viraje.',p:20},
{t:'per',q:'Conducir con 0,31 a 0,79 gramos por mil de alcohol en la sangre se considera…',o:['Permitido','Bajo la influencia del alcohol','Estado de ebriedad','Solo una advertencia'],a:1,e:'Entre 0,31 y 0,79 g/l es "bajo la influencia del alcohol": multas y suspensión de licencia.',p:50,d:1},
{t:'per',q:'¿Desde qué nivel de alcohol en la sangre se considera "estado de ebriedad"?',o:['0,1 gramos por mil','0,3 gramos por mil','0,8 o más gramos por mil','1,5 gramos por mil'],a:2,e:'0,8 o más g/l es estado de ebriedad: multas, cancelación de licencia y presidio.',p:50,d:1},
{t:'per',q:'¿En qué año se promulgó la "Ley Tolerancia Cero"?',o:['2006','2012','2014','2020'],a:1,e:'La Ley Tolerancia Cero (2012) redujo los niveles de alcohol permitidos y aumentó las sanciones.',p:50,d:1},
{t:'per',q:'¿Qué establece la Ley Emilia (2014)?',o:['Uso obligatorio de casco','Cárcel efectiva de al menos un año a quien, en estado de ebriedad, cause lesiones gravísimas o la muerte','Límite de 50 km/h en ciudad','Uso de SRI'],a:1,e:'La Ley Emilia sanciona con cárcel efectiva de al menos un año a conductores ebrios que causen lesiones gravísimas o muerte.',p:51,d:1},
{t:'per',q:'Con una alcoholemia entre 0,5 y 0,8 g/l, el riesgo de sufrir un siniestro es…',o:['Igual que sin beber','El doble','Cinco veces mayor','Diez veces menor'],a:2,e:'Entre 0,3 y 0,5 g/l el riesgo se duplica; entre 0,5 y 0,8 g/l es cinco veces mayor.',p:50,d:1},
{t:'per',q:'¿Qué tipo de visión disminuye con el alcohol aunque la persona no lo note?',o:['La visión de colores','La visión periférica','La visión de cerca','Ninguna'],a:1,e:'La visión directa puede parecer normal, pero la periférica disminuye y cuesta descubrir obstáculos a tiempo.',p:51,d:1},
{t:'per',q:'Si participas en un siniestro y te niegas sin justificación a la prueba de alcohol…',o:['No pasa nada','Se te sanciona con suspensión de licencia, multas y posibles penas de cárcel','Solo se anota en tu hoja de vida','Debes pagar una multa menor'],a:1,e:'Negarse injustificadamente a las pruebas trae suspensión de licencia, multas y penas que pueden ser efectivas.',p:51,d:1},
{t:'per',q:'En viajes largos, ¿cada cuánto se recomienda descansar?',o:['Cada 6 horas','Al menos 20 a 30 minutos cada 2 horas o 200 km como máximo','Solo al llegar','Cada 500 km'],a:1,e:'Descansa al menos 20 a 30 minutos cada 2 horas o 200 kilómetros de conducción, como máximo.',p:66},
{t:'per',q:'¿Qué efecto tiene el cansancio o sueño al conducir?',o:['Mejora la concentración','Aumenta el tiempo de reacción y las distracciones','Solo afecta de noche','No tiene efectos'],a:1,e:'Aumenta el tiempo de reacción y las distracciones, y altera el juicio. El sueño también aparece de día.',p:62},
{t:'vul',q:'Al pasar cerca de una persona ciclista, ¿qué espacio lateral mínimo exige la normativa?',o:['50 cm','1 metro','1,5 metros','3 metros'],a:2,e:'Debes dejar al menos 1,5 metros, porque la persona ciclista podría desviarse o tambalear.',p:71},
{t:'vul',q:'Como conductor de un vehículo motorizado, en una ciclovía…',o:['Puedes detenerte un momento','No puedes circular, detenerte ni estacionar','Puedes estacionar de noche','Puedes circular si no hay ciclistas'],a:1,e:'No puedes circular, detenerte ni estacionar en ciclovías; mira antes de abrir la puerta si estás cerca de una.',p:72},
{t:'vul',q:'Desde marzo de 2016, los menores de 12 años deben viajar…',o:['En cualquier asiento con cinturón','En el asiento trasero (salvo vehículos de cabina simple), con SRI adecuado o cinturón si ya les queda bien','Siempre adelante para vigilarlos','En brazos de un adulto'],a:1,e:'Se prohibió llevar a menores de 12 años adelante; van atrás, con SRI o cinturón bien posicionado.',p:73,d:1},
{t:'vul',q:'¿Hasta qué edad o medidas es obligatorio llevar a niñas y niños en Sistema de Retención Infantil (SRI)?',o:['Hasta los 4 años','Hasta 8 años inclusive, o estatura ≤135 cm y 33 kg','Hasta los 12 años sin excepción','Hasta 1 metro de altura'],a:1,e:'Desde marzo de 2017: hasta 8 años inclusive (un día antes de cumplir 9), o ≤135 cm y 33 kg.',p:73,d:1},
{t:'vul',q:'¿Cómo se recomienda instalar el SRI de los más pequeños?',o:['Mirando hacia adelante desde el nacimiento','A contramarcha (mirando hacia atrás) el mayor tiempo posible, mínimo hasta los dos años','En el asiento delantero','Sin anclaje'],a:1,e:'Se recomienda a contramarcha el mayor tiempo posible, hasta los límites del fabricante (mínimo hasta los 2 años).',p:75,d:1},
{t:'vul',q:'Si el SRI está bien instalado con ISOFIX, LATCH o cinturón…',o:['Hay que usar siempre dos sistemas','Cualquiera de los tres es seguro por sí mismo; no se usan dos a la vez salvo que lo indique el fabricante','Solo ISOFIX es seguro','Ninguno es seguro'],a:1,e:'Bien instalado, cualquiera de los tres es seguro por sí mismo.',p:75,d:1},
{t:'vul',q:'¿Cómo es la etiqueta de certificación de una silla infantil acreditada en Chile?',o:['Verde con letras blancas','Amarilla con letras negras','Roja','No lleva etiqueta'],a:1,e:'La etiqueta va pegada a la silla, es amarilla con letras negras y mide 9,5 × 7,5 cm.',p:75,d:1},
{t:'vul',q:'¿Entre qué edades comienzan niñas y niños a actuar con seguridad en el tránsito?',o:['2 y 4 años','5 y 7 años','9 y 12 años','15 y 18 años'],a:2,e:'Les cuesta juzgar distancia y velocidad; comienzan a actuar con seguridad entre los 9 y 12 años.',p:70},
{t:'vul',q:'Vas por la pista izquierda y en la derecha hay un vehículo detenido antes de un paso de cebra. ¿Qué haces?',o:['Lo adelanto rápido','Disminuyo la velocidad y me preparo para detenerme: puede haber peatones cruzando','Toco la bocina','Sigo igual'],a:1,e:'Podría haber peatones que comenzaron a cruzar y que tú no ves.',p:68},
{t:'cir',q:'¿Qué indica una luz roja intermitente?',o:['Detención total hasta luz verde','Ceda el paso','Prevención','Paso libre'],a:1,e:'Luz roja intermitente = ceda el paso: continúas si verificas que no viene nadie por la otra vía.',p:78},
{t:'cir',q:'¿Qué indica una luz amarilla intermitente?',o:['Detención','Advierte peligro: aproxímate a velocidad reducida y continúa con precaución','Que el semáforo está apagado','Paso exclusivo de buses'],a:1,e:'La amarilla intermitente advierte peligro; se avanza a velocidad reducida y con precaución.',p:78},
{t:'cir',q:'Tienes luz verde, pero pasado el cruce no hay espacio libre. ¿Qué haces?',o:['Avanzo igual','No avanzo si no tengo al menos 10 metros expeditos en mi pista','Avanzo hasta la mitad del cruce','Toco la bocina'],a:1,e:'Aun con verde, no avances si pasado el cruce no tienes al menos 10 metros expeditos.',p:78},
{t:'cir',q:'Con luz verde vas a virar y hay peatones y ciclistas cruzando. ¿Quién tiene preferencia?',o:['Yo, porque tengo verde','Los peatones y ciclistas que cruzan','El que llegue primero','Nadie'],a:1,e:'Peatones que enfrentan la verde tienen prioridad; si vas a virar debes cederles el paso, también a ciclistas.',p:78},
{t:'cir',q:'Si enfrentas luz roja y flecha verde…',o:['Puedes ir en cualquier dirección','Puedes entrar con cuidado solo en la dirección de la flecha, respetando a los peatones','Debes detenerte igual','Solo pueden pasar buses'],a:1,e:'Se entra cuidadosamente solo en la dirección indicada, respetando a peatones.',p:79},
{t:'cir',q:'En un cruce sin semáforo, sin Carabinero y sin señales PARE o Ceda el Paso, ¿a quién das preferencia?',o:['Al que viene por mi izquierda','A los vehículos que se aproximan por mi derecha','Al vehículo más grande','Al que toque la bocina'],a:1,e:'Siempre debes dar preferencia a los vehículos que se aproximan desde tu derecha.',p:84},
{t:'cir',q:'Cuando vas a virar…',o:['Tienes preferencia','Pierdes toda preferencia y respetas a vehículos y peatones','Solo cedes a buses','Puedes virar sin mirar'],a:1,e:'Al virar careces de toda preferencia.',p:84},
{t:'cir',q:'Al entrar a una rotonda…',o:['Tengo preferencia por entrar','Debo ceder el paso a los vehículos que ya circulan en ella','Debo tocar la bocina','Puedo entrar sin reducir velocidad'],a:1,e:'Al incorporarte a una rotonda o minirrotonda debes ceder el paso a quienes circulan por ella.',p:84},
{t:'cir',q:'Dentro de una rotonda, ¿cuándo debes señalizar a la derecha para salir?',o:['Al entrar','Tan pronto pases la salida inmediatamente anterior a la que usarás','Nunca','Al detenerte'],a:1,e:'Señaliza a la derecha apenas pases la salida inmediatamente anterior a la tuya.',p:94},
{t:'cir',q:'En zona rural, si llegas a una vía principal desde una secundaria…',o:['Tienes preferencia','Cedes el paso a los vehículos de la vía principal','Pasa el más rápido','Pasa el de la derecha siempre'],a:1,e:'En áreas rurales, quien viene por la secundaria cede el paso a la principal.',p:85},
{t:'cir',q:'¿Qué significa "ceder el paso"?',o:['Detenerse siempre 1 minuto','Que quien tiene preferencia no deba cambiar su trayectoria ni su velocidad por tu culpa','Tocar la bocina','Hacer señas con las luces'],a:1,e:'Quien tiene la preferencia no debe verse obligado a modificar su trayectoria ni su velocidad.',p:85},
{t:'cir',q:'Al salir de un estacionamiento o de una casa a la calle…',o:['Tienes preferencia','Cedes el paso a vehículos en tránsito (incluidos ciclistas) y peatones','Solo cedes a camiones','Pasas rápido'],a:1,e:'Al incorporarte desde una vía particular, inmueble o estacionamiento cedes a todos, incluidos ciclistas y peatones.',p:85},
{t:'cir',q:'Se acerca una ambulancia con luces y sirena. ¿Qué haces?',o:['Sigo igual','Le cedo el derecho a vía desplazándome hacia un lado y deteniéndome si es necesario','Acelero delante de ella','Freno en seco en mi pista'],a:1,e:'Ante vehículos de emergencia (policía, bomberos, ambulancias, PDI) usando señales debes cederles el paso.',p:85},
{t:'cir',q:'¿Con cuánta anticipación mínima debes señalizar un viraje?',o:['5 metros','Al menos 30 metros','100 metros','No es necesario'],a:1,e:'Señaliza con al menos 30 metros de anticipación cuando vayas a virar.',p:86},
{t:'cir',q:'¿Cuál es la secuencia correcta para cambiar de pista o maniobrar?',o:['Maniobra – espejo – señal','Espejo – señalización – maniobra','Señal – maniobra – espejo','Bocina – maniobra'],a:1,e:'Recuerda siempre: espejo – señalización – maniobra.',p:86},
{t:'cir',q:'Con el brazo extendido horizontalmente por la ventana estás indicando…',o:['Viraje a la derecha','Viraje a la izquierda','Que te detienes','Que te adelanten'],a:1,e:'Horizontal = izquierda; en ángulo recto hacia arriba = derecha; hacia abajo = disminución o detención.',p:86},
{t:'cir',q:'Brazo extendido hacia abajo indica…',o:['Viraje a la derecha','Disminución de velocidad o detención','Viraje en U','Adelantamiento'],a:1,e:'Brazo hacia abajo indica que disminuyes la velocidad o te detienes.',p:86},
{t:'cir',q:'¿Para qué sirve la "Regla de los Tres Segundos"?',o:['Para cruzar un semáforo en amarillo','Para saber si vas a una distancia adecuada del vehículo de adelante en carretera','Para estacionar','Para cambiar marchas'],a:1,e:'Fija un punto; cuando el de adelante lo pase, cuenta "mil uno, mil dos, mil tres". Si llegas antes, vas muy cerca.',p:88},
{t:'cir',q:'¿Dónde NO debes virar en "U"?',o:['En avenidas con bandejón donde está permitido','A menos de 200 m de una curva, cima, cruce ferroviario, puente, túnel o viaducto','En calles de doble tránsito sin línea continua','En ningún caso hay prohibición'],a:1,e:'Prohibido en intersecciones, pasos peatonales, a menos de 200 m de esos puntos y donde la señal lo prohíba.',p:94},
{t:'cir',q:'¿Cuál es la velocidad máxima en zonas urbanas?',o:['40 km/h','50 km/h','60 km/h','80 km/h'],a:1,e:'En zonas urbanas la velocidad máxima permitida es 50 km/h (salvo señal distinta).',p:96,d:1},
{t:'cir',q:'Zona no urbana, calzada con una sola pista por sentido: velocidad máxima para vehículos livianos.',o:['80 km/h','90 km/h','100 km/h','120 km/h'],a:2,e:'Con una pista por sentido: 100 km/h. Con 2 o más pistas en el mismo sentido: 120 km/h.',p:96,d:1},
{t:'cir',q:'Zona no urbana con 2 o más pistas en el mismo sentido: velocidad máxima para livianos.',o:['100 km/h','110 km/h','120 km/h','130 km/h'],a:2,e:'Cuando hay 2 o más pistas en un mismo sentido, el límite sube a 120 km/h.',p:96,d:1},
{t:'cir',q:'Buses, camiones y transporte escolar no deben circular a más de…',o:['80 km/h','90 km/h','100 km/h','120 km/h'],a:1,e:'Buses, camiones y transporte escolar: máximo 90 km/h; buses interurbanos: 100 km/h.',p:96,d:1},
{t:'cir',q:'¿Cuándo es obligatorio reducir la velocidad?',o:['Solo de noche','Al acercarse a una curva, a la cima de una cuesta, con visibilidad reducida y en zonas densamente pobladas','Nunca si vas bajo el límite','Solo en autopistas'],a:1,e:'El libro enumera situaciones de mayor riesgo donde debes reducir obligatoriamente la velocidad.',p:96,d:1},
{t:'cir',q:'Los adelantamientos deben hacerse siempre…',o:['Por la derecha','Por la izquierda','Por donde haya espacio','Por la berma'],a:1,e:'Los adelantamientos se efectúan siempre por la izquierda.',p:103},
{t:'cir',q:'No debes adelantar traspasando el eje de la calzada al aproximarte a un puente, túnel o cruce ferroviario desde…',o:['50 metros','100 metros','200 metros','1 kilómetro'],a:2,e:'Desde una distancia mínima de 200 metros.',p:103},
{t:'cir',q:'¿En qué caso puedes adelantar por la derecha?',o:['Nunca','Cuando el vehículo de adelante vira o está por virar a la izquierda, o en vía urbana con 3 o más pistas en el mismo sentido','Cuando tienes prisa','Por la berma en carretera'],a:1,e:'Son las dos únicas excepciones que señala el libro.',p:103},
{t:'cir',q:'Cuando otro vehículo te está adelantando, debes…',o:['Acelerar','Mantenerte lo más a la derecha posible y no aumentar tu velocidad','Frenar en seco','Moverte a la izquierda'],a:1,e:'Facilita el adelantamiento: derecha y sin acelerar; en peligro, reduce velocidad.',p:102},
{t:'cir',q:'Tras adelantar, ¿cuándo vuelves a la pista derecha?',o:['De inmediato','Cuando veas en tu espejo retrovisor interior al vehículo adelantado y parte de la calzada delante de él','Cuando te toque la bocina','Después de 1 km'],a:1,e:'Vuelve cuando lo veas en el espejo interior; mantén el señalizador hasta terminar.',p:102},
{t:'cir',q:'Un vehículo viene de frente invadiendo tu pista. ¿Qué haces?',o:['Me paso a la izquierda','Freno enérgicamente, hago señales con luces y bocina y trato de moverme a la derecha','Acelero','Me detengo en el centro'],a:1,e:'Nunca te pases a la izquierda: el otro conductor podría corregir y volver a su lado.',p:99},
{t:'est',q:'Si estacionas en paralelo a la cuneta, ¿a qué distancia máxima de ella debes quedar?',o:['10 cm','30 cm','1 metro','2 metros'],a:1,e:'A no más de 30 cm de la cuneta y dejando al menos 60 cm respecto de otros vehículos.',p:104},
{t:'est',q:'¿Qué distancia mínima debes dejar respecto de otros vehículos estacionados?',o:['10 cm','30 cm','60 cm','2 metros'],a:2,e:'Distancia mínima de 60 centímetros.',p:104},
{t:'est',q:'Estacionas en una pendiente en subida. ¿Cómo dejas las ruedas?',o:['Rectas','Orientadas hacia el interior de la calzada','Orientadas hacia la cuneta','Da lo mismo'],a:1,e:'En subida, hacia el interior de la calzada; en bajada, hacia la cuneta. Además freno de mano y vehículo enganchado.',p:104},
{t:'est',q:'¿A qué distancia mínima de un grifo no debes estacionar?',o:['1 metro','3 metros','5 metros','10 metros'],a:2,e:'No estaciones a menos de 5 metros de un grifo.',p:105},
{t:'est',q:'¿A qué distancia de una señal PARE o Ceda el Paso no debes estacionar?',o:['A menos de 3 m','A menos de 5 m','A menos de 10 m','A menos de 50 m'],a:2,e:'A menos de 10 metros de PARE, Ceda el Paso o señales de advertencia de peligro; también de cuarteles de bomberos, postas y hospitales.',p:105},
{t:'est',q:'Frente a puertas de iglesias, colegios, hoteles y salas de espectáculos, en horas de afluencia, no estaciones a menos de…',o:['1 metro','3 metros','10 metros','20 metros'],a:1,e:'A menos de 3 metros de sus puertas durante las horas de afluencia de público.',p:105},
{t:'est',q:'Una línea amarilla continua pintada a lo largo de la solera indica…',o:['Estacionamiento para motos','Que no debes estacionar','Paradero de buses','Zona de carga libre'],a:1,e:'Donde exista línea amarilla continua a lo largo de la solera no debes estacionar.',p:105},

{t:'cir',q:'En carretera, ¿qué regla te ayuda a saber si vas a una distancia adecuada del vehículo de adelante?',o:['La regla de los tres segundos','La regla de los diez metros','Ir siempre a 50 km/h','Mirar solo el espejo retrovisor'],a:0,e:'Fija un punto (por ejemplo, un árbol). Cuando el vehículo de adelante lo pase, cuenta mil uno, mil dos, mil tres. Si llegas al punto antes de terminar, vas demasiado cerca.',p:88},

const MODULOS=[
 {id:'sin',desc:'Por qué ocurren los siniestros de tránsito y cómo la velocidad cambia todo: reacción, frenado y energía del choque.',obj:'Comprender que los siniestros son evitables y calcular cómo la velocidad aumenta el tiempo de reacción, la distancia de frenado y la gravedad de un impacto.',tem:['Siniestro, no accidente', 'Falla humana', 'Velocidad y peatones', 'Tiempo de reacción', 'Distancia de frenado'],pg:5,ic:'⚠️',tit:'1. Siniestros y física de la conducción',p:'pp. 6–25',pts:['Se dice "siniestro", no "accidente": son evitables.','Falla humana presente en más del 90% de los siniestros.','30→50 km/h: la probabilidad de muerte del peatón se multiplica por 8. A 30 km/h sobrevive el 90%; a 45 km/h o más, menos del 50%.','Tiempo normal de reacción: 1 segundo (36 km/h = 10 m; 72 km/h = 20 m).','Distancia de frenado: al duplicar la velocidad, se multiplica por 4; al triplicarla, por 9.','Detención en seco: ~25 m a 50 km/h; ~80 m a 100 km/h.']},
 {id:'veh',desc:'Cómo revisar tu auto y usar bien sus elementos de seguridad: neumáticos, cinturón, asientos, luces y carga de combustible.',obj:'Reconocer los elementos de seguridad del vehículo y usarlos correctamente para protegerte a ti y a tus pasajeros.',tem:['Neumáticos', 'Cinturón de seguridad', 'Asientos y apoya cabezas', 'Combustible', 'Luces'],pg:10,ic:'🐱',tit:'2. El vehículo y elementos de seguridad',p:'pp. 11–32',pts:['Neumáticos: surcos de al menos 3 mm aconsejables; bajo 1,6 mm empeora mucho el agarre en mojado.','Choque a 50 km/h sin cinturón = caer desde un 4.º piso. Sin cinturón se duplica la probabilidad de morir.','Nada de toallas ni cojines en el asiento (efecto submarino).','Apoya cabezas a la altura de las orejas.','Al cargar combustible: motor apagado, sin cigarro, sin celular.','Luces delanteras: altas/bajas, 2 de estacionamiento, 2 destellantes de viraje.']},
 {id:'per',desc:'Cómo el alcohol, las drogas, el cansancio y el sueño afectan a quien conduce, y qué dice la ley.',obj:'Identificar los límites de alcohol de la Ley de Tránsito, sus sanciones (Tolerancia Cero y Ley Emilia) y cómo prevenir la fatiga al volante.',tem:['Alcohol: límites y sanciones', 'Ley Tolerancia Cero y Ley Emilia', 'Efectos en la visión y el riesgo', 'Fatiga y descansos'],pg:36,ic:'🧠',tit:'3. La persona: alcohol, drogas, sueño',p:'pp. 37–66',pts:['0,31–0,79 g/l = bajo la influencia → multas y suspensión.','0,8 g/l o más = estado de ebriedad → multas, cancelación y cárcel.','Ley Tolerancia Cero (2012); Ley Emilia (2014): cárcel efectiva mínima 1 año si ebrio causas lesiones gravísimas o muerte.','0,3–0,5 g/l: riesgo ×2; 0,5–0,8 g/l: riesgo ×5. El alcohol reduce la visión periférica.','Negarse sin justificación al test tras un siniestro también se sanciona.','Viajes largos: descanso de 20–30 min cada 2 horas o 200 km.']},
 {id:'vul',desc:'Peatones, ciclistas y niños: quienes tienen más riesgo en la vía y cómo protegerlos.',obj:'Aplicar las reglas de convivencia con usuarios vulnerables y transportar correctamente a niñas y niños con su sistema de retención infantil (SRI).',tem:['Ciclistas y ciclovías', 'Niños en el asiento trasero', 'Sillas para niños (SRI)', 'Certificación del SRI'],pg:67,ic:'🧒',tit:'4. Usuarios vulnerables y niños',p:'pp. 68–76',pts:['Ciclistas: al menos 1,5 m de distancia lateral. Prohibido circular, detenerse o estacionar en ciclovías.','Menores de 12 años: asiento trasero (salvo cabina simple).','SRI obligatorio hasta 8 años inclusive o ≤135 cm y 33 kg.','SRI a contramarcha el mayor tiempo posible (mínimo hasta los 2 años).','Etiqueta de certificación: amarilla con letras negras.','Niños actúan con seguridad en el tránsito recién entre los 9 y 12 años.']},
 {id:'cir',desc:'Las reglas para moverte por la vía: semáforos, preferencias, rotondas, velocidades y adelantamientos.',obj:'Aplicar las normas de circulación de la Ley de Tránsito para decidir quién pasa primero, a qué velocidad ir y cuándo adelantar o virar.',tem:['Semáforos', 'Derecho preferente de paso', 'Rotondas', 'Señalizar y virar', 'Velocidades máximas', 'Adelantar y virar en U'],pg:76,ic:'🚦',tit:'5. Normas de circulación',p:'pp. 77–103',pts:['Roja intermitente = ceda el paso. Amarilla intermitente = peligro, velocidad reducida.','Con verde no avances si no hay 10 m libres después del cruce. Al virar, cede a peatones y ciclistas.','Cruce sin señales: preferencia al que viene por tu derecha. Al virar pierdes la preferencia.','Rotonda: cedes a quienes ya circulan; señalizas a la derecha tras la salida anterior a la tuya.','Señaliza al menos 30 m antes de virar. Espejo – señal – maniobra.','Velocidades: urbana 50; rural 1 pista/sentido 100; 2+ pistas 120; buses/camiones/escolares 90.','Adelanta siempre por la izquierda; no a menos de 200 m de puente, túnel o cruce ferroviario. Sin U a menos de 200 m de curva, cima, puente o túnel.']},
 {id:'est',desc:'Dónde y cómo estacionar o detenerte sin poner en riesgo a nadie.',obj:'Estacionar respetando las distancias y prohibiciones que establece la Ley de Tránsito.',tem:['Estacionar en paralelo', 'Pendientes', 'Distancias prohibidas', 'Líneas amarillas'],pg:104,ic:'🅿️',tit:'6. Estacionamiento y detención',p:'pp. 104–105',pts:['Paralelo a no más de 30 cm de la cuneta; 60 cm de otros vehículos.','Subida: ruedas hacia la calzada. Bajada: hacia la cuneta.','Grifo: 5 m. PARE / Ceda el Paso / advertencias / bomberos / hospitales: 10 m. Puertas de colegios, iglesias, hoteles: 3 m (horas de afluencia).','Línea amarilla continua en la solera: no estacionar.','En semáforo, distancia correcta = ves los neumáticos traseros del de adelante.']},
 {id:'esp',desc:'Lluvia, autopistas, fallas del vehículo y autos eléctricos: qué hacer cuando las condiciones cambian.',obj:'Adaptar la conducción a circunstancias especiales y actuar con seguridad ante una falla o emergencia.',tem:['Lluvia y aquaplaning', 'Autopistas', 'Fallas y emergencias', 'Electromovilidad'],pg:108,ic:'🌧️',tit:'7. Circunstancias especiales y electromovilidad',p:'pp. 108–150',pts:['Aquaplaning: capa de agua entre neumático y calzada; reduce la velocidad.','Autopista: detenerse solo por emergencia o si lo pide Carabineros.','Falla en autopista: berma, luces de advertencia, salir por la derecha, chaleco reflectante. No poner triángulo en la calzada de la autopista.','Vehículo eléctrico: siempre portar el cable de viaje y planificar la carga.']},
 {id:'lic',desc:'Cómo es el examen teórico y el proceso para obtener la licencia Clase B.',obj:'Conocer el formato del examen teórico y las reglas del proceso para llegar preparada el día de la prueba.',tem:['Formato del examen', 'Preguntas de doble puntaje', 'Tiempo máximo', 'Oportunidades'],pg:167,ic:'📝',tit:'8. El examen y el proceso',p:'p. 169 + CONASET/MTT',pts:['Examen teórico Clase B (Nexteo): 35 preguntas, 38 puntos; se aprueba con 33. Tres preguntas valen doble.','Las preguntas de doble puntaje se vinculan a alcohol, velocidad, cinturón y sistemas de retención infantil.','Tiempo máximo: 45 minutos.','Dos oportunidades por examen; repetición dentro de 25 días hábiles.']}

const GLOS=[["Acera", "Parte de una vía destinada al uso de peatones."], ["Adelantamiento", "Maniobra efectuada por el costado izquierdo del eje de la calzada, mediante la cual un vehículo se sitúa adelante de otro u otros que le antecedían."], ["Aquaplaning", "Pérdida de adherencia por una capa de agua entre neumático y calzada."], ["Avenida o calle", "Vía urbana destinada a la circulación de las y los peatones, de los vehículos y de los animales."], ["Bajo la influencia del alcohol", "0,31 a 0,79 gramos por mil de alcohol en la sangre."], ["Berma", "Faja lateral, pavimentada o no, adyacente a la calzada de un camino."], ["Calzada", "Parte de una vía destinada al uso de vehículos y animales."], ["Camino", "Vía rural destinada al uso de peatones, vehículos y animales."], ["Ceder el paso", "Que quien tiene preferencia no cambie su trayectoria ni su velocidad por tu maniobra."], ["Chaleco de alta visibilidad", "Chaleco amarillo con bandas retrorreflectantes de al menos 50 mm, obligatorio al bajar del vehículo en la vía por una emergencia."], ["Ciclo", "Vehículo no motorizado de una o más ruedas, propulsado por una o más personas situadas en él, tales como bicicletas, triciclos, entre otros. También se consideran ciclos aquellos vehículos de una o más ruedas que cuenten con un motor auxiliar eléctrico, de una potencia nominal continua máxima de 250 watts, en los que la alimentación es reducida o interrumpida cuando el vehículo alcanza una velocidad máxima de 25 km/h o antes si la persona ciclista termina de pedalear o propulsarlo, los que se considerarán para los efectos de la ley como vehículos no motorizados."], ["Ciclovía", "Espacio destinado al uso exclusivo de ciclos, que puede estar segregado física o visualmente."], ["Conductora/conductor", "Toda persona que conduce, maneja o tiene control físico de un vehículo motorizado en la vía pública; que controla o maneja un vehículo remolcado por otro; o que dirige, maniobra o está a cargo del manejo directo de cualquier otro vehículo, de un animal de silla, de tiro o de arreo de animales."], ["Contramarcha", "Posición del SRI mirando hacia atrás; se recomienda el mayor tiempo posible, como mínimo hasta los 2 años."], ["Cruce", "La unión de una calle o camino con otros, aunque no los atraviese. Comprende todo el ancho de la calle o camino entre las líneas de edificación o deslindes en su caso."], ["Cruce de ferrocarriles", "Intersección de una calle o camino con una vía férrea por la cual existe tráfico regular de trenes."], ["Cruce regulado", "Cruce en que existe un semáforo funcionando normalmente, excluyendo la intermitencia, o donde está Carabineros dirigiendo el tránsito."], ["Cuneta", "En calles, el ángulo formado por la calzada y el plano vertical producido por diferencia de nivel entre calzada y acera. En los caminos, el foso lateral de poca profundidad."], ["Demarcación", "Símbolo, palabra o marca, de preferencia longitudinal o transversal, sobre la calzada, para guía del tránsito de vehículos y peatones."], ["Derecho preferente de paso", "Prerrogativa de un peatón o persona conductora de un vehículo para proseguir su marcha."], ["Detención", "Paralización a que obligan los dispositivos de señalización del tránsito o las órdenes de las o los funcionarios encargados de su regulación, como asimismo, la paralización breve de un vehículo para recibir o dejar pasajeros, pero sólo mientras dure esta maniobra."], ["Dirección de Tránsito", "Departamento de la municipalidad que toma los exámenes y otorga las licencias de conducir."], ["Distancia de frenado", "Metros desde que pisas el freno hasta detenerte; crece con el cuadrado de la velocidad."], ["Distancia de reacción", "Metros recorridos mientras reaccionas (≈1 segundo)."], ["Efecto submarino", "Deslizamiento del cuerpo por debajo de la banda abdominal del cinturón en un choque."], ["Eje de calzada", "La línea longitudinal a la calzada, demarcada o imaginaria, que determinará las áreas con sentido de tránsito opuesto de la misma; al ser imaginaria, la división es en dos partes iguales."], ["Espejo – señal – maniobra", "Orden correcto antes de cualquier maniobra: mirar los espejos, señalizar y recién entonces maniobrar."], ["Esquina", "Vértice del ángulo que forman las líneas de edificación o deslinde convergentes, según sea el caso."], ["Estacionar", "Paralizar un vehículo en la vía pública con o sin la persona conductora, por un período mayor que el necesario para dejar o recibir pasajeros."], ["Estado de ebriedad", "0,8 o más gramos por mil de alcohol en la sangre."], ["Examen teórico", "Prueba de 35 preguntas (38 puntos) basada en el Libro para la Conducción en Chile; se aprueba con 33 en un máximo de 45 minutos."], ["Hoja de vida del conductor", "Certificado del Registro Civil con las infracciones graves o gravísimas que tiene una persona como conductora."], ["Idoneidad moral", "Requisito para obtener la licencia: se revisan tus antecedentes antes de otorgarla."], ["Intersección", "Área común de calzadas que se cruzan o convergen."], ["ISOFIX / LATCH", "Sistemas de anclaje del SRI al vehículo."], ["Ley de Tránsito", "Ley N° 18.290, que regula la circulación, las licencias, las infracciones y las sanciones. Su texto vigente está en el DFL N° 1 de 2007."], ["Ley Emilia", "Ley N° 20.770 (2014): cárcel efectiva por conducir en estado de ebriedad causando lesiones gravísimas o la muerte."], ["Ley Jacinta", "Ley N° 21.797 (2026): agrega una declaración jurada de salud al obtener o renovar la licencia."], ["Ley Tolerancia Cero", "Ley N° 20.580 (2012): aumenta las sanciones por conducir con alcohol o drogas."], ["Licencia Clase B", "Licencia no profesional para conducir vehículos motorizados de tres o más ruedas de uso particular: hasta 9 asientos sin contar a quien conduce o carga de hasta 3.500 kg."], ["Línea de detención adelantada", "Línea transversal a la calzada demarcada conforme al reglamento, antes de un cruce regulado con semáforo, que determina el inicio de la zona de espera especial para personas conductoras de ciclos o motocicletas."], ["Línea de detención de vehículos", "Línea transversal a la calzada, demarcada o imaginaria, antes de una intersección o un paso para peatones, que no debe ser sobrepasada por los vehículos que deban detenerse. Si no estuviera demarcada, se entiende que está: En cruces regulados y pasos para peatones, a no menos de un metro antes de estos. En otros cruces, justo antes de la intersección."], ["Luz alta", "Luz proyectada por los focos delanteros del vehículo en forma paralela a la calzada, cuya potencia permite visualizar obstáculos a una distancia no inferior a 150 metros."], ["Luz baja", "Luz proyectada por los focos delanteros del vehículo en que el borde superior del haz luminoso es paralelo a la calzada y cuya potencia permite visualizar obstáculos a una distancia no inferior a 50 metros."], ["Luz de estacionamiento", "Luz continua o intermitente que permite identificar un vehículo estacionado."], ["Nexteo", "Plataforma digital del examen teórico en las Direcciones de Tránsito."], ["Padrón o permiso de circulación", "Documento otorgado por la autoridad, destinado a individualizar al vehículo y a su dueño o dueña con el objeto de que pueda circular por las vías públicas."], ["Paso para peatones", "Senda de seguridad en la calzada, señalizada conforme al reglamento. En cruces regulados no demarcados, corresponderá a la franja formada por la prolongación imaginaria de las aceras."], ["Pista de circulación", "Faja demarcada o imaginaria destinada al tránsito de una fila de vehículos."], ["Pista de uso exclusivo", "Espacio de la calzada debidamente señalizado, destinado únicamente al uso de ciertos vehículos, determinados por la autoridad correspondiente."], ["Placa patente", "Distintivo que permite individualizar al vehículo."], ["Platabanda", "Espacio de la acera, reservado principalmente a la contención de áreas verdes y arbolado urbano, así como también a la instalación de equipamiento, redes de servicios eléctricos y de telecomunicaciones, iluminación, señales de tránsito, mobiliario urbano, estacionamiento de ciclos, quioscos y, en general, a toda función permitida en la acera y autorizada por la autoridad respectiva, complementaria al uso y tránsito de peatones."], ["Pregunta de doble puntaje", "Pregunta del examen teórico que vale 2 puntos; se vinculan a alcohol, velocidad, cinturón y sistemas de retención infantil."], ["Regla de los tres segundos", "Forma de medir la distancia con el vehículo de adelante en carretera: cuenta mil uno, mil dos, mil tres desde que pasa un punto fijo; si llegas antes, vas muy cerca."], ["Rotonda", "Intersección circular: cedes el paso a quienes ya circulan por ella y señalizas a la derecha después de la salida anterior a la tuya."], ["Semáforo", "Dispositivo luminoso mediante el cual se regula la circulación de vehículos y peatones."], ["Señal de tránsito", "Dispositivos, signos y demarcaciones oficiales, de mensaje permanente o variable, instalados por la autoridad con el objetivo de regular, advertir o encauzar el tránsito."], ["Siniestro de tránsito", "Término que reemplaza a \"accidente\": los siniestros son evitables."], ["Sobrepasar", "Maniobra mediante la cual un vehículo pasa a otro u otros que circulan en el mismo sentido sin traspasar el eje de la calzada."], ["Sobrepaso", "Ponerse delante de otro vehículo sin invadir la pista contraria (no es adelantamiento legal)."], ["SRI", "Sistema de Retención Infantil: silla o alzador certificado según peso, talla y desarrollo."], ["Triciclo motorizado de carga", "Vehículo motorizado de tres ruedas destinado exclusivamente al transporte de carga. La capacidad de carga de estos vehículos no podrá superar los 300 kilogramos de peso."], ["Vehículo de emergencia", "El perteneciente a Carabineros de Chile e Investigaciones, al Cuerpo de Bomberos y las ambulancias de las instituciones fiscales o de los establecimientos particulares que tengan el respectivo permiso otorgado por la autoridad competente."], ["Vehículo de locomoción colectiva", "Vehículo motorizado, destinado al uso público, para el transporte remunerado de personas, exceptuados los taxis que no efectúen servicio colectivo."], ["Vehículo para el transporte escolar", "Vehículo motorizado construido para transportar más de siete personas sentadas y destinado al transporte de escolares desde o hacia el colegio o relacionado con cualquiera otra actividad."], ["Vía", "Calle, camino u otro lugar destinado al tránsito."], ["Vía exclusiva", "Calzada debidamente señalizada, destinada únicamente al uso de ciertos vehículos, determinados por la autoridad correspondiente."], ["Zona de espera especial", "Área señalizada conforme al reglamento, que permite a las personas conductoras de ciclos o motocicletas detenerse y reiniciar su marcha adelante de otros vehículos motorizados, en un cruce regulado con semáforo."], ["Zona de Tránsito Calmado", "Vía o conjunto de vías emplazadas en zonas urbanas, definidas dentro de una determinada área geográfica, en las que a través de condiciones físicas u operacionales de las vías se establecen velocidades máximas de circulación inferiores a las establecidas en la ley, pudiendo estas ser de 40 km/h, 30 km/h o 20 km/h."], ["Zona rural", "Área geográfica que excluye las zonas urbanas."], ["Zona urbana", "Área geográfica cuyos límites, para los efectos de esta ley, deben estar determinados y señalizados por las Municipalidades."]];

const PTXT={"5": "Los siniestros de tránsito CAPÍTULO 1", "6": "Antes de comenzar, debemos saber que es un error llamar a los accidentes de tránsito “accidentes”. Se define accidente como: “suceso eventual del que involuntariamente resulta un daño” y se le asocia a un fenómeno casual e impredecible. Es por esta razón que hemos cambiado el concepto por siniestros , para relevar la importancia de sus efectos negativos y la responsabilidad de cada persona usuaria de las vías. Los siniestros de tránsito tienen poco de azarosos o de impredecibles. Se han estudiado las conductas y condiciones en que la persona conductora tiene más probabilidades de provocar un siniestro, por lo tanto, se puede trabajar en disminuir sus consecuencias perjudiciales. Si los siniestros de tránsito fueran “accidentales”, ¿cómo podríamos explicar por qué aumentan cuando llueve?, ¿por qué hay tantas personas fallecidas por siniestros de tránsito durante las noches, cuando es el período con menor flujo de vehículos? o ¿por qué las personas que han bebido alcohol tienen más siniestros? Si un siniestro de tránsito fuera un suceso eventual, la probabilidad de sufrir un siniestro dependería sólo de la cantidad de tiempo que pasemos al volante, pero no es así. La conducción de un vehículo implica responsabilidad colectiva , pensemos ¿es acaso una “decisión personal” el hecho de que una persona conduzca en estado de ebriedad o no use su cinturón de seguridad? No, pues si esta persona conductora sufre un siniestro nos afecta a todas y todos, ya que pagamos directa o indirectamente su decisión. ¿Sabías que más de 3.000 personas fallecen cada día en el mundo como consecuencia de los siniestros de tránsito? Éstos son la primera causa de muerte en los jóvenes. Por lo anterior, organizaciones internacionales, como la Organización Mundial de la Salud (OMS), califican la situación de las personas involucradas en siniestros de tránsito como un problema prioritario de salud pública en todo el mundo. En Chile, al igual que en el resto del mundo, los siniestros de tránsito constituyen una de las principales causas de mortalidad . En la población infantil, entre 1 a 14 años, representa la primera causa de muerte y en la población joven, entre 15 y 29 años, la segunda causa de muerte después de los suicidios. En general, no existe consciencia sobre la magnitud del problema de los siniestros de tránsito en el mundo. Tampoco es posible cuantificar la cantidad de personas que, como resultado de un siniestro de tránsito, queda discapacitada de por vida y, sin embargo, aparecen en las cifras sólo como “lesionados”. Los siniestros de tránsito La mayoría de las muertes producidas por los siniestros de tránsito podría haberse evitado. Para reducir la posibilidad de sufrir un siniestro de tránsito, debes evitar los factores de riesgo, detallados a lo largo de este libro.", "7": "Por otro lado, no se valora el sufrimiento que provoca una persona fallecida en su entorno cercano. Pero sí existen estudios que indican que, en promedio, por cada persona fallecida, unas 100 cercanas a ellas sufren dolor (familiares, amigos, etc.). Además de las pérdidas de vidas humanas, los siniestros de tránsito producen un enorme impacto económico que, directa o indirectamente asumimos todas y todos los ciudadanos. Se estima que en Chile los costos de los siniestros de tránsito alcanzan el 2% del PIB según las cifras de la OMS. Si este dinero fuera invertido en educación, vivienda, salud y/o ayudas sociales, imagina el beneficio que representaría para nuestra sociedad. Si sacas la cuenta, cada persona paga una media de poco más de 6 millones de pesos anuales, sólo considerando los costos por los siniestros de tránsito posibles de valorizar. En el siguiente cuadro se enumeran los principales costos ocasionados por los siniestros. Hay que tener en cuenta que no todos ellos pueden ser valorizados monetariamente. Costos materiales Costos humanos Costos administrativos Costos de salud Daños a los vehículos y a su carga. Daños a la propiedad pública. Daños a la propiedad privada. Daños al medio ambiente. Pérdida de productividad (durante tratamiento y rehabilitación). Pérdida de productividad futura de personas fallecidas. Sufrimiento físico y psicológico de la persona lesionada. Sufrimiento físico y psicológico de familiares y amigos. Policía y bomberos. Gestión de seguros. Legales: Jueces, abogados, etc. Primeros auxilios, traslado en ambulancia. Tratamiento médico de heridos. Rehabilitación. costos de los siniestros de tránsito 1 (1) Fuente: Seguridad Vial para Nuevos Conductores (INTRAS, DGT, España).", "8": "Estadísticas de siniestros en Chile 2 Anualmente en Chile se registran más de 82.000 siniestros. Como consecuencia de éstos fallecen aproximadamente 1.600 personas, lo que significa que diariamente mueren entre 4 y 5 personas en las vías públicas . En promedio 450 de ellas son atropelladas. La mayor parte de las personas fallecidas por siniestros de tránsito se produce en vías interurbanas o no urbanas. Si bien la mayor cantidad de personas fallecidas en siniestros se registra en carreteras y autopistas fuera de áreas urbanas, la mayor cantidad de siniestros, aproximadamente un 80%, se produce en vías o áreas urbanas; de éstos, la mayoría se registra en los cruces de calles o intersecciones. Sólo un 20% de los siniestros se produce en zonas no urbanas (rural). También en vías urbanas se produce la mayor cantidad de lesionados , sobre 35.000 en promedio al año, sin embargo éstos en su mayoría son de menor gravedad que los lesionados en carreteras. (2) Estas cifras pertenencen al promedio de los últimos 5 años, hasta el año 2022. Están basadas en las estadísticas de Carabineros de Chile, quienes contabilizan los fallecidos sólo dentro de las 48 horas de producido el siniestro. Como promedio de los últimos 5 años, aproximadamente 7.700 personas resultaron lesionadas graves en los más de 82.000 siniestros de tránsito. Personas fallecidas Cantidad de siniestros siniestros en relación a la velocidad del vehículo La probabilidad de que un peatón muera atropellado se multiplica por ocho cuando la velocidad del vehículo sube de 30 a 50 km/h. Peatones tienen 90% de posibilidades de sobrevivir a impactos a 30 km/h o menos . Peatones tienen menos del 50% de probabilidades de sobrevivir a un choque a 45 km/h o más. A una velocidad de 65 km/h lo más probable es que un peatón atropellado muera . Existen condicciones que cuentan con mayor siniestralidad, como los fines de semana (normales o largos), durante la noche y la madrugada o situaciones de escaso flujo vehicular. Además, las estadísticas indican que la falla humana está presente en más del 90% de los siniestros de tránsito , involucrando mayormente a jóvenes, entre 18 y 29 años. Éstos representan aproximadamente el 29% del total de las personas conductoras fallecidas en siniestros de tránsito en los últimos años. Finalmente, se debe agregar que cerca del 79% de las personas conductoras fallecidas en siniestros de tránsito son varones. La imprudencia de quien conduce, el consumo de alcohol al conducir y la desobediencia a las señales del tránsito son unos de los factores de mayor incidencia en la ocurrencia de siniestros. 63% 37% 20% 80%", "9": "Sistema Seguro Desde la primera Política Nacional de Seguridad de Tránsito de 1993 se ha trabajado con fuerza en la disminución de la alta tasa de siniestros viales en Chile. Lo que ha significado numerosos cambios a la normativa relacionados con el tránsito en nuestro país. Debido a los nuevos desafíos que se presentan en materia de movilidad, como el aumento de ciclistas, el crecimiento del parque vehicular y de motocicletas, se ha vuelto de vital importancia trabajar en nuevos enfoques en Seguridad Vial y así evitar la pérdida de vidas y reducir las personas lesionadas graves en siniestros de tránsito. Es por esto que desde el año 2017, la nueva Política Nacional de Seguridad de Tránsito se encuentra alineada con el enfoque de Sistema Seguro, el cual ha sido promovido por países líderes en seguridad de tránsito y establece como principio ético que las muertes y lesiones graves en el tránsito son inaceptables . Por lo tanto, el sistema de tránsito debe diseñarse y utilizarse de manera tal que nadie pierda la vida o resulte gravemente herido como consecuencia de un siniestro vial. Dicho enfoque es conocido mundialmente como la Visión Cero . Esto supone un cambio de paradigma en que los seres humanos cometen errores y que la mayoría de estos siniestros se producen por una equivocación. Así que, en vez de corregir los errores humanos, el enfoque se ocupa de abordar el riesgo inherente a la circulación. En función de lo anterior, se trabaja en medidas orientadas al diseño de un sistema completo que apoye y guíe el comportamiento humano. El enfoque Sistema Seguro se gestiona de manera tal que los componentes de dicho sistema se combinen e interactúen para guiar a los usuarios a actuar de manera segura y prevenir los siniestros de tránsito; y si estos ocurren, garantizar que las fuerzas del impacto no excedan los límites que el cuerpo humano puede resistir antes que se ocasionen lesiones graves o la muerte. Los seres humanos cometemos errores, los que pueden derivar en un siniestro de tránsito. “Errar es humano”. Existe una responsabilidad compartida entre quienes diseñan, construyen, administran y usan las vías y los vehículos, junto con quienes brindan atención luego de ocurrido el siniestro de tránsito, para evitar que este tenga resultado de muerte o lesiones graves. Todos los componentes del sistema deben estar fortalecidos y si uno falla, las otras partes continúan protegiendo a las personas involucradas. El cuerpo humano por naturaleza tiene una capacidad limitada para soportar las fuerzas de un impacto antes de que el daño ocurra. principios fundamentales y no transables del sistema seguro 1 2 3 4", "10": "CAPÍTULO 2 Los principios de la conducción", "11": "A continuación, conozcamos los sistemas que lo componen: El motor El motor es la parte del vehículo que permite el funcionamiento de todos sus sistemas. Generalmente se sitúa en la parte delantera y para funcionar puede utilizar gasolina, petróleo diesel, gas y/o electricidad. Dentro del vehículo, en el panel de instrumentos, existe un elemento llamado tacómetro, el cual muestra la cantidad de revoluciones del motor en todo momento (ver imagen superior). Los principios de la conducción Tacómetro: Velocidad del motor en revoluciones por minuto. Velocímetro: Mide y muestra el valor de la rapidez instantánea del vehículo. Indicador de combustible Testigos color verde: Indican la puesta en funcionamiento. Testigos color rojo: Informan atención inmediata, avería grave. Testigos color amarillo o ámbar: Advierten sobre un posible problema a revisar. Indicador de temperatura del líquido refrigerante Odómetro: Indica la distancia total o parcial recorrida por el vehículo. Funcionamiento del automóvil Para poder conducir de manera segura debes mantener tu automóvil en buenas condiciones, para esto, es necesario que conozcas cómo está construido y el funcionamiento de sus partes principales. Para comenzar, debes conocer el panel de instrumentos , ya que es el medio de comunicación que fue diseñado para alertarte sobre el estado de los principales sistemas del vehículo:", "12": "El sistema de lubricación Se trata del sistema encargado de distribuir aceite a todas las partes móviles dentro del motor con el objetivo de reducir el desgaste y la fricción entre las superficies de los componentes. Esta distribución se realiza a presión y cuando este procedimiento falla, es decir, cuando el motor no está siendo correctamente lubricado, se enciende en el panel de instrumentos la luz indicadora de la presión de aceite , lo que indica que el nivel de aceite es bajo. Si esta se enciende, debes detener el motor de inmediato y no ponerlo en marcha hasta haberlo reparado, ya que le puedes causar averías graves. Te recomendamos controlar el nivel de aceite y agregar más si el nivel está bajo. Además, cambiar periódicamente el aceite y el filtro, según las recomendaciones del fabricante del vehículo. Utiliza aceites reconocidos y no olvides controlar el sellos de los envases. El sistema eléctrico Es aquel que se encarga de proporcionar la energía eléctrica a los demás sistemas del vehículo. Esta energía es producida por el alternador y almacenada en la batería . El alternador convierte la energía mecánica en eléctrica gracias al movimiento de una correa que viene desde el motor. Cuando esta correa está poco tensa, se genera menos electricidad, generando una disminución en la carga de la batería. Si esto sucede, lo sabrás mediante la luz de advertencia o la correspondiente aguja en el panel de instrumentos. Una batería mal cargada hace que el vehículo tenga dificultades para arrancar, especialmente cuando la temperatura es baja. Cuando el motor de tu vehículo no se enciende al darle contacto es muy probable que la batería se encuentre descargada o desconectada. Por otro lado, debes saber que para tu seguridad, todos los accesorios que utilizan electricidad están casi siempre provistos de fusibles para impedir incendios o daños en el sistema eléctrico. Por lo que, si alguna unidad eléctrica deja de funcionar, lo primero que debes revisar es si se ha fundido algún fusible. En el caso de las ampolletas, si alguna no enciende o si la luz de control de los intermitentes destella en forma más rápida que lo habitual, es probable que una ampolleta se haya quemado. Testigo batería Testigo presión de aceite El nivel de líquido en la batería. Agrega agua destilada cuando sea necesario. Que la correa del alternador esté suficientemente tensa. RECUERDA CONTROLAR: Que los cables de la batería estén bien sujetos. La luz de carga durante la conducción. Si se enciende o parpadea es porque hay algún problema. ¡Ten precaución! El ácido de la batería es corrosivo ; cuidado con tu ropa y piel.", "13": "El sistema de combustible Este sistema es el encargado de suministrar combustible al motor para su correcto funcionamiento. Si al conducir sientes un fuerte olor a gasolina debes detenerte para investigar la causa del problema. Así puedes prevenir el riesgo de incendio en tu vehículo. Apagar el motor del vehículo. Evitar la inhalación de vapores emanados por la gasolina. No encender cigarrillos. No hablar por celular. Recuerda usar el octanaje adecuado al motor de tu vehículo, según las indicaciones del fabricante. Evita la apertura de la tapa más veces de lo necesario. Los vapores de la gasolina pueden ser cancerígenos y además son inflamables. Llenar el estanque de combustible cada vez que vayas a recargar. Contaminará menos al liberar menos gases. Evitar frenadas y aceleraciones frecuentes ya que causan alto consumo de combustible. AL CARGAR GASOLINA, RECUERDA: RECOMENDACIONES PARA REDUCIR LA CONTAMINACIÓN ASOCIADA AL COMBUSTIBLE: En el indicador de combustible, la letra E significa vacío, del inglés “Empty”, y la letra F indica, estanque lleno, del inglés “Full”. En el indicador de temperatura, la letra C significa frío, del inglés “Cold”, y la letra H , caliente, del inglés “Hot”. El sistema de refrigeración Este sistema tiene la misión de enfriar el motor para mantener la temperatura adecuadada durante su funcionamiento. Este proceso utiliza un líquido refrigerante (agua destilada más un anticongelante) que circula de manera constante por canales en el bloque del motor y pasa desde ahí al radiador. Cuando hay una obstrucción del sistema de refrigeración, poco líquido refrigerante y/o una correa de la bomba de agua rota o mal tensada, la temperatura del motor se eleva. Si esto sucede, debes detener la marcha y reparar la avería. Hoy en día, la mayoría de los vehículos tiene ventilador eléctrico que se activa al subir la temperatura (especialmente al circular a baja velocidad). Si esto no sucede, puede deberse a un contacto defectuoso, que la correa del ventilador esté dañada o a un fusible dañado. También es importante destacar que a temperaturas bajo cero, el líquido refrigerante debe contener una cantidad suficiente de anticongelante que impida que el motor y el radiador se dañen por efecto de la congelación del agua, asegúrate de usar el tipo de líquido adecuado para tus necesidades.", "14": "El sistema de escape Se trata del conjunto de elementos y conductos que facilitan la expulsión al exterior de los gases que se han generado en la combustión, con el fin de mejorar el rendimiento del motor y su sonoridad. Estos gases de escape contienen sustancias tóxicas, entre ellas se encuentra el monóxido de carbono, un componente venenoso, incoloro e inoloro. Por esta razón, es muy importate revisar el correcto funcionamiento de este sistema, el cual es propenso a oxidación o que se estropee, provocando que este gas penetre en el interior del vehículo, lo mismo puede ocurrir, al conducir con el portaequipaje abierto. Los primeros síntomas de intoxicación con monóxido de carbono, son el dolor de cabeza y los vómitos. A la menor señal de intoxicación, sal del vehículo y respira aire fresco. La transmisión Es el sistema encargado de transferir la potencia que genera el motor a las ruedas del vehículo. Hay vehículos de tracción delantera y de tracción trasera. También hay vehículos de tracción en las cuatro ruedas. Esta energía es dirigida a las ruedas de tracción a través del embrague , el sistema (pedal) que permite la transmisión o interrupción de la energía hacia las ruedas de tracción. Este proceso es moderado por la caja de cambios , donde es posible controlar manualmente el cambio de marchas y la velocidad del automóvil. Un ruido anormalmente alto del tubo de escape suele ser una señal de roturas o de orificios en el silenciador. Debes saber que al conducir presionando el embrague durante un tiempo mayor al necesario se reduce el control sobre el vehículo. Caja de cambios Tracción trasera Tracción delantera Embrague Motor Motor", "15": "Existen diversos tipos de caja de cambios, clasificados en automática y manual , estas son diferenciadas por el uso de la palanca de cambios y, en el caso de los vehículos automáticos, carecer de pedal de embrague. La caja de cambios multiplica la fuerza del motor. Esta puede tener 3, 4, 5 o más marchas. Cada marcha se utiliza en un rango de velocidades, lo que permite optimizar el uso de combustible. La dirección El sistema de dirección se encarga de transmitir el movimiento del volante hacia las ruedas. Para que este proceso requiera el mínimo esfuerzo humano, existe un mecanismo auxiliar llamado servodirección . Debes saber que la dirección se desalinea con mayor rapidez cuando el vehículo es sometido a sobrecargas, así como cuando topa contra el borde de una solera u otro obstáculo, o cae en hoyos. Esto provoca que las ruedas produzcan vibraciones y aumente el desgaste de los neumáticos. Algunas de las señales que te indicarán si hay algún defecto en la dirección, o poca presión de aire en los neumáticos delanteros, son: sentir la dirección pesada, escuchar un chirrido excesivo al doblar o, si al conducir por un terreno plano, el vehículo tiende a irse hacia un lado. La suspensión y la amortiguación Estos sistemas son los encargados de mantener en todo momento el contacto entre los neumáticos y la superficie de la calzada, garantizando la estabilidad del vehículo y proporcionando confort a la persona conductora. Estos sistemas tienen un papel clave para mantener la trayectoria deseada y para absorber las irregularidades del asfalto. Dada su relevancia para nuestra seguridad y la de las demás personas, es importante aprender a supervisar estos sistemas e identificar posibles problemas. Consulta al mecánico si presentan algún indicio de avería. síntomas de amortiguadores en mal estado Al frenar, el vehículo se inclina hacia adelante y se levanta de atrás de forma excesiva. Al circular, el vehículo se balancea demasiado en carreteras en buen estado y se inclina excesivamente al tomar una curva. Al cargar un extremo lateral frontal, el vehículo rebota u oscila. Durante la marcha, se notan significativamente las alteraciones del camino (por ejemplo, los baches) y el viento lateral. Los neumáticos se desgastan irregularmente. Circulando de noche, las luces oscilan de forma llamativa. Es importante revisar periódicamente el estado de los amortiguadores, siguiendo siempre las indicaciones del fabricante del vehículo, y sustituirlos cuando dejen de ser seguros.", "16": "Un amortiguador en malas condiciones puede tener consecuencias peligrosas, como por ejemplo: Vehículo con pérdida de estabilidad, especialmente en curvas, con viento lateral o al circular sobre una superficie mojada. Aumento de la distancia de frenado, sobre todo con pavimento irregular o mojado (si además, el vehículo dispone de frenos ABS, este sistema perderá efectividad). Desgaste y avería con mayor frecuencia de otros elementos del vehículo. Disminución del confort durante la conducción. La fatiga aparece con mayor facilidad en quien conduce. Los frenos El sistema de frenos permite reducir la velocidad del vehículo llegando incluso a su detención, por tanto, es importante efectuar una supervisión y mantenimiento de ellos y saber cómo reaccionar ante una falla total, para evitar un siniestro de tránsito. Todos los vehículos tienen dos sistemas de frenos, que actúan independientemente uno del otro: 1. El freno de servicio (pedal de freno) generalmente es hidráulico y actúa sobre las cuatro ruedas. Los vehículos antiguos tienen solo un sistema de circuito hidráulico, lo que hace que si la tubería del freno se rompe en algún lugar, todo el fluido desaparece, y con ello el efecto de frenado en todas las ruedas. En cambio, los vehículos modernos están equipados con sistemas de frenos de dos circuitos. Así, si se produce una falla en un circuito, se mantiene cierto efecto de frenado en el otro. Muchos automóviles poseen un sistema de servofrenos, que aumenta considera
